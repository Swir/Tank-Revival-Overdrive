name: ROADMAP v13.1 Qualification Finalizer

on:
  push:
    branches: ['dev-v13-1']
    paths: ['.v131-roadmap-qualification-trigger']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact qualified v13.1 candidate
        shell: python
        run: |
          from pathlib import Path
          import json,os,subprocess,urllib.request
          sha=Path('.v131-roadmap-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha.lower()),sha
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha+'..HEAD'],text=True).splitlines()
          allowed={'.github/workflows/roadmap-v131-qualification.yml','.v131-roadmap-qualification-trigger'}
          assert set(changed).issubset(allowed),'Unqualified gameplay/source changes after candidate: '+repr(changed)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+sha+'&per_page=100'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'TankRevival-v131-qualifier'})
          with urllib.request.urlopen(req) as response: data=json.load(response)
          matches=[r for r in data.get('workflow_runs',[]) if r.get('name')=='Dynamic Objective Warfare v13.1 Windows Qualification Gate' and r.get('path')=='.github/workflows/objective-warfare-v131-windows.yml' and r.get('head_sha')==sha and r.get('conclusion')=='success']
          assert matches,'No successful exact v13.1 Windows qualification gate for '+sha
          print('Qualified SHA:',sha,'run:',matches[0]['html_url'])
      - name: Verify implementation and open roadmap state
        shell: bash
        run: |
          set -euo pipefail
          for f in Assets/Scripts/ObjectiveWarfareV131.cs Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs Assets/Scripts/TankGame.cs Assets/Scripts/ConvoyWarfareDirector.cs .github/workflows/objective-warfare-v131-windows.yml CHANGELOG_v13.1.md; do test -f "$f"; done
          test "$(cat VERSION)" = 'v13.1.0-dev'
          grep -q 'PlannedRounds = 100' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'ArchetypeCount = 7' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'public sealed class ObjectiveWarfareDirector' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'V13_1_OBJECTIVE_WARFARE_OK.txt' Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs
          grep -q 'V13_1_WINDOWS_MATRIX_OK.txt' .github/workflows/objective-warfare-v131-windows.yml
          grep -q -- '-tr-v130-smoke' .github/workflows/objective-warfare-v131-windows.yml
          grep -q -- '-tr-v129-smoke' .github/workflows/objective-warfare-v131-windows.yml
          grep -q -- '-tr-v128-smoke' .github/workflows/objective-warfare-v131-windows.yml
          grep -q -- '-demo-ci-soak' .github/workflows/objective-warfare-v131-windows.yml
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-391%2F399' ROADMAP.md
          grep -q 'STATUS-V13.1%20IN%20DEVELOPMENT-yellow' ROADMAP.md
      - name: Finalize v13.1 checklist and dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'; assert len(re.findall(r'^'+re.escape(marker)+r'$',s,re.M))==1
          heading='## v13.1 — Dynamic Objective Warfare & Battlefield Mutators — IN DEVELOPMENT'
          start=s.index(heading); section=s[start:]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED',1).replace('- [ ]','- [x]'); s=s[:start]+section
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(399,0,399),(done,open_,total)
          pct=round(done*100/total,1); bar='█'*20
          s=re.sub(r'ROADMAP-[0-9.]+%25-[A-Za-z0-9]+',f'ROADMAP-{pct:.1f}%25-brightgreen',s,count=1)
          s=re.sub(r'DONE-[0-9]+%2F[0-9]+',f'DONE-{done}%2F{total}',s,count=1)
          s=re.sub(r'STATUS-V13\.1%20IN%20DEVELOPMENT-yellow',r'STATUS-V13.1%20QUALIFIED-brightgreen',s,count=1)
          s=re.sub(r'(?m)^([█░]{20}) [0-9.]+%$',f'{bar} {pct:.1f}%',s,count=1)
          s=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|',f'| **{done}** | **{open_}** | **{total}** | **{pct:.1f}%** |',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify SWIR roadmap v1 consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for t in ['<!-- ROADMAP-PROGRESS:START -->','<!-- ROADMAP-PROGRESS:END -->','## 📊 Overall progress','| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |']: assert t in s,t
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(399,0,399),(done,open_,total)
          assert 'ROADMAP-100.0%25-brightgreen' in s and 'DONE-399%2F399' in s and 'STATUS-V13.1%20QUALIFIED-brightgreen' in s
          assert '████████████████████ 100.0%' in s and '| **399** | **0** | **399** | **100.0%** |' in s
          section=s[s.index('## v13.1 — Dynamic Objective Warfare & Battlefield Mutators — QUALIFIED'):]
          assert section.count('- [x]')==8 and section.count('- [ ]')==0
          print('SWIR roadmap v1 verified: 399/399, 100.0%, v13.1 QUALIFIED')
      - name: Commit qualified roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs(v13.1): qualify dynamic objective warfare milestone"
          git push origin HEAD:dev-v13-1
