name: Frontend HUD Windows Gate

on:
  push:
    branches:
      - 'dev-v7-1'
    paths:
      - '.frontend-hud-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend-hud:
    name: Build v7.1 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate v7.1 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v7.1.0-dev"
          test -f Assets/Scripts/FrontendHudArtDirector.cs
          test -f Assets/Scripts/FrontendHudArtCISmokeProbe.cs
          grep -q "AmmoChipCount = 7" Assets/Scripts/FrontendHudArtDirector.cs
          grep -q "MaxStatusBars = 5" Assets/Scripts/FrontendHudArtDirector.cs
          grep -q -- "-frontend-hud-smoke" Assets/Scripts/FrontendHudArtCISmokeProbe.cs
          echo "v7.1 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: FrontendHUD-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            FrontendHUD-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v7.1-frontend-hud-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v7.1-frontend-hud-Windows-x64.zip

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.1-frontend-hud-Windows-x64
          path: TankRevival-v7.1-frontend-hud-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v7.1 EXE on Windows
    needs: build-frontend-hud
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v7.1-frontend-hud-Windows-x64
          path: candidate

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v7.1-frontend-hud-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }

      - name: Run frontend HUD smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item FRONTEND_HUD_PASS.txt, FRONTEND_HUD_FAIL.txt, FrontendHudPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-frontend-hud-smoke','-logFile','FrontendHudPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Frontend HUD smoke timed out after 60 seconds'
          }
          if (Test-Path 'FRONTEND_HUD_FAIL.txt') {
            Get-Content FRONTEND_HUD_FAIL.txt
            if (Test-Path FrontendHudPlayer.log) { Get-Content FrontendHudPlayer.log -Tail 220 }
            throw 'Frontend HUD runtime probe reported FAIL'
          }
          if (!(Test-Path 'FRONTEND_HUD_PASS.txt')) {
            if (Test-Path FrontendHudPlayer.log) { Get-Content FrontendHudPlayer.log -Tail 220 }
            throw "Runtime exited without frontend HUD PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content FRONTEND_HUD_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Select-String -Path FrontendHudPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
            Get-Content FrontendHudPlayer.log -Tail 260
            throw 'Blocking exception signature found during frontend HUD smoke'
          }
          Write-Host 'v7.1 frontend HUD runtime smoke passed.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.1-frontend-hud-diagnostics
          path: |
            candidate/runtime/FRONTEND_HUD_PASS.txt
            candidate/runtime/FRONTEND_HUD_FAIL.txt
            candidate/runtime/FrontendHudPlayer.log
          if-no-files-found: ignore
          retention-days: 14
