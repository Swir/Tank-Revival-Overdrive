name: Recon Electronic Warfare v12.3 Windows Gate

on:
  push:
    branches: ['dev-v12-3']
    paths:
      - 'Assets/Scripts/ReconElectronicWarfareDirector.cs'
      - 'Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs'
      - 'Assets/Scripts/ReconElectronicWarfareDirector.cs.meta'
      - 'Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs.meta'
      - 'CHANGELOG_v12.3.md'
      - 'VERSION'
      - '.github/workflows/recon-ew-v123-windows.yml'
      - '.v123-qualification-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v12.3 recon, EW and authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/ReconElectronicWarfareDirector.cs
          test -f Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs
          test -f Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          test -f Assets/Scripts/OperationalSustainmentDirector.cs
          test -f Assets/Scripts/TacticalNavigationDirector.cs
          test -f CHANGELOG_v12.3.md
          test "$(cat VERSION)" = 'v12.3.0-dev'
          grep -q 'MaxRelayNodes = 2' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'MaxJammers = 1' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'MaxGuardActors = 3' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'RequiredPacketsForVerified = 2' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'RouteSetIntelMethod' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'AddComponent<Health>' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'RigidbodyType2D.Kinematic' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'WarEconomyDirector.AwardMissionBonds' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'TacticalNavigationAgent' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'V12_3_RECON_EW_SMOKE_OK.txt' Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs
          grep -q 'SignalQualityForState' Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs
          grep -q 'laneCases=' Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs
          if grep -Eq 'SpawnProjectile\(|AddComponent<Projectile>|\.Damage\(' Assets/Scripts/ReconElectronicWarfareDirector.cs; then
            echo 'Recon/EW director contains forbidden projectile/direct-damage authority.' >&2
            exit 1
          fi
          if grep -q 'MovePosition' Assets/Scripts/ReconElectronicWarfareDirector.cs; then
            echo 'Recon/EW director must not own real-column or enemy movement.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(327,8,335),(done,open_,total)
          assert 'ROADMAP-97.6%25-brightgreen' in s
          assert 'DONE-327%2F335' in s
          assert 'STATUS-V12.3%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.6%' in s
          assert '| **327** | **8** | **335** | **97.6%** |' in s
          start=s.index('## v12.3 — Reconnaissance Network & Electronic Counter-Logistics — IN DEVELOPMENT')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0

  build-candidate:
    name: Build exact v12.3 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V123ReconEW-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V123ReconEW-Library-${{ runner.os }}-6000.3.17f1-
            V122RouteIntelligence-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v12.3-recon-ew-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v12.3-recon-ew-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.3-recon-ew-Windows-x64
          path: TankRevivalOverdrive-v12.3-recon-ew-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v12.3 recon EW
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.3-recon-ew-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v12.3-recon-ew-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v12.3 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V12_3_RECON_EW_SMOKE_OK.txt, V12_3_RECON_EW_SMOKE_FAIL.txt, V123ReconEWPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-tr-v123-smoke','-logFile','V123ReconEWPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v12.3 recon/EW smoke timed out after 70 seconds'
          }
          if (Test-Path 'V12_3_RECON_EW_SMOKE_FAIL.txt') {
            Get-Content V12_3_RECON_EW_SMOKE_FAIL.txt
            if (Test-Path V123ReconEWPlayer.log) { Get-Content V123ReconEWPlayer.log -Tail 340 }
            throw 'v12.3 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V12_3_RECON_EW_SMOKE_OK.txt')) {
            if (Test-Path V123ReconEWPlayer.log) { Get-Content V123ReconEWPlayer.log -Tail 340 }
            throw "Runtime exited without v12.3 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V12_3_RECON_EW_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V123ReconEWPlayer.log) {
            if (Select-String -Path V123ReconEWPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V123ReconEWPlayer.log -Tail 360
              throw 'Blocking exception signature found during v12.3 runtime smoke'
            }
          }
          Write-Host 'v12.3 recon/electronic-warfare runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.3-recon-ew-diagnostics
          path: |
            candidate/runtime/V12_3_RECON_EW_SMOKE_OK.txt
            candidate/runtime/V12_3_RECON_EW_SMOKE_FAIL.txt
            candidate/runtime/V123ReconEWPlayer.log
          if-no-files-found: ignore
          retention-days: 14
