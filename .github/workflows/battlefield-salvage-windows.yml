name: Battlefield Salvage Windows Gate

on:
  push:
    branches:
      - 'dev-v8-8'
    paths:
      - '.battlefield-salvage-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-salvage:
    name: Build v8.8 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Validate v8.8 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v8.8.0-dev"
          test -f Assets/Scripts/BattlefieldSalvageDirector.cs
          test -f Assets/Scripts/BattlefieldSalvageCISmokeProbe.cs
          grep -q "IsSalvageEligible" Assets/Scripts/BattlefieldSalvageDirector.cs
          grep -q "FieldAmmoForReserve" Assets/Scripts/BattlefieldSalvageDirector.cs
          grep -q "CounterRecoveryCountForRound" Assets/Scripts/BattlefieldSalvageDirector.cs
          grep -q "TacticalNavigationAgent" Assets/Scripts/BattlefieldSalvageDirector.cs
          grep -q "KeyCode.Z" Assets/Scripts/BattlefieldSalvageDirector.cs
          grep -q "KeyCode.X" Assets/Scripts/BattlefieldSalvageDirector.cs
          grep -q -- "-battlefield-salvage-smoke" Assets/Scripts/BattlefieldSalvageCISmokeProbe.cs
          echo "v8.8 source gate passed."
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: BattlefieldSalvage-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            BattlefieldSalvage-Library-${{ runner.os }}-6000.3.17f1-
            SupplyRoutes-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v8.8-battlefield-salvage-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v8.8-battlefield-salvage-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v8.8-battlefield-salvage-Windows-x64
          path: TankRevival-v8.8-battlefield-salvage-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v8.8 EXE on Windows
    needs: build-salvage
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v8.8-battlefield-salvage-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v8.8-battlefield-salvage-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }
      - name: Run battlefield-salvage smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item BATTLEFIELD_SALVAGE_PASS.txt, BATTLEFIELD_SALVAGE_FAIL.txt, BattlefieldSalvagePlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-battlefield-salvage-smoke','-logFile','BattlefieldSalvagePlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Battlefield-salvage smoke timed out after 60 seconds'
          }
          if (Test-Path 'BATTLEFIELD_SALVAGE_FAIL.txt') {
            Get-Content BATTLEFIELD_SALVAGE_FAIL.txt
            if (Test-Path BattlefieldSalvagePlayer.log) { Get-Content BattlefieldSalvagePlayer.log -Tail 280 }
            throw 'Battlefield-salvage runtime probe reported FAIL'
          }
          if (!(Test-Path 'BATTLEFIELD_SALVAGE_PASS.txt')) {
            if (Test-Path BattlefieldSalvagePlayer.log) { Get-Content BattlefieldSalvagePlayer.log -Tail 280 }
            throw 'Battlefield-salvage PASS marker missing'
          }
          Get-Content BATTLEFIELD_SALVAGE_PASS.txt
