name: Terrain Intelligence Windows Gate

on:
  push:
    branches:
      - 'dev-v7-4'
    paths:
      - '.terrain-intelligence-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-terrain-intelligence:
    name: Build v7.4 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate v7.4 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v7.4.0-dev"
          test -f Assets/Scripts/TerrainIntelligenceDirector.cs
          test -f Assets/Scripts/TerrainIntelligenceCISmokeProbe.cs
          grep -q "CoverSearchRadius = 7.5f" Assets/Scripts/TerrainIntelligenceDirector.cs
          grep -q "BreachCorridorWidth = 0.72f" Assets/Scripts/TerrainIntelligenceDirector.cs
          grep -q "MaxBreachActorsPerBeat = 4" Assets/Scripts/TerrainIntelligenceDirector.cs
          grep -q "AmmoType.Explosive" Assets/Scripts/TerrainIntelligenceDirector.cs
          grep -q "TryRefineOrder" Assets/Scripts/TacticalNavigationDirector.cs
          grep -q "ObstacleKind.Brick" Assets/Scripts/TerrainIntelligenceDirector.cs
          grep -q -- "-terrain-intelligence-smoke" Assets/Scripts/TerrainIntelligenceCISmokeProbe.cs
          echo "v7.4 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: TerrainIntelligence-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            TerrainIntelligence-Library-${{ runner.os }}-6000.3.17f1-
            TacticalNavigation-Library-${{ runner.os }}-6000.3.17f1-
            SquadAI-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v7.4-terrain-intelligence-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v7.4-terrain-intelligence-Windows-x64.zip

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.4-terrain-intelligence-Windows-x64
          path: TankRevival-v7.4-terrain-intelligence-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v7.4 EXE on Windows
    needs: build-terrain-intelligence
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v7.4-terrain-intelligence-Windows-x64
          path: candidate

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v7.4-terrain-intelligence-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }

      - name: Run terrain intelligence smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item TERRAIN_INTELLIGENCE_PASS.txt, TERRAIN_INTELLIGENCE_FAIL.txt, TerrainIntelligencePlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-terrain-intelligence-smoke','-logFile','TerrainIntelligencePlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Terrain intelligence smoke timed out after 60 seconds'
          }
          if (Test-Path 'TERRAIN_INTELLIGENCE_FAIL.txt') {
            Get-Content TERRAIN_INTELLIGENCE_FAIL.txt
            if (Test-Path TerrainIntelligencePlayer.log) { Get-Content TerrainIntelligencePlayer.log -Tail 220 }
            throw 'Terrain intelligence runtime probe reported FAIL'
          }
          if (!(Test-Path 'TERRAIN_INTELLIGENCE_PASS.txt')) {
            if (Test-Path TerrainIntelligencePlayer.log) { Get-Content TerrainIntelligencePlayer.log -Tail 220 }
            throw "Runtime exited without terrain intelligence PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content TERRAIN_INTELLIGENCE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Select-String -Path TerrainIntelligencePlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
            Get-Content TerrainIntelligencePlayer.log -Tail 260
            throw 'Blocking exception signature found during terrain intelligence smoke'
          }
          Write-Host 'v7.4 terrain intelligence runtime smoke passed.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.4-terrain-intelligence-diagnostics
          path: |
            candidate/runtime/TERRAIN_INTELLIGENCE_PASS.txt
            candidate/runtime/TERRAIN_INTELLIGENCE_FAIL.txt
            candidate/runtime/TerrainIntelligencePlayer.log
          if-no-files-found: ignore
          retention-days: 14
