name: Fire Control Ballistics v11.2 Windows Gate

on:
  push:
    branches:
      - 'dev-v11-2'
    paths:
      - '.fire-control-ballistics-v112-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v11.2 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v11.2 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v11.2.0-dev"
          test -f Assets/Scripts/FireControlBallisticsDirector.cs
          test -f Assets/Scripts/FireControlBallisticsCISmokeProbe.cs
          grep -q 'MinAccuracy = 0.58f' Assets/Scripts/FireControlBallisticsDirector.cs
          grep -q 'MaxSpreadDegrees = 7.5f' Assets/Scripts/FireControlBallisticsDirector.cs
          grep -q 'MaxLeadSeconds = 1.25f' Assets/Scripts/FireControlBallisticsDirector.cs
          grep -q 'CoordinatedVolleyWindow = 0.72f' Assets/Scripts/FireControlBallisticsDirector.cs
          grep -q 'FireControlStabilization' Assets/Scripts/PlayerTank.cs
          grep -q 'FireControlBallisticsDirector.ApplySpread' Assets/Scripts/PlayerTank.cs
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v112-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v112-Library-${{ runner.os }}-6000.3.17f1-
            v111-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v11.2-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v11.2-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.2-candidate-Windows-x64
          path: TankRevivalOverdrive-v11.2-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v11.2 candidate and validate fire-control reforge
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.2-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v11.2-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v11.2 Fire Control packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item FIRE_CONTROL_BALLISTICS_PASS.txt, FIRE_CONTROL_BALLISTICS_FAIL.txt, FireControlPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-fire-control-ballistics-smoke','-logFile','FireControlPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v11.2 Fire Control smoke timed out after 60 seconds'
          }
          if (Test-Path 'FIRE_CONTROL_BALLISTICS_FAIL.txt') {
            Get-Content FIRE_CONTROL_BALLISTICS_FAIL.txt
            if (Test-Path FireControlPlayer.log) { Get-Content FireControlPlayer.log -Tail 280 }
            throw 'v11.2 Fire Control runtime probe reported FAIL'
          }
          if (!(Test-Path 'FIRE_CONTROL_BALLISTICS_PASS.txt')) {
            if (Test-Path FireControlPlayer.log) { Get-Content FireControlPlayer.log -Tail 280 }
            throw "Runtime exited without v11.2 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content FIRE_CONTROL_BALLISTICS_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path FireControlPlayer.log) {
            if (Select-String -Path FireControlPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content FireControlPlayer.log -Tail 300
              throw 'Blocking exception signature found during v11.2 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v11.2-fire-control-diagnostics
          path: |
            candidate/runtime/FIRE_CONTROL_BALLISTICS_PASS.txt
            candidate/runtime/FIRE_CONTROL_BALLISTICS_FAIL.txt
            candidate/runtime/FireControlPlayer.log
          if-no-files-found: ignore
          retention-days: 14
