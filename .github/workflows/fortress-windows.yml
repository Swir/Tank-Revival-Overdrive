name: Orzelek Fortress Windows Gate

on:
  push:
    branches:
      - 'dev-v5-8'
    paths:
      - '.dev-build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fortress-candidate:
    name: Compile v5.8 Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Fortress-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Fortress-Library-${{ runner.os }}-6000.3.17f1-
            BossGen-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable
        shell: bash
        run: |
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
      - name: Pack exact candidate
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v5.8-fortress-Windows-x64.zip .
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v5.8-fortress-Windows-x64
          path: TankRevivalOverdrive-v5.8-fortress-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  fortress-runtime-smoke:
    name: Boot packaged EXE and verify v5.8 fortress systems
    needs: build-fortress-candidate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v5.8-fortress-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v5.8-fortress-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
      - name: Run v5.8 fortress smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item FORTRESS_PASS.txt, FORTRESS_FAIL.txt, FortressPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-fortress-smoke','-logFile','FortressPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Fortress smoke timed out after 60 seconds' }
          if (Test-Path 'FORTRESS_FAIL.txt') { Get-Content FORTRESS_FAIL.txt; if (Test-Path FortressPlayer.log) { Get-Content FortressPlayer.log -Tail 180 }; throw 'Fortress runtime probe reported FAIL' }
          if (!(Test-Path 'FORTRESS_PASS.txt')) { if (Test-Path FortressPlayer.log) { Get-Content FortressPlayer.log -Tail 180 }; throw "Runtime exited without fortress PASS marker (exit=$($p.ExitCode))" }
          Get-Content FORTRESS_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path FortressPlayer.log) {
            if (Select-String -Path FortressPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException' -Quiet) { Get-Content FortressPlayer.log -Tail 220; throw 'Blocking exception signature found during v5.8 fortress runtime smoke' }
          }
          Write-Host 'v5.8 fortress runtime smoke passed.'
      - name: Upload fortress diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v5.8-fortress-diagnostics
          path: |
            candidate/runtime/FORTRESS_PASS.txt
            candidate/runtime/FORTRESS_FAIL.txt
            candidate/runtime/FortressPlayer.log
          if-no-files-found: ignore
          retention-days: 14
