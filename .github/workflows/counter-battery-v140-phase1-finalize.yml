name: Counter-Battery v14.0 Phase-One Finalizer

on:
  push:
    branches: ['dev-v14-0']
    paths:
      - 'VERSION'
      - 'Assets/Scripts/CounterBatteryWarfareV140.cs'
      - 'Tools/verify_v140_counter_battery.py'
      - 'Tools/finalize_v140_phase1.py'
      - '.github/workflows/counter-battery-v140-phase1-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v140-phase1-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-phase-one:
    name: Verify implementation and close only v14.0 phase-one deliverables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source before changing roadmap state
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Tools/verify_v140_counter_battery.py Tools/finalize_v140_phase1.py Tools/verify_csharp_type_uniqueness.py Tools/generate_progress_svgs.py Tools/swir_visual_report_guard.py
          python Tools/verify_v140_counter_battery.py
          python Tools/verify_csharp_type_uniqueness.py
          git diff --check
      - name: Close only verified phase-one scope
        run: python Tools/finalize_v140_phase1.py
      - name: Regenerate and verify SWIR progress presentation
        shell: bash
        run: |
          set -euo pipefail
          python Tools/generate_progress_svgs.py --write
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --fix --check
          python Tools/generate_progress_svgs.py --check
          python Tools/verify_v140_counter_battery.py
      - name: Verify truthful partial milestone state
        shell: python
        run: |
          from pathlib import Path
          import re
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^- \[x\] ', roadmap, re.M)) == 466
          assert len(re.findall(r'^- \[ \] ', roadmap, re.M)) == 5
          assert '| **466** | **5** | **471** | **98.9%** |' in roadmap
          assert 'V14.0%20IN%20DEVELOPMENT' in roadmap
          assert '**466 / 471 completed (98.9%)**' in readme
          assert 'Latest qualified milestone | **v13.9**' in readme
          print('v14.0 phase-one roadmap contract: PASS — 466/471 (98.9%)')
      - name: Commit verified phase-one progress when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md ROADMAP.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg; then
            echo 'Phase one already reflected; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg
          git commit -m 'roadmap(v14.0): close source-verified counter-battery phase one'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
