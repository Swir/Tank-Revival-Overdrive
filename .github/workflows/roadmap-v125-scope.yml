name: ROADMAP v12.5 Scope Registrar

on:
  push:
    branches: ['dev-v12-5']
    paths: ['.v125-scope-trigger']

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register scope
        run: python Tools/register_v125_scope.py
      - name: Commit roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(v12.5): register SIGINT fire-support scope"
          git push origin HEAD:dev-v12-5
