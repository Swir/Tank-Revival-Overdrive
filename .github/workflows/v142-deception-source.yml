name: v14.2 Deception Source Qualification

on:
  push:
    branches: ['dev-v14-2']
    paths:
      - 'Assets/Scripts/CounterReconDeceptionV142.cs'
      - 'Assets/Scripts/CounterBatteryWarfareV140.cs'
      - 'Assets/Scripts/CounterObservationWarfareV141.cs'
      - 'Tools/verify_v142_deception.py'
  pull_request:
    branches: ['dev-v14-1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Verify v14.2 deception / EMCON source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and authority bounds
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Tools/verify_v142_deception.py
          python Tools/verify_v142_deception.py
          git diff --check
