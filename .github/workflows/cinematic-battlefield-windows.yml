name: Cinematic Battlefield Windows Gate

on:
  push:
    branches:
      - dev-v6-6
    paths:
      - '.cinematic-battlefield-trigger'
      - 'Assets/Scripts/CinematicBattlefieldDirector.cs'
      - 'Assets/Scripts/CinematicBattlefieldCISmokeProbe.cs'
      - '.github/workflows/cinematic-battlefield-windows.yml'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cinematic-battlefield:
    name: Build cinematic battlefield candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate v6.6 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v6.6.0-dev"
          test -f Assets/Scripts/CinematicBattlefieldDirector.cs
          test -f Assets/Scripts/CinematicBattlefieldCISmokeProbe.cs
          grep -q "SectorCount = 10" Assets/Scripts/CinematicBattlefieldDirector.cs
          grep -q "MaxCameraOffset = 0.42f" Assets/Scripts/CinematicBattlefieldDirector.cs
          grep -q "MaxTrackMarks = 48" Assets/Scripts/CinematicBattlefieldDirector.cs
          grep -q -- "-cinematic-battlefield-smoke" Assets/Scripts/CinematicBattlefieldCISmokeProbe.cs
          echo "v6.6 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Cinematic-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Dev-Library-${{ runner.os }}-6000.3.17f1-
            Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify executable
        shell: bash
        run: |
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data

      - name: Pack exact candidate
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r ../../cinematic-battlefield-candidate.zip .
          cd ../..
          test -s cinematic-battlefield-candidate.zip

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-battlefield-candidate
          path: cinematic-battlefield-candidate.zip
          if-no-files-found: error
          retention-days: 14

  windows-runtime-smoke:
    name: Boot cinematic battlefield candidate on Windows
    needs: build-cinematic-battlefield
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: cinematic-battlefield-candidate
          path: candidate

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive candidate/cinematic-battlefield-candidate.zip -DestinationPath candidate/runtime -Force
          if (!(Test-Path 'candidate/runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing' }

      - name: Run cinematic battlefield smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item CINEMATIC_BATTLEFIELD_PASS.txt, CINEMATIC_BATTLEFIELD_FAIL.txt, Player.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-cinematic-battlefield-smoke','-logFile','Player.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Cinematic battlefield smoke timed out'
          }
          if (Test-Path 'CINEMATIC_BATTLEFIELD_FAIL.txt') {
            Get-Content CINEMATIC_BATTLEFIELD_FAIL.txt
            if (Test-Path Player.log) { Get-Content Player.log -Tail 180 }
            throw 'Cinematic battlefield runtime smoke reported FAIL'
          }
          if (!(Test-Path 'CINEMATIC_BATTLEFIELD_PASS.txt')) {
            if (Test-Path Player.log) { Get-Content Player.log -Tail 180 }
            throw "Runtime exited without PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content CINEMATIC_BATTLEFIELD_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned $($p.ExitCode)" }
          if (Select-String -Path Player.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
            Get-Content Player.log -Tail 220
            throw 'Blocking exception signature found in Player.log'
          }
