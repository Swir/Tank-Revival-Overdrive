name: Demo 2 Candidate Windows

on:
  push:
    branches:
      - 'dev-v7-0'
    paths:
      - '.demo2-build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo2-candidate:
    name: Build and validate Demo 2 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate Demo 2 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v7.0.0-rc1"
          test -f Assets/Scripts/Demo2PlayerExperienceDirector.cs
          test -f Assets/Scripts/Demo2CISmokeProbe.cs
          test -f Assets/Scripts/DemoExperienceDirector.cs
          test -f Assets/Scripts/CombatReadabilityDirector.cs
          test -f Assets/Scripts/DemoCISoakProbe.cs
          test -f Assets/Scripts/RuntimeStabilityDirector.cs
          grep -q "CoachingRoundLimit = 10" Assets/Scripts/Demo2PlayerExperienceDirector.cs
          grep -q "CombatHudDensity.Minimal" Assets/Scripts/Demo2PlayerExperienceDirector.cs
          grep -q -- "-demo2-ci-smoke" Assets/Scripts/Demo2CISmokeProbe.cs
          grep -q -- "-demo-ci-soak" Assets/Scripts/DemoCISoakProbe.cs
          grep -q "80, 90, 100" Assets/Scripts/DemoCISoakProbe.cs
          grep -q "BuildDemoCandidate" Assets/Editor/CIBuild.cs
          echo "Demo 2 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Demo2-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Demo2-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
            Library-${{ runner.os }}-6000.3.17f1-

      - name: Build non-development Demo 2 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildDemoCandidate
          allowDirtyBuild: true

      - name: Validate packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          test -f "$root/BUILD_INFO.txt"
          test -f "$root/DEMO_MANIFEST.txt"
          test -f "$root/README_DEMO.txt"
          grep -q "PUBLIC DEMO CANDIDATE" "$root/BUILD_INFO.txt"
          grep -q "Build: 7.0.0-rc1" "$root/BUILD_INFO.txt"
          grep -q "Demo candidate: 7.0.0-rc1" "$root/DEMO_MANIFEST.txt"
          grep -q "Commit: $GITHUB_SHA" "$root/DEMO_MANIFEST.txt"
          test -s "$root/TankRevivalOverdrive.exe"
          echo "Demo 2 packaged runtime gate passed."

      - name: Pack Demo 2 candidate
        shell: bash
        run: |
          set -euo pipefail
          archive=TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64.zip
          cd build/StandaloneWindows64
          zip -r "../../$archive" .
          cd ../..
          test -s "$archive"
          sha256sum "$archive" | tee "$archive.sha256"

      - name: Upload Demo 2 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64
          path: |
            TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64.zip
            TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-runtime-smoke:
    name: Boot exact Demo 2 EXE on Windows
    needs: build-demo2-candidate
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64
          path: candidate

      - name: Verify checksum and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          $zip = 'TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64.zip'
          $expected = (Get-Content "$zip.sha256").Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected.ToLowerInvariant() -ne $actual) { throw "Checksum mismatch: $expected != $actual" }
          Expand-Archive $zip -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }

      - name: Run Demo 2 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item DEMO2_SMOKE_PASS.txt, DEMO2_SMOKE_FAIL.txt, Player.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-demo2-ci-smoke','-logFile','Player.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Demo 2 standalone smoke timed out after 70 seconds'
          }
          if (Test-Path 'DEMO2_SMOKE_FAIL.txt') {
            Get-Content DEMO2_SMOKE_FAIL.txt
            if (Test-Path Player.log) { Get-Content Player.log -Tail 220 }
            throw 'Demo 2 runtime smoke reported FAIL'
          }
          if (!(Test-Path 'DEMO2_SMOKE_PASS.txt')) {
            if (Test-Path Player.log) { Get-Content Player.log -Tail 220 }
            throw "Runtime exited without Demo 2 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content DEMO2_SMOKE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path Player.log) {
            if (Select-String -Path Player.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
              Get-Content Player.log -Tail 260
              throw 'Blocking exception signature found in Demo 2 Player.log'
            }
          }
          Write-Host 'Exact packaged Demo 2 EXE runtime smoke passed.'

      - name: Upload Demo 2 smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-DEMO2-v7.0.0-rc1-smoke-diagnostics
          path: |
            candidate/runtime/DEMO2_SMOKE_PASS.txt
            candidate/runtime/DEMO2_SMOKE_FAIL.txt
            candidate/runtime/Player.log
          if-no-files-found: ignore
          retention-days: 14

  windows-late-round-soak:
    name: Qualify exact Demo 2 EXE through rounds 80/90/100
    needs: windows-runtime-smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64
          path: candidate

      - name: Verify checksum and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          $zip = 'TankRevival-Orzel-Overdrive-DEMO2-v7.0.0-rc1-Windows-x64.zip'
          $expected = (Get-Content "$zip.sha256").Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected.ToLowerInvariant() -ne $actual) { throw "Checksum mismatch: $expected != $actual" }
          Expand-Archive $zip -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }

      - name: Run packaged late-round qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item DEMO_SOAK_PASS.txt, DEMO_SOAK_FAIL.txt, SoakPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-demo-ci-soak','-logFile','SoakPlayer.log' -PassThru
          if (!$p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Demo 2 late-round soak timed out after 120 seconds'
          }
          if (Test-Path 'DEMO_SOAK_FAIL.txt') {
            Get-Content DEMO_SOAK_FAIL.txt
            if (Test-Path SoakPlayer.log) { Get-Content SoakPlayer.log -Tail 280 }
            throw 'Demo 2 late-round qualification reported FAIL'
          }
          if (!(Test-Path 'DEMO_SOAK_PASS.txt')) {
            if (Test-Path SoakPlayer.log) { Get-Content SoakPlayer.log -Tail 280 }
            throw "Runtime exited without soak PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content DEMO_SOAK_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path SoakPlayer.log) {
            if (Select-String -Path SoakPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
              Get-Content SoakPlayer.log -Tail 300
              throw 'Blocking exception signature found during Demo 2 late-round qualification'
            }
          }
          Write-Host 'Exact packaged Demo 2 late-round 80/90/100 qualification passed.'

      - name: Upload soak diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-DEMO2-v7.0.0-rc1-soak-diagnostics
          path: |
            candidate/runtime/DEMO_SOAK_PASS.txt
            candidate/runtime/DEMO_SOAK_FAIL.txt
            candidate/runtime/SoakPlayer.log
          if-no-files-found: ignore
          retention-days: 14
