name: Smoke v14.3 Windows Qualification Gate

on:
  push:
    branches: ['dev-v14-3']
    paths:
      - 'Assets/Scripts/BattlefieldSmokeScreenV143.cs'
      - 'Assets/Scripts/BattlefieldSmokePresentationV143.cs'
      - 'Assets/Scripts/BattlefieldSmokeCISmokeProbeV143.cs'
      - 'Assets/Scripts/CounterReconDeceptionV142.cs'
      - 'Assets/Scripts/CounterReconDeceptionCISmokeProbeV142.cs'
      - 'Assets/Scripts/CounterObservationWarfareV141.cs'
      - 'Assets/Scripts/CounterObservationCISmokeProbeV141.cs'
      - 'Assets/Scripts/CounterBatteryWarfareV140.cs'
      - 'Assets/Scripts/CounterBatteryCISmokeProbeV140.cs'
      - 'Assets/Scripts/BattlefieldFireSupportV139.cs'
      - 'Assets/Scripts/BattlefieldFireSupportCISmokeProbe.cs'
      - 'Assets/Scripts/RuntimeBattleRegistry.cs'
      - 'Assets/Scripts/TankGame.cs'
      - 'Assets/Scripts/DemoCISoakProbe.cs'
      - 'Assets/Editor/CIBuild.cs'
      - '.github/scripts/package_v143_smoke.py'
      - '.github/scripts/test_package_v143_smoke.py'
      - '.github/workflows/smoke-v143-windows.yml'
      - 'Tools/verify_v143_smoke_screen.py'
      - 'Tools/verify_v143_presentation.py'
      - 'Tools/verify_v143_runtime_gate.py'
      - 'Tools/verify_csharp_type_uniqueness.py'
      - 'Tools/verify_production_audio_assets.py'
      - 'Tools/verify_unity_ci_bootstrap.py'
      - 'Tools/generate_progress_svgs.py'
      - 'Tools/swir_visual_report_guard.py'
      - 'ROADMAP.md'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.17f1
  CANDIDATE_ZIP: TankRevivalOverdrive-v14.3-smoke-Windows-x64.zip
  PACKAGE_DIR: tro-v143-package

jobs:
  source-contracts:
    name: Verify v14.3 runtime, authority, performance, progress and package contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source/package contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v14-3'
          test "$(cat VERSION)" = 'v14.3.0-dev'
          python -m py_compile \
            .github/scripts/package_v143_smoke.py \
            .github/scripts/test_package_v143_smoke.py \
            Tools/verify_v143_smoke_screen.py \
            Tools/verify_v143_presentation.py \
            Tools/verify_v143_runtime_gate.py \
            Tools/verify_csharp_type_uniqueness.py \
            Tools/verify_production_audio_assets.py \
            Tools/verify_unity_ci_bootstrap.py \
            Tools/generate_progress_svgs.py \
            Tools/swir_visual_report_guard.py
          python .github/scripts/test_package_v143_smoke.py
          python Tools/verify_v143_smoke_screen.py
          python Tools/verify_v143_presentation.py
          python Tools/verify_v143_runtime_gate.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/verify_production_audio_assets.py
          python Tools/verify_unity_ci_bootstrap.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          git diff --check
      - name: Verify clean Unity qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/smoke-v143-windows.yml'
          grep -Fq 'Enforce clean Unity qualification state' "$workflow"
          cache_action='actions/'"cache@"
          if grep -Fq "uses: ${cache_action}" "$workflow"; then
            echo 'Qualification must not use Unity Library caches.' >&2
            exit 1
          fi
          restore_key='restore'"-keys:"
          if grep -Fq "$restore_key" "$workflow"; then
            echo 'Cross-candidate restore keys are forbidden.' >&2
            exit 1
          fi
      - name: Verify v14.3 roadmap scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', roadmap, re.M))
          open_ = len(re.findall(r'^- \[ \] ', roadmap, re.M))
          total = done + open_
          if total != 495 or not (487 <= done <= 495):
              raise SystemExit(f'v14.3 gate expected 487-495/495; found {done}/{total} with {open_} open')
          if '## v14.3 — Smoke Screening & Break-Contact Warfare — ' not in roadmap:
              raise SystemExit('v14.3 milestone heading missing')
          print(f'v14.3 roadmap state accepted: {done}/{total}')
          PY

  build-candidate:
    name: Build and package one exact v14.3 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Enforce clean Unity qualification state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          rm -rf Library Temp obj
          test ! -e Library
          test ! -e Temp
          echo 'Exact v14.3 qualification starts from a clean Unity import state.'
      - name: Build development player once
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Discover, stage and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/package_v143_smoke.py \
            --build-root build \
            --output-dir "${RUNNER_TEMP}/${PACKAGE_DIR}" \
            --candidate-sha "${GITHUB_SHA}" \
            --commit-sha "${GITHUB_SHA}" \
            --unity-version "${UNITY_VERSION}" \
            --version-file VERSION \
            --zip-name "${CANDIDATE_ZIP}" \
            --diagnostics-path "${GITHUB_WORKSPACE}/V143_SMOKE_BUILD_TREE.txt"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v14.3-smoke-build-discovery
          path: V143_SMOKE_BUILD_TREE.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v14.3-smoke-Windows-x64
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/${{ env.CANDIDATE_ZIP }}
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V143_SMOKE_SHA256.txt
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V143_SMOKE_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14

  packaged-exe-regression:
    name: Run v14.3 plus v14.2-v13.9 and 80/90/100 regression on the same EXE
    needs: [source-contracts, build-candidate]
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v14.3-smoke-Windows-x64
          path: candidate
      - name: Verify exact package provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location candidate
          $zip='${{ env.CANDIDATE_ZIP }}'
          $expected=((Get-Content V143_SMOKE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw 'candidate ZIP digest mismatch'}
          $p=Get-Content V143_SMOKE_PROVENANCE.json -Raw|ConvertFrom-Json
          if($p.candidate_sha -ne '${{ github.sha }}' -or
             $p.commit_sha -ne '${{ github.sha }}' -or
             $p.sha256 -ne $actual -or
             $p.version -ne 'v14.3.0-dev'){
            throw 'candidate provenance mismatch'
          }
          Expand-Archive $zip -DestinationPath runtime -Force
          if(!(Test-Path runtime/TankRevivalOverdrive.exe) -or !(Test-Path runtime/TankRevivalOverdrive_Data)){
            throw 'packaged Unity runtime incomplete'
          }
          $info=Get-Content runtime/V143_SMOKE_BUILD.txt -Raw
          if($info -notmatch 'candidate_sha=${{ github.sha }}'){throw 'runtime attribution mismatch'}
          Write-Host "Verified exact v14.3 candidate SHA256: $actual"
      - name: Run exact single-binary qualification matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location candidate/runtime
          $blocking='Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException'
          function Invoke-Smoke([string]$Name,[string]$Flag,[string]$Pass,[string]$Fail,[string]$Log,[int]$TimeoutMs){
            Remove-Item $Pass,$Fail,$Log -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics',$Flag,'-logFile',$Log -PassThru
            if(!$p.WaitForExit($TimeoutMs)){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$Name timed out"
            }
            if(Test-Path $Fail){
              Get-Content $Fail
              if(Test-Path $Log){Get-Content $Log -Tail 350}
              throw "$Name emitted FAIL"
            }
            if(!(Test-Path $Pass)){
              if(Test-Path $Log){Get-Content $Log -Tail 350}
              throw "$Name exited without PASS (exit=$($p.ExitCode))"
            }
            if($p.ExitCode -ne 0){throw "$Name non-zero exit $($p.ExitCode)"}
            if(Test-Path $Log){
              if(Select-String -Path $Log -Pattern $blocking -Quiet){
                Get-Content $Log -Tail 400
                throw "$Name blocking exception signature"
              }
            }
            Get-Content $Pass
            Write-Host "$Name PASS"
          }
          Invoke-Smoke 'production authored-audio presentation preflight' '-production-presentation-smoke' 'PRODUCTION_PRESENTATION_PASS.txt' 'PRODUCTION_PRESENTATION_FAIL.txt' 'V143ProductionAudio.log' 80000
          Invoke-Smoke 'v14.3 smoke and break-contact warfare' '-tr-v143-smoke' 'V14_3_SMOKE_OK.txt' 'V14_3_SMOKE_FAIL.txt' 'V143Player.log' 90000
          Invoke-Smoke 'v14.2 deception regression' '-tr-v142-smoke' 'V14_2_DECEPTION_OK.txt' 'V14_2_DECEPTION_FAIL.txt' 'V142Regression.log' 90000
          Invoke-Smoke 'v14.1 counter-observation regression' '-tr-v141-smoke' 'V14_1_COUNTER_OBSERVATION_OK.txt' 'V14_1_COUNTER_OBSERVATION_FAIL.txt' 'V141Regression.log' 90000
          Invoke-Smoke 'v14.0 counter-battery regression' '-tr-v140-smoke' 'V14_0_COUNTER_BATTERY_OK.txt' 'V14_0_COUNTER_BATTERY_FAIL.txt' 'V140Regression.log' 90000
          Invoke-Smoke 'v13.9 fire-support regression' '-tr-v139-smoke' 'V13_9_FIRE_SUPPORT_OK.txt' 'V13_9_FIRE_SUPPORT_FAIL.txt' 'V139Regression.log' 90000
          Invoke-Smoke 'round 80/90/100 soak regression' '-demo-ci-soak' 'DEMO_SOAK_PASS.txt' 'DEMO_SOAK_FAIL.txt' 'V143Soak.log' 110000
          'v14.3 exact-candidate qualification matrix PASS' | Set-Content V14_3_WINDOWS_MATRIX_OK.txt
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v14.3-smoke-diagnostics
          path: |
            candidate/runtime/PRODUCTION_PRESENTATION_PASS.txt
            candidate/runtime/PRODUCTION_PRESENTATION_FAIL.txt
            candidate/runtime/V14_3_SMOKE_OK.txt
            candidate/runtime/V14_3_SMOKE_FAIL.txt
            candidate/runtime/V14_2_DECEPTION_OK.txt
            candidate/runtime/V14_2_DECEPTION_FAIL.txt
            candidate/runtime/V14_1_COUNTER_OBSERVATION_OK.txt
            candidate/runtime/V14_1_COUNTER_OBSERVATION_FAIL.txt
            candidate/runtime/V14_0_COUNTER_BATTERY_OK.txt
            candidate/runtime/V14_0_COUNTER_BATTERY_FAIL.txt
            candidate/runtime/V13_9_FIRE_SUPPORT_OK.txt
            candidate/runtime/V13_9_FIRE_SUPPORT_FAIL.txt
            candidate/runtime/DEMO_SOAK_PASS.txt
            candidate/runtime/DEMO_SOAK_FAIL.txt
            candidate/runtime/V14_3_WINDOWS_MATRIX_OK.txt
            candidate/runtime/V143ProductionAudio.log
            candidate/runtime/V143Player.log
            candidate/runtime/V142Regression.log
            candidate/runtime/V141Regression.log
            candidate/runtime/V140Regression.log
            candidate/runtime/V139Regression.log
            candidate/runtime/V143Soak.log
          if-no-files-found: ignore
          retention-days: 14
