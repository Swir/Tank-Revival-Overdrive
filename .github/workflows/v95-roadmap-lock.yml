name: ROADMAP v9.5 Qualification Lock

on:
  push:
    branches:
      - 'dev-v9-5'
    paths:
      - '.roadmap-v95-lock-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  lock-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v9-5
          fetch-depth: 0
      - name: Require green v9.5 Windows gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gate=$(gh run list --branch dev-v9-5 --workflow fire-mission-network-windows.yml --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')
          dev=$(gh run list --branch dev-v9-5 --workflow dev-windows-build.yml --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')
          test -n "$gate"
          test -n "$dev"
          echo "v9.5 gate=$gate dev=$dev"
      - name: Close v9.5 roadmap scope
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          heading = '## v9.5 — Fire Mission Networks, Decoy Batteries & Counter-Surveillance — IN PROGRESS'
          assert heading in s
          start = s.index(heading)
          end = s.index('\n## Development rules', start)
          section = s[start:end]
          assert section.count('- [ ] ') == 4
          section = section.replace(' — IN PROGRESS', ' — COMPLETE', 1).replace('- [ ] ', '- [x] ')
          s = s[:start] + section + s[end:]
          s = s.replace('ROADMAP-98.1%25-d29922', 'ROADMAP-100.0%25-2ea043')
          s = s.replace('DONE-202%2F206-1f6feb', 'DONE-206%2F206-1f6feb')
          s = s.replace('STATUS-V9.5%20IN%20PROGRESS-d29922', 'STATUS-V9.5%20QUALIFIED-2ea043')
          s = s.replace('████████████████████ 98.1%', '████████████████████ 100.0%', 1)
          s = s.replace('| **202** | **4** | **206** | **98.1%** |', '| **206** | **0** | **206** | **100.0%** |', 1)
          p.write_text(s, encoding='utf-8')
      - name: Re-read and verify SWIR dashboard consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('ROADMAP.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', s, re.M))
          open_ = len(re.findall(r'^- \[ \] ', s, re.M))
          assert (done, open_) == (206, 0), (done, open_)
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert 'badge.svg?branch=dev-v9-5' in s
          assert 'ROADMAP-100.0%25-2ea043' in s
          assert 'DONE-206%2F206-1f6feb' in s
          assert 'STATUS-V9.5%20QUALIFIED-2ea043' in s
          assert '## 📊 Overall progress' in s
          assert '████████████████████ 100.0%' in s
          assert '| **206** | **0** | **206** | **100.0%** |' in s
          bar = re.search(r'```text\n([^\n]+)\n```', s).group(1).split()[0]
          assert len(bar) == 20, (bar, len(bar))
      - name: Commit qualification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'roadmap(v9.5): qualify fire mission network milestone'
          git push origin HEAD:dev-v9-5
