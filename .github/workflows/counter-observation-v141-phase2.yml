name: Counter-Observation v14.1 Phase-Two Finalizer

on:
  push:
    branches: ['dev-v14-1']
    paths:
      - 'Tools/finalize_v141_phase2.py'
      - '.github/workflows/counter-observation-v141-phase2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-phase-two:
    name: Close verified handoff/resilience and regenerate progress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source snapshot before progress mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v14-1'
          test "$(cat VERSION)" = 'v14.1.0-dev'
          python -m py_compile \
            Tools/verify_v141_counter_observation.py \
            Tools/finalize_v141_phase2.py \
            Tools/generate_progress_svgs.py \
            Tools/swir_visual_report_guard.py
          python Tools/verify_v141_counter_observation.py
      - name: Close only source-verified phase-two deliverables
        shell: bash
        run: |
          set -euo pipefail
          python Tools/finalize_v141_phase2.py
          python Tools/generate_progress_svgs.py --embed --write
          python Tools/verify_v141_counter_observation.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          git diff --check
          grep -Fq '| **476** | **3** | **479** | **99.4%** |' ROADMAP.md
          grep -Fq '**476 / 479 completed (99.4%)**' README.md
          grep -Fq -- '- [ ] **Readable budgeted observer-hunt presentation**' ROADMAP.md
          grep -Fq -- '- [ ] **Deterministic runtime, authority and performance contracts**' ROADMAP.md
          grep -Fq -- '- [ ] **Exact-SHA Windows qualification**' ROADMAP.md
      - name: Commit deterministic progress snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev-v14-1
          test "$(git rev-parse origin/dev-v14-1)" = "${GITHUB_SHA}" || { echo 'Branch advanced; refusing stale progress commit.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg
          if git diff --cached --quiet; then
            echo 'Phase-two progress already finalized; no commit required.'
            exit 0
          fi
          git commit -m 'docs(v14.1): close verified handoff and resilience'
          git push origin HEAD:dev-v14-1
