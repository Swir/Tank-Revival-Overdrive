name: ROADMAP v12.0 Qualification Finalizer
on:
  push:
    branches: ['dev-v12-0']
    paths:
      - '.v120-qualification-trigger'
      - '.github/workflows/roadmap-v120-qualification.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact qualified Windows candidate
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess, urllib.request
          sha=Path('.v120-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha.lower()), sha
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha+'..HEAD'],text=True).splitlines()
          allowed={'.github/workflows/roadmap-v120-qualification.yml','.v120-qualification-trigger'}
          assert set(changed).issubset(allowed), 'Unqualified changes after candidate: '+repr(changed)
          url='https://api.github.com/repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+sha+'&per_page=100'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'TankRevival-v12-qualifier'})
          with urllib.request.urlopen(req) as response:
              data=json.load(response)
          matches=[run for run in data.get('workflow_runs',[]) if run.get('name')=='Combined Arms Mobile Front v12.0 Windows Gate' and run.get('head_sha')==sha and run.get('conclusion')=='success']
          assert matches, 'No successful exact v12.0 Windows gate for '+sha
          print('Qualified SHA:',sha,'run:',matches[0]['html_url'])
      - name: Verify qualified v12.0 implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          test -f Assets/Scripts/CombinedArmsMobileFrontCISmokeProbe.cs
          test -f Assets/Scripts/ReactiveCoverBreachDirector.cs
          test -f Assets/Scripts/DynamicFrontlineTerritoryDirector.cs
          test -f .github/workflows/combined-arms-mobile-front-v120-windows.yml
          grep -q 'EligibleOperationCount' Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          grep -q 'SelectOperationLane' Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          grep -q 'ApplyFrontlinePressure' Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          grep -q 'SelectNearestSpecialists' Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          grep -q 'IsForwardRoutePoint' Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          grep -q 'V12_0_MOBILE_FRONT_SMOKE_OK.txt' Assets/Scripts/CombinedArmsMobileFrontCISmokeProbe.cs
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-303%2F311' ROADMAP.md
          grep -q 'STATUS-V12.0%20IN%20DEVELOPMENT-yellow' ROADMAP.md
      - name: Finalize v12.0 checklist and dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          assert len(re.findall(r'^'+re.escape(marker)+r'$',s,re.M))==1
          heading='## v12.0 — Combined Arms Operations & Mobile Front Objectives — IN DEVELOPMENT'
          start=s.index(heading); end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED').replace('- [ ]','- [x]')
          s=s[:start]+section+s[end:]
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(311,0,311),(done,open_,total)
          pct=round(done*100/total,1); filled=round(20*done/total); bar='█'*filled+'░'*(20-filled)
          s=re.sub(r'ROADMAP-[0-9.]+%25-brightgreen',f'ROADMAP-{pct:.1f}%25-brightgreen',s,count=1)
          s=re.sub(r'DONE-[0-9]+%2F[0-9]+',f'DONE-{done}%2F{total}',s,count=1)
          s=re.sub(r'STATUS-V12\.0%20IN%20DEVELOPMENT-yellow',r'STATUS-V12.0%20QUALIFIED-brightgreen',s,count=1)
          s=re.sub(r'(?m)^([█░]{20}) [0-9.]+%$',f'{bar} {pct:.1f}%',s,count=1)
          s=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|',f'| **{done}** | **{open_}** | **{total}** | **{pct:.1f}%** |',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify SWIR roadmap v1 consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(311,0,311),(done,open_,total)
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for token in ['ROADMAP-100.0%25-brightgreen','DONE-311%2F311','STATUS-V12.0%20QUALIFIED-brightgreen','████████████████████ 100.0%','| **311** | **0** | **311** | **100.0%** |']:
              assert token in s,token
          start=s.index('## v12.0 — Combined Arms Operations & Mobile Front Objectives — QUALIFIED')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [x]')==8 and section.count('- [ ]')==0
      - name: Commit qualification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v12.0): qualify combined-arms mobile front milestone'
          git push
