name: Demo Candidate Windows

on:
  push:
    branches:
      - 'dev-v5-*'
    paths:
      - '.demo-build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo-candidate:
    name: Build and validate Windows demo candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate demo source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v5.0.0-rc1"
          test -f Assets/Scripts/DemoExperienceDirector.cs
          test -f Assets/Scripts/DemoAcceptanceGate.cs
          test -f Assets/Scripts/RuntimeStabilityDirector.cs
          test -f Assets/Scripts/LateRoundStressHarness.cs
          test -f Assets/Scripts/ProjectilePool.cs
          grep -q "PUBLIC DEMO CANDIDATE" Assets/Editor/CIBuild.cs
          grep -q "BuildDemoCandidate" Assets/Editor/CIBuild.cs
          echo "Demo source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Demo-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Demo-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
            Library-${{ runner.os }}-6000.3.17f1-

      - name: Build non-development Windows demo candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildDemoCandidate
          allowDirtyBuild: true

      - name: Validate packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          test -f "$root/BUILD_INFO.txt"
          test -f "$root/DEMO_MANIFEST.txt"
          test -f "$root/README_DEMO.txt"
          grep -q "PUBLIC DEMO CANDIDATE" "$root/BUILD_INFO.txt"
          grep -q "Build: 5.0.0-rc1" "$root/BUILD_INFO.txt"
          grep -q "Demo candidate: 5.0.0-rc1" "$root/DEMO_MANIFEST.txt"
          grep -q "Commit: $GITHUB_SHA" "$root/DEMO_MANIFEST.txt"
          test -s "$root/TankRevivalOverdrive.exe"
          echo "Windows demo candidate runtime gate passed."

      - name: Pack public-demo candidate
        shell: bash
        run: |
          set -euo pipefail
          archive=TankRevival-Orzel-Overdrive-DEMO-v5.0.0-rc1-Windows-x64.zip
          cd build/StandaloneWindows64
          zip -r "../../$archive" .
          cd ../..
          test -s "$archive"
          sha256sum "$archive" | tee "$archive.sha256"

      - name: Upload demo candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO-v5.0.0-rc1-Windows-x64
          path: |
            TankRevival-Orzel-Overdrive-DEMO-v5.0.0-rc1-Windows-x64.zip
            TankRevival-Orzel-Overdrive-DEMO-v5.0.0-rc1-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
