name: Fire Support v13.9 Source Qualification

on:
  push:
    branches: ['dev-v13-9']
    paths:
      - 'VERSION'
      - 'Assets/Scripts/BattlefieldFireSupportV139.cs'
      - 'Assets/Scripts/BattlefieldFireSupportCISmokeProbe.cs'
      - 'Assets/Scripts/BattlefieldSuppressionMoraleV138.cs'
      - 'Assets/Scripts/BattlefieldCohesionV133.cs'
      - 'Assets/Scripts/BattlefieldSensorFusionV136.cs'
      - 'Assets/Scripts/TacticalTerrainV134.cs'
      - 'Assets/Scripts/RuntimeBattleRegistry.cs'
      - 'Assets/Scripts/TankGame.cs'
      - 'Tools/verify_v139_fire_support.py'
      - 'Tools/verify_csharp_type_uniqueness.py'
      - 'Tools/generate_progress_svgs.py'
      - 'Tools/swir_visual_report_guard.py'
      - '.github/workflows/fire-support-v139-source.yml'
      - 'ROADMAP.md'
      - 'assets/readme/progress-card.svg'
      - 'assets/readme/progress-mini.svg'
      - 'assets/readme/progress-template.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v13.9 fire-support authority and progress contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v13-9'
          test "$(cat VERSION)" = 'v13.9.0-dev'
          python -m py_compile Tools/verify_v139_fire_support.py Tools/verify_csharp_type_uniqueness.py Tools/generate_progress_svgs.py Tools/swir_visual_report_guard.py
          python Tools/verify_v139_fire_support.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          git diff --check
      - name: Verify no hidden authority or progress inflation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '\.Damage\(|Destroy\(\s*enemy|FindObjectsByType<EnemyTank>|Physics2D\.Overlap|ProjectilePool\.Spawn' Assets/Scripts/BattlefieldFireSupportV139.cs
          grep -Fq 'StrikeIntentPublished' Assets/Scripts/BattlefieldFireSupportV139.cs
          grep -Fq '_game.SpawnProjectile(' Assets/Scripts/BattlefieldFireSupportV139.cs
          grep -Fq 'BattlefieldSensorFusionDirector' Assets/Scripts/BattlefieldFireSupportV139.cs
          grep -Fq 'RuntimeBattleRegistry.EnemySnapshot' Assets/Scripts/BattlefieldFireSupportV139.cs
          grep -Fq '| **455** | **8** | **463** | **98.3%** |' ROADMAP.md
          test "$(grep -c '^- \[ \] ' ROADMAP.md)" -eq 8
          echo 'v13.9 source qualification kept roadmap open and intent/projectile authorities separated.'
