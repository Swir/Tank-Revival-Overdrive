name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (example v0.1.0)
        required: true
        default: v0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing UNITY_EMAIL or UNITY_PASSWORD repository secret."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Missing Unity license. Add UNITY_LICENSE for Personal or UNITY_SERIAL for Pro."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.17f1-

      - name: Build Tank Revival Overdrive
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify executable and player data
        shell: bash
        run: |
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          echo "Windows player verified."
          ls -lah build/StandaloneWindows64

      - name: Create portable Windows ZIP
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-Windows-x64.zip
          echo "Portable package created:"
          ls -lh TankRevivalOverdrive-Windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-Windows-x64
          path: TankRevivalOverdrive-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$MANUAL_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Release tag is empty."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TankRevivalOverdrive-Windows-x64.zip --clobber
          else
            gh release create "$TAG" TankRevivalOverdrive-Windows-x64.zip \
              --target "$GITHUB_SHA" \
              --title "Tank Revival Overdrive $TAG" \
              --notes "Playable Windows x64 build. Extract the ZIP and run TankRevivalOverdrive.exe. Unity is not required on the player's computer."
          fi
