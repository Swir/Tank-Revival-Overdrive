name: Mobile Signal Warfare v12.4 Windows Gate

on:
  push:
    branches: ['dev-v12-4']
    paths:
      - 'Assets/Scripts/ReconElectronicWarfareDirector.cs'
      - 'Assets/Scripts/MobileSignalWarfareDirector.cs'
      - 'Assets/Scripts/MobileSignalWarfareCISmokeProbe.cs'
      - 'Assets/Scripts/MobileSignalWarfareDirector.cs.meta'
      - 'Assets/Scripts/MobileSignalWarfareCISmokeProbe.cs.meta'
      - 'CHANGELOG_v12.4.md'
      - 'VERSION'
      - '.github/workflows/mobile-signal-v124-windows.yml'
      - '.v124-qualification-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v12.4 mobile signal and authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/MobileSignalWarfareDirector.cs
          test -f Assets/Scripts/MobileSignalWarfareCISmokeProbe.cs
          test -f Assets/Scripts/ReconElectronicWarfareDirector.cs
          test -f Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          test -f Assets/Scripts/OperationalSustainmentDirector.cs
          test -f Assets/Scripts/TacticalNavigationDirector.cs
          test -f CHANGELOG_v12.4.md
          test "$(cat VERSION)" = 'v12.4.0-dev'
          grep -q 'MaxMobileJammers = 1' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'MaxRaidActors = 3' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'InterceptHoldSeconds = 4.0f' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'CounterJamWindowSeconds = 9.0f' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'RelaySuppressionSeconds = 5.0f' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'OperationalSustainmentDirector.SupportAnchor' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'TacticalNavigationAgent' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'ApplyMobileJammingPulse' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'SuppressRelay' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'ApplyCounterJamming' Assets/Scripts/MobileSignalWarfareDirector.cs
          grep -q 'TryGetRelayPosition' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'ExternalWarfareBridgeValid' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'V12_4_MOBILE_SIGNAL_SMOKE_OK.txt' Assets/Scripts/MobileSignalWarfareCISmokeProbe.cs
          grep -q 'anchorCases=' Assets/Scripts/MobileSignalWarfareCISmokeProbe.cs
          if grep -Eq 'SpawnProjectile\(|AddComponent<Projectile>|\.Damage\(' Assets/Scripts/MobileSignalWarfareDirector.cs; then
            echo 'Mobile signal director contains forbidden projectile/direct-damage authority.' >&2
            exit 1
          fi
          if grep -Eq 'GetField\("_body"|GetField\("_lane"|BindingFlags' Assets/Scripts/MobileSignalWarfareDirector.cs; then
            echo 'Mobile signal director must use public logistics/recon bridges, not private movement reflection.' >&2
            exit 1
          fi
          if grep -Eq 'transform\.position\s*=.*Enemy|enemy\.transform\.position\s*=|enemy\.GetComponent<Rigidbody2D>\(\).*MovePosition' Assets/Scripts/MobileSignalWarfareDirector.cs; then
            echo 'Mobile signal director must not directly move EnemyTank actors.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(335,8,343),(done,open_,total)
          assert 'ROADMAP-97.7%25-brightgreen' in s
          assert 'DONE-335%2F343' in s
          assert 'STATUS-V12.4%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.7%' in s
          assert '| **335** | **8** | **343** | **97.7%** |' in s
          start=s.index('## v12.4 — Mobile Signal Warfare & Counter-Recon Raids — IN DEVELOPMENT')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0

  build-candidate:
    name: Build exact v12.4 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V124MobileSignal-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V124MobileSignal-Library-${{ runner.os }}-6000.3.17f1-
            V123ReconEW-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v12.4-mobile-signal-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v12.4-mobile-signal-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.4-mobile-signal-Windows-x64
          path: TankRevivalOverdrive-v12.4-mobile-signal-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v12.4 mobile signal warfare
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.4-mobile-signal-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v12.4-mobile-signal-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v12.4 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V12_4_MOBILE_SIGNAL_SMOKE_OK.txt, V12_4_MOBILE_SIGNAL_SMOKE_FAIL.txt, V124MobileSignalPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-tr-v124-smoke','-logFile','V124MobileSignalPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v12.4 mobile-signal smoke timed out after 70 seconds'
          }
          if (Test-Path 'V12_4_MOBILE_SIGNAL_SMOKE_FAIL.txt') {
            Get-Content V12_4_MOBILE_SIGNAL_SMOKE_FAIL.txt
            if (Test-Path V124MobileSignalPlayer.log) { Get-Content V124MobileSignalPlayer.log -Tail 360 }
            throw 'v12.4 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V12_4_MOBILE_SIGNAL_SMOKE_OK.txt')) {
            if (Test-Path V124MobileSignalPlayer.log) { Get-Content V124MobileSignalPlayer.log -Tail 360 }
            throw "Runtime exited without v12.4 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V12_4_MOBILE_SIGNAL_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V124MobileSignalPlayer.log) {
            if (Select-String -Path V124MobileSignalPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V124MobileSignalPlayer.log -Tail 380
              throw 'Blocking exception signature found during v12.4 runtime smoke'
            }
          }
          Write-Host 'v12.4 mobile signal warfare runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.4-mobile-signal-diagnostics
          path: |
            candidate/runtime/V12_4_MOBILE_SIGNAL_SMOKE_OK.txt
            candidate/runtime/V12_4_MOBILE_SIGNAL_SMOKE_FAIL.txt
            candidate/runtime/V124MobileSignalPlayer.log
          if-no-files-found: ignore
          retention-days: 14
