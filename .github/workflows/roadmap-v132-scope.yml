name: ROADMAP v13.2 Scope Registrar

on:
  push:
    branches:
      - dev-v13-2
    paths:
      - .v132-scope-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: dev-v13-2
          fetch-depth: 0

      - name: Register v13.2 milestone in canonical roadmap
        run: python Tools/register_v132_scope.py

      - name: Re-read and verify SWIR Roadmap Standard v1
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path("ROADMAP.md").read_text(encoding="utf-8")
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$', text, re.M)) == 1
          assert "## 📊 Overall progress" in text
          assert "badge.svg?branch=dev-v13-2" in text
          assert "ROADMAP-98.0%25-yellow?style=for-the-badge" in text
          assert "DONE-399%2F407-1f6feb?style=for-the-badge" in text
          assert "STATUS-V13.2%20IN%20DEVELOPMENT-yellow?style=for-the-badge" in text
          assert "███████████████████░ 98.0%" in text
          assert "| **399** | **8** | **407** | **98.0%** |" in text
          assert len(re.findall(r'^- \[x\] ', text, re.M)) == 399
          assert len(re.findall(r'^- \[ \] ', text, re.M)) == 8
          section = text.split("## v13.2 — Adaptive Enemy Command & Counter-Doctrine Warfare", 1)[1]
          assert section.count("- [ ]") == 8
          assert section.count("- [x]") == 0
          print("ROADMAP v13.2 scope invariants: PASS")

      - name: Commit roadmap scope
        run: |
          if git diff --quiet -- ROADMAP.md; then
            echo "ROADMAP already contains v13.2 scope; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs(v13.2): register adaptive-command milestone"
          git push origin HEAD:dev-v13-2
