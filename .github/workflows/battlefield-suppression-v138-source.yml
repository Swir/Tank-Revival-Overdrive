name: Battlefield Suppression v13.8 Source Qualification

on:
  push:
    branches: ['dev-v13-8']
    paths:
      - 'Assets/Scripts/BattlefieldSuppressionMoraleV138.cs'
      - 'Assets/Scripts/BattlefieldSuppressionMoraleCISmokeProbe.cs'
      - 'Assets/Scripts/EnemyTank.cs'
      - 'Assets/Scripts/Projectile.cs'
      - 'Assets/Scripts/RuntimeBattleRegistry.cs'
      - 'Assets/Scripts/BattlefieldCohesionV133.cs'
      - 'Assets/Scripts/LateRoundPerformanceV137.cs'
      - 'Tools/verify_v138_suppression_morale.py'
      - 'Tools/verify_csharp_type_uniqueness.py'
      - 'Tools/generate_progress_svgs.py'
      - 'Tools/swir_visual_report_guard.py'
      - 'ROADMAP.md'
      - 'README.md'
      - '.github/workflows/battlefield-suppression-v138-source.yml'
  pull_request:
    branches: ['dev-v13-7']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify v13.8 suppression, authority and presentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Tools/verify_v138_suppression_morale.py Tools/verify_csharp_type_uniqueness.py Tools/generate_progress_svgs.py Tools/swir_visual_report_guard.py
          python Tools/verify_v138_suppression_morale.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          git diff --check
