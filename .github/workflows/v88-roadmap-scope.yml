name: V8.8 Roadmap Scope Registrar

on:
  push:
    branches:
      - 'dev-v8-8'
    paths:
      - '.roadmap-v88-scope-trigger'

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v8-8
          fetch-depth: 0
      - name: Register v8.8 scope and recalculate dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          if '<!-- SWIR-ROADMAP-STANDARD:v1 -->' not in text:
              raise SystemExit('SWIR roadmap marker missing')

          section = """## v8.8 — Battlefield Salvage, Field Resupply & Logistics Counteroffensive — IN PROGRESS
          - [ ] High-value destroyed enemy units and interdicted logistics create bounded battlefield salvage opportunities tied to real death/logistics outcomes instead of a parallel loot spawn economy.
          - [ ] Nearby salvage offers a player-readable FIELD vs STRATEGIC recovery choice: immediate repair/ammunition or War Bond/denial value through existing PlayerTank, Orzełek, ammo and economy authority.
          - [ ] Enemy counter-recovery teams retask real surviving combat units through TacticalNavigationAgent to reclaim unsecured salvage and restore a bounded matching strategic reserve, creating an active race over battlefield resources.
          - [ ] Packaged Windows salvage gate boots the exact development EXE and verifies salvage eligibility/budgets, recovery-choice rewards, enemy reclaim bounds, authoritative integration and v8.8 version identity.

          """.replace('\n          ', '\n')
          if '## v8.8 — Battlefield Salvage' not in text:
              needle = '## Development rules\n'
              if needle not in text:
                  raise SystemExit('Development rules anchor missing')
              text = text.replace(needle, section + needle, 1)

          completed = len(re.findall(r'^- \[x\] ', text, flags=re.M))
          remaining = len(re.findall(r'^- \[ \] ', text, flags=re.M))
          total = completed + remaining
          pct = completed / total * 100 if total else 0.0
          filled = max(0, min(20, round(pct / 5.0)))
          bar = '█' * filled + '░' * (20 - filled)

          text = re.sub(r'badge\.svg\?branch=[^\"\)]+', 'badge.svg?branch=dev-v8-8', text, count=1)
          text = re.sub(r'https://img\.shields\.io/badge/ROADMAP-[^\"]+', f'https://img.shields.io/badge/ROADMAP-{pct:.1f}%25-7c3aed?style=for-the-badge', text, count=1)
          text = re.sub(r'https://img\.shields\.io/badge/DONE-[^\"]+', f'https://img.shields.io/badge/DONE-{completed}%2F{total}-1f6feb?style=for-the-badge', text, count=1)
          text = re.sub(r'https://img\.shields\.io/badge/STATUS-[^\"]+', 'https://img.shields.io/badge/STATUS-V8.8%20IN%20PROGRESS-7c3aed?style=for-the-badge', text, count=1)
          text = re.sub(r'(?m)^[█░]{20} [0-9.]+%$', f'{bar} {pct:.1f}%', text, count=1)
          text = re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|', f'| **{completed}** | **{remaining}** | **{total}** | **{pct:.1f}%** |', text, count=1)
          p.write_text(text, encoding='utf-8')
          print(f'ROADMAP scope registered: {completed}/{total} = {pct:.1f}% | {bar}')
          PY
      - name: Verify roadmap standard and honest scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!-- SWIR-ROADMAP-STANDARD:v1 -->' ROADMAP.md
          grep -q '## 📊 Overall progress' ROADMAP.md
          grep -q 'STATUS-V8.8%20IN%20PROGRESS' ROADMAP.md
          grep -q '## v8.8 — Battlefield Salvage' ROADMAP.md
          test "$(grep -c '^- \[ \] ' ROADMAP.md)" -ge 4
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('ROADMAP.md').read_text(encoding='utf-8')
          m = re.search(r'(?m)^([█░]+) ([0-9.]+)%$', text)
          assert m and len(m.group(1)) == 20
          done = len(re.findall(r'^- \[x\] ', text, flags=re.M))
          todo = len(re.findall(r'^- \[ \] ', text, flags=re.M))
          assert done == 174 and todo == 4 and done + todo == 178
          PY
      - name: Commit roadmap scope
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ROADMAP.md; then
            echo 'No roadmap scope change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v8.8): register milestone scope'
          git push origin HEAD:dev-v8-8
