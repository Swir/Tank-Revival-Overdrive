name: Tactical Terrain v13.4 Source Qualification

on:
  push:
    branches: ['dev-v13-4']
    paths:
      - 'Assets/Scripts/TacticalTerrainV134.cs'
      - 'Assets/Scripts/TacticalTerrainCISmokeProbe.cs'
      - 'Assets/Scripts/TankGame.cs'
      - 'Assets/Scripts/EnemyTank.cs'
      - 'Assets/Scripts/Obstacle.cs'
      - 'Assets/Scripts/ReactiveCoverBreachDirector.cs'
      - 'Assets/Scripts/ProductionBattleAudioDirector.cs'
      - 'Assets/Scripts/ProductionPresentationCISmokeProbe.cs'
      - 'Assets/Editor/CIBuild.cs'
      - 'Assets/Resources/TankRevivalProduction/Audio/*.wav'
      - 'Assets/Resources/TankRevivalProduction/Audio/*.meta'
      - 'Tools/verify_v134_tactical_terrain.py'
      - 'Tools/verify_production_audio_assets.py'
      - 'Tools/verify_unity_ci_bootstrap.py'
      - 'Tools/generate_progress_svgs.py'
      - 'ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-card.svg'
      - 'assets/readme/progress-mini.svg'
      - 'assets/readme/progress-template.svg'
      - '.github/workflows/tactical-terrain-v134-source.yml'
      - '.github/workflows/tactical-terrain-v134-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v13-4'
          test "$(cat VERSION)" = 'v13.4.0-dev'
      - name: Compile deterministic verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Tools/verify_v134_tactical_terrain.py Tools/verify_production_audio_assets.py Tools/verify_unity_ci_bootstrap.py Tools/generate_progress_svgs.py
      - name: Verify tactical terrain source and authority contracts
        run: python Tools/verify_v134_tactical_terrain.py
      - name: Verify production authored-audio source contract
        run: python Tools/verify_production_audio_assets.py
      - name: Verify immutable Unity CI bootstrap contract
        run: python Tools/verify_unity_ci_bootstrap.py
      - name: Verify deterministic Progress SVG assets
        run: python Tools/generate_progress_svgs.py --check
      - name: Verify repository diff hygiene
        run: git diff --check
      - name: Verify protected SWIR documentation contracts
        shell: python
        run: |
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          roadmap=Path('ROADMAP.md').read_text(encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          template=Path('assets/readme/progress-template.svg').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',roadmap,re.M))==1
          assert len(re.findall(r'^<!-- SWIR-README-STANDARD:v2 -->$',readme,re.M))==1
          for token in ['<!-- ROADMAP-PROGRESS:START -->','<!-- ROADMAP-PROGRESS:END -->','## 📊 Overall progress','| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |','<!-- SWIR-PROGRESS-SVG-PRO:v1 -->']:
              assert token in roadmap,token
          assert '| **415** | **8** | **423** | **98.1%** |' in roadmap
          assert 'DONE-415%2F423' in roadmap and 'ROADMAP-98.1%25-yellow' in roadmap
          assert 'STATUS-V13.4%20IN%20DEVELOPMENT-yellow' in roadmap
          assert not re.search(r'(?m)^[█░]{8,}\s+[0-9.]+%$',roadmap)
          assert not re.search(r'(?m)^[█░]{8,}\s+[0-9.]+%$',readme)
          assert roadmap.count('assets/readme/progress-mini.svg')==1
          assert readme.count('assets/readme/progress-card.svg')==1
          assert 'progress-template.svg' not in roadmap and 'progress-template.svg' not in readme
          assert '415 / 423 completed (98.1%) — V13.4 IN DEVELOPMENT' in roadmap
          assert '415 / 423 completed (98.1%) — V13.4 IN DEVELOPMENT' in readme
          assert '## 🔎 Search Keywords' in readme
          assert 'Template' in template and 'N/A' in template
          for p in ['assets/readme/progress-card.svg','assets/readme/progress-mini.svg','assets/readme/progress-template.svg']:
              ET.parse(p)
          print('v13.4 protected SWIR docs + SVG-only XML contract: PASS')
