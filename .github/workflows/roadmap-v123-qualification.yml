name: ROADMAP v12.3 Qualification Finalizer

on:
  push:
    branches: ['dev-v12-3']
    paths: ['.v123-roadmap-qualification-trigger']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact qualified Windows candidate
        shell: python
        run: |
          from pathlib import Path
          import json, os, subprocess, urllib.request
          sha=Path('.v123-roadmap-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha.lower()), sha
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha+'..HEAD'],text=True).splitlines()
          allowed={'.v123-roadmap-qualification-trigger'}
          assert set(changed).issubset(allowed), 'Unqualified changes after candidate: '+repr(changed)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+sha+'&per_page=100'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'TankRevival-v123-qualifier'})
          with urllib.request.urlopen(req) as response:
              data=json.load(response)
          matches=[run for run in data.get('workflow_runs',[]) if run.get('name')=='Recon Electronic Warfare v12.3 Windows Gate' and run.get('head_sha')==sha and run.get('conclusion')=='success']
          assert matches, 'No successful exact v12.3 Windows gate for '+sha
          print('Qualified SHA:',sha,'run:',matches[0]['html_url'])
      - name: Verify qualified v12.3 implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/ReconElectronicWarfareDirector.cs
          test -f Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs
          test -f Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          test -f Assets/Scripts/OperationalSustainmentDirector.cs
          test -f .github/workflows/recon-ew-v123-windows.yml
          grep -q 'MaxRelayNodes = 2' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'MaxJammers = 1' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'MaxGuardActors = 3' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'RequiredPacketsForVerified = 2' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'WarEconomyDirector.AwardMissionBonds' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'TacticalNavigationAgent' Assets/Scripts/ReconElectronicWarfareDirector.cs
          grep -q 'V12_3_RECON_EW_SMOKE_OK.txt' Assets/Scripts/ReconElectronicWarfareCISmokeProbe.cs
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-327%2F335' ROADMAP.md
          grep -q 'STATUS-V12.3%20IN%20DEVELOPMENT-yellow' ROADMAP.md
      - name: Finalize v12.3 checklist and dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          assert len(re.findall(r'^'+re.escape(marker)+r'$',s,re.M))==1
          heading='## v12.3 — Reconnaissance Network & Electronic Counter-Logistics — IN DEVELOPMENT'
          start=s.index(heading); end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED').replace('- [ ]','- [x]')
          s=s[:start]+section+s[end:]
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(335,0,335),(done,open_,total)
          pct=round(done*100/total,1); bar='█'*20
          s=re.sub(r'ROADMAP-[0-9.]+%25-brightgreen',f'ROADMAP-{pct:.1f}%25-brightgreen',s,count=1)
          s=re.sub(r'DONE-[0-9]+%2F[0-9]+',f'DONE-{done}%2F{total}',s,count=1)
          s=re.sub(r'STATUS-V12\.3%20IN%20DEVELOPMENT-yellow',r'STATUS-V12.3%20QUALIFIED-brightgreen',s,count=1)
          s=re.sub(r'(?m)^([█░]{20}) [0-9.]+%$',f'{bar} {pct:.1f}%',s,count=1)
          s=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|',f'| **{done}** | **{open_}** | **{total}** | **{pct:.1f}%** |',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify SWIR roadmap v1 consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(335,0,335),(done,open_,total)
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for token in ['ROADMAP-100.0%25-brightgreen','DONE-335%2F335','STATUS-V12.3%20QUALIFIED-brightgreen','████████████████████ 100.0%','| **335** | **0** | **335** | **100.0%** |']:
              assert token in s,token
          start=s.index('## v12.3 — Reconnaissance Network & Electronic Counter-Logistics — QUALIFIED')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [x]')==8 and section.count('- [ ]')==0
      - name: Commit qualification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v12.3): qualify recon EW milestone'
          git push
