name: Operational Sustainment v12.1 Windows Gate

on:
  push:
    branches: ['dev-v12-1']
    paths:
      - 'Assets/Scripts/OperationalSustainmentDirector.cs'
      - 'Assets/Scripts/OperationalSustainmentCISmokeProbe.cs'
      - '.github/workflows/operational-sustainment-v121-windows.yml'
      - '.v121-qualification-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v12.1 sustainment and authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/OperationalSustainmentDirector.cs
          test -f Assets/Scripts/OperationalSustainmentCISmokeProbe.cs
          test -f Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          test -f Assets/Scripts/LogisticsNetworkDirector.cs
          test -f Assets/Scripts/SupplyRouteWarfareDirector.cs
          test -f Assets/Scripts/StrategicReserveAttritionDirector.cs
          test -f Assets/Scripts/SiegeLineWarfareDirector.cs
          test -f Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'MaxColumns = 1' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'MaxEscorts = 4' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'FuelForRound' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'AmmoForRound' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'RepairForRound' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'SupportAnchor' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'CombinedArmsMobileFrontDirector.Instance' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'ConvoyWarfareDirector.HasMissionForRound' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'LogisticsNetworkDirector.HasLogisticsForRound' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'TacticalNavigationAgent' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'StrategicReserveAttritionDirector.Instance' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'SiegeNextBatteryFireField' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'EngineeringNextDecisionField' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'EnemyDeficitMultiplier = 0.72f' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'AddComponent<Health>' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'RigidbodyType2D.Kinematic' Assets/Scripts/OperationalSustainmentDirector.cs
          grep -q 'V12_1_SUSTAINMENT_SMOKE_OK.txt' Assets/Scripts/OperationalSustainmentCISmokeProbe.cs
          grep -q 'eligibleColumns=' Assets/Scripts/OperationalSustainmentCISmokeProbe.cs
          if grep -Eq 'SpawnProjectile\(|AddComponent<Projectile>|\.Damage\(' Assets/Scripts/OperationalSustainmentDirector.cs; then
            echo 'Operational sustainment director contains forbidden projectile/direct-damage authority.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(311,8,319),(done,open_,total)
          assert 'ROADMAP-97.5%25-brightgreen' in s
          assert 'DONE-311%2F319' in s
          assert 'STATUS-V12.1%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.5%' in s
          assert '| **311** | **8** | **319** | **97.5%** |' in s
          start=s.index('## v12.1 — Mobile Logistics Columns & Operational Sustainment — IN DEVELOPMENT')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0

  build-candidate:
    name: Build exact v12.1 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V121OperationalSustainment-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V121OperationalSustainment-Library-${{ runner.os }}-6000.3.17f1-
            V120MobileFront-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v12.1-operational-sustainment-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v12.1-operational-sustainment-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.1-operational-sustainment-Windows-x64
          path: TankRevivalOverdrive-v12.1-operational-sustainment-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v12.1 sustainment
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.1-operational-sustainment-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v12.1-operational-sustainment-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v12.1 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V12_1_SUSTAINMENT_SMOKE_OK.txt, V12_1_SUSTAINMENT_SMOKE_FAIL.txt, V121SustainmentPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-tr-v121-smoke','-logFile','V121SustainmentPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v12.1 operational sustainment smoke timed out after 70 seconds'
          }
          if (Test-Path 'V12_1_SUSTAINMENT_SMOKE_FAIL.txt') {
            Get-Content V12_1_SUSTAINMENT_SMOKE_FAIL.txt
            if (Test-Path V121SustainmentPlayer.log) { Get-Content V121SustainmentPlayer.log -Tail 280 }
            throw 'v12.1 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V12_1_SUSTAINMENT_SMOKE_OK.txt')) {
            if (Test-Path V121SustainmentPlayer.log) { Get-Content V121SustainmentPlayer.log -Tail 280 }
            throw "Runtime exited without v12.1 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V12_1_SUSTAINMENT_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V121SustainmentPlayer.log) {
            if (Select-String -Path V121SustainmentPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V121SustainmentPlayer.log -Tail 320
              throw 'Blocking exception signature found during v12.1 runtime smoke'
            }
          }
          Write-Host 'v12.1 operational sustainment runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.1-operational-sustainment-diagnostics
          path: |
            candidate/runtime/V12_1_SUSTAINMENT_SMOKE_OK.txt
            candidate/runtime/V12_1_SUSTAINMENT_SMOKE_FAIL.txt
            candidate/runtime/V121SustainmentPlayer.log
          if-no-files-found: ignore
          retention-days: 14
