name: ROADMAP v11.1 Qualification Lock

on:
  push:
    branches:
      - 'dev-v11-1'
    paths:
      - '.roadmap-v111-lock-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  lock-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v11-1
          fetch-depth: 0
      - name: Require green v11.1 Windows gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gate=$(gh run list --branch dev-v11-1 --workflow armor-component-reforge-windows.yml --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')
          dev=$(gh run list --branch dev-v11-1 --workflow dev-windows-build.yml --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')
          test -n "$gate"
          test -n "$dev"
          echo "v11.1 gate=$gate dev=$dev"
      - name: Close v11.1 roadmap scope
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          heading = '## v11.1 — Armor Facings, Component Damage & Mobility Kills Reforge — IN PROGRESS'
          assert heading in s
          start = s.index(heading)
          end = s.index('\n## Development rules', start)
          section = s[start:end]
          assert section.count('- [ ] ') == 5
          section = section.replace(' — IN PROGRESS', ' — COMPLETE', 1).replace('- [ ] ', '- [x] ')
          s = s[:start] + section + s[end:]
          s = s.replace('ROADMAP-98.0%25-d29922', 'ROADMAP-100.0%25-2ea043', 1)
          s = s.replace('DONE-249%2F254-1f6feb', 'DONE-254%2F254-1f6feb', 1)
          s = s.replace('STATUS-V11.1%20IN%20PROGRESS-d29922', 'STATUS-V11.1%20QUALIFIED-2ea043', 1)
          s = s.replace('████████████████████ 98.0%', '████████████████████ 100.0%', 1)
          s = s.replace('| **249** | **5** | **254** | **98.0%** |', '| **254** | **0** | **254** | **100.0%** |', 1)
          p.write_text(s, encoding='utf-8')
      - name: Re-read and verify SWIR dashboard consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('ROADMAP.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', s, re.M))
          open_ = len(re.findall(r'^- \[ \] ', s, re.M))
          assert (done, open_) == (254, 0), (done, open_)
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<!-- ROADMAP-PROGRESS:START -->' in s and '<!-- ROADMAP-PROGRESS:END -->' in s
          assert 'badge.svg?branch=dev-v11-1' in s
          assert 'ROADMAP-100.0%25-2ea043' in s
          assert 'DONE-254%2F254-1f6feb' in s
          assert 'STATUS-V11.1%20QUALIFIED-2ea043' in s
          assert '████████████████████ 100.0%' in s
          assert '| **254** | **0** | **254** | **100.0%** |' in s
          section = s[s.index('## v11.1 — Armor Facings, Component Damage & Mobility Kills Reforge — COMPLETE'):s.index('\n## Development rules')]
          assert section.count('- [x] ') == 5 and '- [ ] ' not in section
      - name: Commit qualified roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m 'roadmap(v11.1): qualify Armor Component Reforge'
          git push origin HEAD:dev-v11-1
