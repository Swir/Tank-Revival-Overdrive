name: Fortification Network v9.2 Windows Gate

on:
  push:
    branches:
      - 'dev-v9-2'
    paths:
      - '.fortification-network-v92-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fortification-network:
    name: Build v9.2 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Validate v9.2 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v9.2.0-dev"
          test -f Assets/Scripts/FortificationNetworkDirector.cs
          test -f Assets/Scripts/FortificationNetworkCISmokeProbe.cs
          grep -q "StrongpointTerritoryWarfareDirector" Assets/Scripts/FortificationNetworkDirector.cs
          grep -q "DynamicFrontlineTerritoryDirector" Assets/Scripts/FortificationNetworkDirector.cs
          grep -q "TacticalNavigationAgent" Assets/Scripts/FortificationNetworkDirector.cs
          grep -q "SpawnProjectile" Assets/Scripts/FortificationNetworkDirector.cs
          grep -q "AmmoType.HE" Assets/Scripts/FortificationNetworkDirector.cs
          grep -q -- "-fortification-network-smoke" Assets/Scripts/FortificationNetworkCISmokeProbe.cs
          grep -q "## v9.2 — Fortification Networks, Artillery Positions & Breakthrough Operations — IN PROGRESS" ROADMAP.md
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: FortificationV92-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            FortificationV92-Library-${{ runner.os }}-6000.3.17f1-
            StrongpointV91-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v9.2-fortification-network-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v9.2-fortification-network-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v9.2-fortification-network-Windows-x64
          path: TankRevival-v9.2-fortification-network-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v9.2 EXE on Windows
    needs: build-fortification-network
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevival-v9.2-fortification-network-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v9.2-fortification-network-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
      - name: Run fortification network smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item FORTIFICATION_NETWORK_PASS.txt, FORTIFICATION_NETWORK_FAIL.txt, FortificationPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-fortification-network-smoke','-logFile','FortificationPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Fortification network smoke timed out after 60 seconds'
          }
          if (Test-Path 'FORTIFICATION_NETWORK_FAIL.txt') {
            Get-Content FORTIFICATION_NETWORK_FAIL.txt
            if (Test-Path FortificationPlayer.log) { Get-Content FortificationPlayer.log -Tail 320 }
            throw 'Fortification network runtime probe reported FAIL'
          }
          if (!(Test-Path 'FORTIFICATION_NETWORK_PASS.txt')) {
            if (Test-Path FortificationPlayer.log) { Get-Content FortificationPlayer.log -Tail 320 }
            throw 'Fortification network PASS marker missing'
          }
          Get-Content FORTIFICATION_NETWORK_PASS.txt
