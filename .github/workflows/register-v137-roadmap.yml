name: Register v13.7 Roadmap Scope

on:
  push:
    branches: ['dev-v13-7']
    paths:
      - '.v137-roadmap-trigger'
      - 'Tools/register_v137_roadmap.py'
      - '.github/workflows/register-v137-roadmap.yml'

permissions:
  contents: write

concurrency:
  group: register-v137-roadmap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Register scope and regenerate SVGs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Tools/register_v137_roadmap.py Tools/generate_progress_svgs.py Tools/swir_visual_report_guard.py
          python Tools/register_v137_roadmap.py
          python Tools/generate_progress_svgs.py --write --embed
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8'); r=Path('README.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M))
          assert (done,open_,done+open_)==(439,8,447),(done,open_,done+open_)
          assert '| **439** | **8** | **447** | **98.2%** |' in s
          assert 'V13.7%20IN%20DEVELOPMENT' in s
          assert s.count('assets/readme/progress-mini.svg')==1
          assert r.count('assets/readme/progress-card.svg')==1
          assert '<!-- SWIR-README-STANDARD:v2 -->' in r
          assert '## 🔎 Search Keywords' in r
          section=s[s.index('## v13.7 — Late-Round Performance & Battle Density Reforge — IN DEVELOPMENT'):]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          PY
          git diff --check
      - name: Commit registered roadmap scope
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg; then
            echo 'v13.7 roadmap scope already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg
          git commit -m 'docs(v13.7): register late-round performance milestone'
          git push origin HEAD:dev-v13-7
