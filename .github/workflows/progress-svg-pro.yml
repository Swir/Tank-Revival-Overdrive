name: SWIR Progress SVG Pro

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "Tools/generate_progress_svgs.py"
      - "Tools/swir_visual_report_guard.py"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "assets/readme/progress-template.svg"
      - ".github/workflows/progress-svg-pro.yml"
  pull_request:
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "Tools/generate_progress_svgs.py"
      - "Tools/swir_visual_report_guard.py"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "assets/readme/progress-template.svg"
      - ".github/workflows/progress-svg-pro.yml"

permissions:
  contents: write

jobs:
  progress-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove retired text meters safely
        run: python Tools/swir_visual_report_guard.py --fix --self-test

      - name: Generate SVG-only progress presentation
        run: python Tools/generate_progress_svgs.py --embed

      - name: Read-back structure and migration guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s assets/readme/progress-card.svg
          test -s assets/readme/progress-mini.svg
          test -s assets/readme/progress-template.svg
          grep -Fq '<!-- SWIR-ROADMAP-STANDARD:v1 -->' ROADMAP.md
          grep -Fq '<!-- ROADMAP-PROGRESS:START -->' ROADMAP.md
          grep -Fq '<!-- ROADMAP-PROGRESS:END -->' ROADMAP.md
          grep -Fq 'assets/readme/progress-mini.svg' ROADMAP.md
          grep -Fq '<!-- SWIR-README-STANDARD:v2 -->' README.md
          grep -Fq 'assets/readme/progress-card.svg' README.md
          grep -Fq '## 🔎 Search Keywords' README.md
          grep -Fq 'TEMPLATE' assets/readme/progress-template.svg

      - name: SVG-only presentation regression guard
        run: python Tools/swir_visual_report_guard.py --check --self-test

      - name: Deterministic SVG and roadmap-math check
        run: python Tools/generate_progress_svgs.py --check

      - name: Commit generated presentation drift
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs(progress): enforce SVG-only visual report presentation [skip ci]"
            git push
          fi
