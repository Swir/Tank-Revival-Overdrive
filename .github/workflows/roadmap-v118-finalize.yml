name: ROADMAP v11.8 Qualification Finalizer
on:
  push:
    branches: ['dev-v11-8']
    paths: ['.v118-finalize-trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify qualified v11.8 implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/ReactiveCoverBreachDirector.cs
          test -f Assets/Scripts/ReactiveCoverBreachCISmokeProbe.cs
          test -f Assets/Scripts/Obstacle.cs
          test -f Assets/Scripts/Projectile.cs
          test -f Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          test -f .github/workflows/reactive-cover-breakthrough-v118-windows.yml
          grep -q 'ObstacleImpactResult ResolveProjectileImpact' Assets/Scripts/Obstacle.cs
          grep -q 'StructuralDamageFor' Assets/Scripts/Obstacle.cs
          grep -q 'ReactiveCoverBreachDirector.ReportBreach' Assets/Scripts/Obstacle.cs
          grep -q 'obstacle.ResolveProjectileImpact' Assets/Scripts/Projectile.cs
          grep -q 'TryFindBestBreach' Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          grep -q 'MaxRecentBreaches = 16' Assets/Scripts/ReactiveCoverBreachDirector.cs
          grep -q 'V118_REACTIVE_COVER_SMOKE_OK.txt' Assets/Scripts/ReactiveCoverBreachCISmokeProbe.cs
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-287%2F295' ROADMAP.md
          grep -q 'STATUS-V11.8%20IN%20DEVELOPMENT-yellow' ROADMAP.md
      - name: Finalize v11.8 checklist and dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          heading='## v11.8 — Reactive Cover Breakthrough & Destructible Tactical Terrain — IN DEVELOPMENT'
          start=s.index(heading); end=s.index('\n## Development rules',start)
          section=s[start:end]
          if section.count('- [ ]') != 8:
              raise SystemExit('Expected exactly eight open v11.8 deliverables')
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED').replace('- [ ]','- [x]')
          s=s[:start]+section+s[end:]
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          if (done,open_,total)!=(295,0,295): raise SystemExit((done,open_,total))
          pct=round(done*100/total,1); filled=round(20*done/total); bar='█'*filled+'░'*(20-filled)
          s=re.sub(r'ROADMAP-[0-9.]+%25-brightgreen',f'ROADMAP-{pct:.1f}%25-brightgreen',s,count=1)
          s=re.sub(r'DONE-[0-9]+%2F[0-9]+',f'DONE-{done}%2F{total}',s,count=1)
          s=re.sub(r'STATUS-V11\.8%20IN%20DEVELOPMENT-yellow',r'STATUS-V11.8%20QUALIFIED-brightgreen',s,count=1)
          s=re.sub(r'(?m)^([█░]{20}) [0-9.]+%$',f'{bar} {pct:.1f}%',s,count=1)
          s=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|',f'| **{done}** | **{open_}** | **{total}** | **{pct:.1f}%** |',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify SWIR roadmap v1 consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(295,0,295),(done,open_,total)
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for token in ['ROADMAP-100.0%25-brightgreen','DONE-295%2F295','STATUS-V11.8%20QUALIFIED-brightgreen','████████████████████ 100.0%','| **295** | **0** | **295** | **100.0%** |']:
              assert token in s,token
          start=s.index('## v11.8 — Reactive Cover Breakthrough & Destructible Tactical Terrain — QUALIFIED')
          end=s.index('\n## Development rules',start)
          assert s[start:end].count('- [x]')==8
          assert s[start:end].count('- [ ]')==0
      - name: Commit qualification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v11.8): qualify reactive cover breakthrough milestone'
          git push
