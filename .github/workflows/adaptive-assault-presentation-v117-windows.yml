name: Adaptive Assault Presentation v11.7 Windows Gate

on:
  push:
    branches: ['dev-v11-7']
    paths: ['.v117-presentation-gate-trigger']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v11.7 authority and presentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          test -f Assets/Scripts/AdaptiveAssaultPresentationDirector.cs
          test -f Assets/Scripts/AdaptiveAssaultPresentationCISmokeProbe.cs
          test -f Assets/Scripts/TacticalCombatHudDirector.cs
          test -f Assets/Scripts/MassBattleFxBudget.cs
          test -f Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          test -f Assets/Scripts/CombatFX3DDirector.cs
          grep -q 'ManeuverPresentationSnapshot' Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          grep -q 'PresentationStateFor' Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          grep -q 'MaxManeuverCues = 18' Assets/Scripts/AdaptiveAssaultPresentationDirector.cs
          grep -q 'MassBattleFxBudget.TryConsumeTacticalCue' Assets/Scripts/AdaptiveAssaultPresentationDirector.cs
          grep -q 'CounterFireThreatMemory.ShouldRetaliate' Assets/Scripts/AdaptiveAssaultPresentationDirector.cs
          grep -q 'PlatoonManeuverCue3D' Assets/Scripts/AdaptiveAssaultPresentationDirector.cs
          grep -q 'ENEMY MANEUVER' Assets/Scripts/TacticalCombatHudDirector.cs
          grep -q 'OperationLabel' Assets/Scripts/TacticalCombatHudDirector.cs
          grep -q 'TryConsumeTacticalCue' Assets/Scripts/MassBattleFxBudget.cs
          grep -q 'V117_PRESENTATION_SMOKE_OK.txt' Assets/Scripts/AdaptiveAssaultPresentationCISmokeProbe.cs
          if grep -Eq '\.SpawnProjectile\(|\.MovePosition\(|\.Damage\(|\.Heal\(' Assets/Scripts/AdaptiveAssaultPresentationDirector.cs; then
            echo 'Presentation layer contains forbidden gameplay-authority call.' >&2
            exit 1
          fi
          if grep -Eq 'AddComponent<Rigidbody2D>|AddComponent<Health>|AddComponent<ArmorSystem>|AddComponent<Projectile>' Assets/Scripts/AdaptiveAssaultPresentationDirector.cs; then
            echo 'Presentation layer attempts to create gameplay-authority components.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(279,8,287),(done,open_,total)
          assert 'ROADMAP-97.2%25-brightgreen' in s
          assert 'DONE-279%2F287' in s
          assert 'STATUS-V11.7%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.2%' in s
          assert '| **279** | **8** | **287** | **97.2%** |' in s
          section=s[s.index('## v11.7 — Adaptive Assault Readability & Battlefield Presentation — IN DEVELOPMENT'):s.index('\n## Development rules')]
          assert section.count('- [ ]')==8

  build-candidate:
    name: Build exact v11.7 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V117Presentation-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V117Presentation-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
      - name: Pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v11.7-presentation-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v11.7-presentation-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.7-presentation-Windows-x64
          path: TankRevivalOverdrive-v11.7-presentation-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v11.7 maneuver presentation
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.7-presentation-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v11.7-presentation-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v11.7 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V117_PRESENTATION_SMOKE_OK.txt, V117_PRESENTATION_SMOKE_FAIL.txt, V117PresentationPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-v117-presentation-smoke','-logFile','V117PresentationPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v11.7 presentation smoke timed out after 70 seconds'
          }
          if (Test-Path 'V117_PRESENTATION_SMOKE_FAIL.txt') {
            Get-Content V117_PRESENTATION_SMOKE_FAIL.txt
            if (Test-Path V117PresentationPlayer.log) { Get-Content V117PresentationPlayer.log -Tail 220 }
            throw 'v11.7 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V117_PRESENTATION_SMOKE_OK.txt')) {
            if (Test-Path V117PresentationPlayer.log) { Get-Content V117PresentationPlayer.log -Tail 220 }
            throw "Runtime exited without v11.7 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V117_PRESENTATION_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V117PresentationPlayer.log) {
            if (Select-String -Path V117PresentationPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V117PresentationPlayer.log -Tail 260
              throw 'Blocking exception signature found during v11.7 runtime smoke'
            }
          }
          Write-Host 'v11.7 adaptive assault presentation runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v11.7-presentation-diagnostics
          path: |
            candidate/runtime/V117_PRESENTATION_SMOKE_OK.txt
            candidate/runtime/V117_PRESENTATION_SMOKE_FAIL.txt
            candidate/runtime/V117PresentationPlayer.log
          if-no-files-found: ignore
          retention-days: 14
