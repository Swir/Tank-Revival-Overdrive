name: Combat Engineering v11.9 Windows Gate

on:
  push:
    branches: ['dev-v11-9']
    paths: ['.v119-combat-engineering-gate-trigger']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v11.9 counter-breach and authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/ReactiveCoverBreachDirector.cs
          test -f Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          test -f Assets/Scripts/CombatEngineeringCISmokeProbe.cs
          test -f Assets/Scripts/Obstacle.cs
          test -f Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          test -f Assets/Scripts/SiegeEngineeringDirector.cs
          test -f Assets/Scripts/EagleDefenseEngineeringDirector.cs
          grep -q 'ResolveBreach(int sequence)' Assets/Scripts/ReactiveCoverBreachDirector.cs
          grep -q 'TryFindRecentBreachNear' Assets/Scripts/ReactiveCoverBreachDirector.cs
          grep -q 'MaxActiveAssets = 8' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'MaxTrackedSectors = 12' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'TryRespondForPlayer' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'TryRespondForEnemy' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'root.AddComponent<Obstacle>' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'ReactiveCoverBreachDirector.ResolveBreach' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'CounterBreachMine' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs
          grep -q 'ReactiveCoverBreachDirector.ReportBreach' Assets/Scripts/Obstacle.cs
          grep -q 'TryFindBestBreach' Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          grep -q 'V119_COMBAT_ENGINEERING_SMOKE_OK.txt' Assets/Scripts/CombatEngineeringCISmokeProbe.cs
          if grep -Eq '\.SpawnProjectile\(|\.MovePosition\(|AddComponent<Rigidbody2D>|AddComponent<Projectile>|AddComponent<ArmorSystem>' Assets/Scripts/CombatEngineeringCounterBreachDirector.cs; then
            echo 'Counter-breach director contains forbidden tank/projectile authority.' >&2
            exit 1
          fi
          if grep -Eq '\.SpawnProjectile\(|\.MovePosition\(|\.Damage\(|\.Heal\(|AddComponent<Health>|AddComponent<Rigidbody2D>|AddComponent<Projectile>' Assets/Scripts/ReactiveCoverBreachDirector.cs; then
            echo 'Breach intelligence contains forbidden gameplay-authority call.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(295,8,303),(done,open_,total)
          assert 'ROADMAP-97.4%25-brightgreen' in s
          assert 'DONE-295%2F303' in s
          assert 'STATUS-V11.9%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.4%' in s
          assert '| **295** | **8** | **303** | **97.4%** |' in s
          start=s.index('## v11.9 — Combat Engineering & Counter-Breach Warfare — IN DEVELOPMENT')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8
          assert section.count('- [x]')==0

  build-candidate:
    name: Build exact v11.9 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V119CombatEngineering-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V119CombatEngineering-Library-${{ runner.os }}-6000.3.17f1-
            V118ReactiveCover-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
      - name: Pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v11.9-combat-engineering-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v11.9-combat-engineering-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.9-combat-engineering-Windows-x64
          path: TankRevivalOverdrive-v11.9-combat-engineering-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v11.9 combat engineering
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.9-combat-engineering-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v11.9-combat-engineering-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v11.9 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V119_COMBAT_ENGINEERING_SMOKE_OK.txt, V119_COMBAT_ENGINEERING_SMOKE_FAIL.txt, V119CombatEngineeringPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-v119-combat-engineering-smoke','-logFile','V119CombatEngineeringPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v11.9 combat engineering smoke timed out after 70 seconds'
          }
          if (Test-Path 'V119_COMBAT_ENGINEERING_SMOKE_FAIL.txt') {
            Get-Content V119_COMBAT_ENGINEERING_SMOKE_FAIL.txt
            if (Test-Path V119CombatEngineeringPlayer.log) { Get-Content V119CombatEngineeringPlayer.log -Tail 260 }
            throw 'v11.9 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V119_COMBAT_ENGINEERING_SMOKE_OK.txt')) {
            if (Test-Path V119CombatEngineeringPlayer.log) { Get-Content V119CombatEngineeringPlayer.log -Tail 260 }
            throw "Runtime exited without v11.9 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V119_COMBAT_ENGINEERING_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V119CombatEngineeringPlayer.log) {
            if (Select-String -Path V119CombatEngineeringPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V119CombatEngineeringPlayer.log -Tail 300
              throw 'Blocking exception signature found during v11.9 runtime smoke'
            }
          }
          Write-Host 'v11.9 combat engineering runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v11.9-combat-engineering-diagnostics
          path: |
            candidate/runtime/V119_COMBAT_ENGINEERING_SMOKE_OK.txt
            candidate/runtime/V119_COMBAT_ENGINEERING_SMOKE_FAIL.txt
            candidate/runtime/V119CombatEngineeringPlayer.log
          if-no-files-found: ignore
          retention-days: 14
