name: Armor Component Reforge v11.1 Windows Gate

on:
  push:
    branches:
      - 'dev-v11-1'
    paths:
      - '.armor-component-reforge-v111-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v11.1 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v11.1 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v11.1.0-dev"
          test -f Assets/Scripts/ComponentDamageTacticsDirector.cs
          test -f Assets/Scripts/ArmorComponentReforgeCISmokeProbe.cs
          grep -q 'ModuleCondition' Assets/Scripts/ArmorSystem.cs
          grep -q 'IsMobilityKilled' Assets/Scripts/ArmorSystem.cs
          grep -q 'IsWeaponDisabled' Assets/Scripts/ArmorSystem.cs
          grep -q 'AmmoPenetrationFactor' Assets/Scripts/ArmorSystem.cs
          grep -q 'LastOvermatch' Assets/Scripts/ArmorSystem.cs
          grep -q 'ComponentDamageTacticsDirector_v11_1' Assets/Scripts/ComponentDamageTacticsDirector.cs
          grep -q 'MaxManagedDamagedUnits = 8' Assets/Scripts/ComponentDamageTacticsDirector.cs
          grep -q 'TacticalNavigationAgent' Assets/Scripts/ComponentDamageTacticsDirector.cs
          grep -q 'RearExposureWindow' Assets/Scripts/ArmorHunterAgent.cs
          grep -q '## v11.1 — Armor Facings, Component Damage & Mobility Kills Reforge — IN PROGRESS' ROADMAP.md
          grep -q 'DONE-249%2F254' ROADMAP.md
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v111-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v111-Library-${{ runner.os }}-6000.3.17f1-
            v110-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v11.1-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v11.1-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.1-candidate-Windows-x64
          path: TankRevivalOverdrive-v11.1-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v11.1 candidate and validate armor/component reforge
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.1-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v11.1-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v11.1 Armor Component Reforge packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item ARMOR_COMPONENT_REFORGE_PASS.txt, ARMOR_COMPONENT_REFORGE_FAIL.txt, ArmorComponentPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-armor-component-reforge-smoke','-logFile','ArmorComponentPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v11.1 Armor Component Reforge smoke timed out after 60 seconds'
          }
          if (Test-Path 'ARMOR_COMPONENT_REFORGE_FAIL.txt') {
            Get-Content ARMOR_COMPONENT_REFORGE_FAIL.txt
            if (Test-Path ArmorComponentPlayer.log) { Get-Content ArmorComponentPlayer.log -Tail 280 }
            throw 'v11.1 Armor Component Reforge runtime probe reported FAIL'
          }
          if (!(Test-Path 'ARMOR_COMPONENT_REFORGE_PASS.txt')) {
            if (Test-Path ArmorComponentPlayer.log) { Get-Content ArmorComponentPlayer.log -Tail 280 }
            throw "Runtime exited without v11.1 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content ARMOR_COMPONENT_REFORGE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path ArmorComponentPlayer.log) {
            if (Select-String -Path ArmorComponentPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content ArmorComponentPlayer.log -Tail 300
              throw 'Blocking exception signature found during v11.1 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v11.1-armor-component-diagnostics
          path: |
            candidate/runtime/ARMOR_COMPONENT_REFORGE_PASS.txt
            candidate/runtime/ARMOR_COMPONENT_REFORGE_FAIL.txt
            candidate/runtime/ArmorComponentPlayer.log
          if-no-files-found: ignore
          retention-days: 14
