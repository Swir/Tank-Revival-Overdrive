name: Operation Chain Windows Gate

on:
  push:
    branches:
      - 'dev-v8-3'
    paths:
      - '.operation-chain-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-operation-chain:
    name: Build v8.3 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate v8.3 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v8.3.0-dev"
          test -f Assets/Scripts/OperationChainDirector.cs
          test -f Assets/Scripts/OperationChainCISmokeProbe.cs
          grep -q "ChainLength = 3" Assets/Scripts/OperationChainDirector.cs
          grep -q "EvaluateStage" Assets/Scripts/OperationChainDirector.cs
          grep -q "RefineEncounter" Assets/Scripts/OperationChainDirector.cs
          grep -q "CompletionReward = 16" Assets/Scripts/OperationChainDirector.cs
          grep -q -- "-operation-chain-smoke" Assets/Scripts/OperationChainCISmokeProbe.cs
          echo "v8.3 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: OperationChain-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            OperationChain-Library-${{ runner.os }}-6000.3.17f1-
            SectorIdentity-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v8.3-operation-chain-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v8.3-operation-chain-Windows-x64.zip

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v8.3-operation-chain-Windows-x64
          path: TankRevival-v8.3-operation-chain-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v8.3 EXE on Windows
    needs: build-operation-chain
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v8.3-operation-chain-Windows-x64
          path: candidate

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v8.3-operation-chain-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }

      - name: Run operation chain smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item OPERATION_CHAIN_PASS.txt, OPERATION_CHAIN_FAIL.txt, OperationChainPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-operation-chain-smoke','-logFile','OperationChainPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Operation chain smoke timed out after 60 seconds'
          }
          if (Test-Path 'OPERATION_CHAIN_FAIL.txt') {
            Get-Content OPERATION_CHAIN_FAIL.txt
            if (Test-Path OperationChainPlayer.log) { Get-Content OperationChainPlayer.log -Tail 260 }
            throw 'Operation chain runtime probe reported FAIL'
          }
          if (!(Test-Path 'OPERATION_CHAIN_PASS.txt')) {
            if (Test-Path OperationChainPlayer.log) { Get-Content OperationChainPlayer.log -Tail 260 }
            throw "Runtime exited without operation chain PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content OPERATION_CHAIN_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Select-String -Path OperationChainPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
            Get-Content OperationChainPlayer.log -Tail 300
            throw 'Blocking exception signature found during operation chain smoke'
          }
          Write-Host 'v8.3 operation chain runtime smoke passed.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v8.3-operation-chain-diagnostics
          path: |
            candidate/runtime/OPERATION_CHAIN_PASS.txt
            candidate/runtime/OPERATION_CHAIN_FAIL.txt
            candidate/runtime/OperationChainPlayer.log
          if-no-files-found: ignore
          retention-days: 14
