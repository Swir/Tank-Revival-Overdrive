name: Combined Arms Campaign Command v10.0 Windows Gate

on:
  push:
    branches:
      - 'dev-v10-0'
    paths:
      - '.campaign-command-v100-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v10.0 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v10.0 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v10.0.0-dev"
          test -f Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          test -f Assets/Scripts/CombinedArmsCampaignCommandCISmokeProbe.cs
          grep -q 'CombinedArmsCampaignCommandDirector' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'HasCommandOperationForRound' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'CampaignCommandPhase.Reconnaissance' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'CampaignCommandPhase.Interdiction' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'CampaignCommandPhase.DecisiveAction' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'Health' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'SpawnEnemy' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'WarEconomyDirector.AwardMissionBonds' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'DynamicFrontlineTerritoryDirector.LanePosition' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q 'FireMissionNetworkDirector.Instance' Assets/Scripts/CombinedArmsCampaignCommandDirector.cs
          grep -q '## v10.0 — Combined Arms Campaign Command & 100-Round War Reforge — IN PROGRESS' ROADMAP.md
          grep -q 'DONE-206%2F210' ROADMAP.md
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v100-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v100-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v10.0-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v10.0-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.0-candidate-Windows-x64
          path: TankRevivalOverdrive-v10.0-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v10.0 candidate and validate campaign command
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.0-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v10.0-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v10.0 campaign command packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item CAMPAIGN_COMMAND_PASS.txt, CAMPAIGN_COMMAND_FAIL.txt, CampaignCommandPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-campaign-command-smoke','-logFile','CampaignCommandPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v10.0 campaign command smoke timed out after 60 seconds'
          }
          if (Test-Path 'CAMPAIGN_COMMAND_FAIL.txt') {
            Get-Content CAMPAIGN_COMMAND_FAIL.txt
            if (Test-Path CampaignCommandPlayer.log) { Get-Content CampaignCommandPlayer.log -Tail 220 }
            throw 'v10.0 campaign command runtime probe reported FAIL'
          }
          if (!(Test-Path 'CAMPAIGN_COMMAND_PASS.txt')) {
            if (Test-Path CampaignCommandPlayer.log) { Get-Content CampaignCommandPlayer.log -Tail 220 }
            throw "Runtime exited without v10.0 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content CAMPAIGN_COMMAND_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path CampaignCommandPlayer.log) {
            if (Select-String -Path CampaignCommandPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content CampaignCommandPlayer.log -Tail 240
              throw 'Blocking exception signature found during v10.0 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v10.0-campaign-command-diagnostics
          path: |
            candidate/runtime/CAMPAIGN_COMMAND_PASS.txt
            candidate/runtime/CAMPAIGN_COMMAND_FAIL.txt
            candidate/runtime/CampaignCommandPlayer.log
          if-no-files-found: ignore
          retention-days: 14
