name: ROADMAP v12.3 Scope Registrar

on:
  push:
    branches: ['dev-v12-3']
    paths:
      - '.github/workflows/v123-roadmap-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v12-3
      - name: Register v12.3 roadmap scope
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$', s, re.M)) == 1
          done = len(re.findall(r'^- \[x\] ', s, re.M))
          open_ = len(re.findall(r'^- \[ \] ', s, re.M))
          assert (done, open_) == (327, 0), (done, open_)
          assert '## v12.3 — Reconnaissance Network & Electronic Counter-Logistics' not in s
          section = '''\n## v12.3 — Reconnaissance Network & Electronic Counter-Logistics — IN DEVELOPMENT\n- [ ] Bounded physical scout-relay network and enemy jammer infrastructure use canonical Health/collision authority and stay subordinate to the active v12.1/v12.2 logistics operation.\n- [ ] Player relay-sync gameplay progressively converts enemy logistics from unknown contact to verified route intelligence without granting permanent omniscience.\n- [ ] Enemy electronic jamming creates a bounded interference/spoof state; destroying the jammer restores confidence and grants only existing War Bond rewards.\n- [ ] Existing Fast/Elite/Sniper combatants form bounded EW guard and counter-recon screens through TacticalNavigationAgent without replacing EnemyTank/Rigidbody2D authority.\n- [ ] Signal-quality telemetry and a compact HUD expose relay sync, intelligence packets, jammer status, spoof risk and verified-route state during live logistics operations.\n- [ ] Relay, jammer, guard-order and intelligence state cleanly reset on route resolution/round change with strict asset and actor caps for late-campaign performance.\n- [ ] v12.3 runtime smoke verifies relay/jammer bounds, deterministic lane placement, intelligence thresholds, EW guard roles, cleanup contracts and unchanged Health/Projectile/TankGame authority.\n- [ ] Packaged Windows x64 v12.3 qualification builds and boots the exact candidate, executes recon/EW smoke checks and rejects blocking exception signatures before qualification.\n'''
          marker = '\n## Development rules'
          assert marker in s
          s = s.replace(marker, section + marker, 1)
          s = s.replace('badge.svg?branch=dev-v12-2', 'badge.svg?branch=dev-v12-3', 1)
          s = s.replace('ROADMAP-100.0%25-brightgreen', 'ROADMAP-97.6%25-brightgreen', 1)
          s = s.replace('DONE-327%2F327-1f6feb', 'DONE-327%2F335-1f6feb', 1)
          s = s.replace('STATUS-V12.2%20QUALIFIED-brightgreen', 'STATUS-V12.3%20IN%20DEVELOPMENT-yellow', 1)
          s = s.replace('████████████████████ 100.0%', '███████████████████░ 97.6%', 1)
          s = s.replace('| **327** | **0** | **327** | **100.0%** |', '| **327** | **8** | **335** | **97.6%** |', 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify SWIR Roadmap v1 dashboard after registration
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(327,8,335),(done,open_,total)
          assert 'ROADMAP-97.6%25-brightgreen' in s
          assert 'DONE-327%2F335' in s
          assert 'STATUS-V12.3%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.6%' in s
          assert '| **327** | **8** | **335** | **97.6%** |' in s
          start=s.index('## v12.3 — Reconnaissance Network & Electronic Counter-Logistics — IN DEVELOPMENT')
          end=s.index('\n## Development rules', start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
      - name: Commit registered roadmap scope
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ROADMAP.md; then
            echo 'ROADMAP already registered; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v12.3): register recon EW roadmap scope'
          git push origin HEAD:dev-v12-3
