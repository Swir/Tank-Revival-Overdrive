name: Deception v14.2 Exact-Evidence Finalizer

on:
  push:
    branches: ['dev-v14-2']
    paths:
      - 'Tools/finalize_v142_roadmap.py'
      - '.github/workflows/deception-v142-finalize.yml'

permissions:
  contents: write
  actions: read

env:
  CANDIDATE_SHA: 1c846c02f7867170e52593cf9d7ddc9a0b842b08
  WINDOWS_RUN: '35517709576'
  TYPE_RUN: '35517711106'
  SOURCE_RUN: '35517711102'
  PRESENTATION_RUN: '35517711093'
  ARTIFACT_ID: '10607850989'
  ARTIFACT_NAME: TankRevivalOverdrive-v14.2-deception-Windows-x64
  ARTIFACT_BYTES: '60295014'
  ARTIFACT_DIGEST: sha256:a4947d769645c8213098066a09cb823009b4cb422776f0422262f23c6718c5c6

jobs:
  finalize:
    name: Verify exact v14.2 evidence and finalize roadmap truth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify post-candidate change boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${CANDIDATE_SHA}" HEAD
          python - <<'PY'
          import os, subprocess
          allowed={
            'Tools/finalize_v142_roadmap.py',
            '.github/workflows/deception-v142-finalize.yml',
          }
          candidate=os.environ['CANDIDATE_SHA']
          changed=set(subprocess.check_output(['git','diff','--name-only',candidate+'..HEAD'], text=True).splitlines())
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit('Unexpected post-candidate paths: '+', '.join(sorted(unexpected)))
          if not changed:
              raise SystemExit('Expected finalizer bootstrap paths after candidate')
          print('Post-candidate boundary PASS:', sorted(changed))
          PY
      - name: Verify exact GitHub qualification evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          candidate=os.environ['CANDIDATE_SHA']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          for env_name, expected_name in (
              ('WINDOWS_RUN','Deception v14.2 Windows Qualification Gate'),
              ('TYPE_RUN','C# Type Uniqueness Guard'),
              ('SOURCE_RUN','v14.2 Deception Source Qualification'),
              ('PRESENTATION_RUN','v14.2 Deception Presentation Qualification'),
          ):
              run=get('/actions/runs/'+os.environ[env_name])
              if run.get('conclusion')!='success' or run.get('head_sha')!=candidate or run.get('name')!=expected_name:
                  raise SystemExit(f'{env_name} exact evidence mismatch: {run.get("name")} {run.get("head_sha")} {run.get("conclusion")}')
          artifact=get('/actions/artifacts/'+os.environ['ARTIFACT_ID'])
          expected=(os.environ['ARTIFACT_NAME'], int(os.environ['ARTIFACT_BYTES']), os.environ['ARTIFACT_DIGEST'])
          actual=(artifact.get('name'), artifact.get('size_in_bytes'), artifact.get('digest'))
          if actual!=expected or artifact.get('expired'):
              raise SystemExit(f'artifact evidence mismatch: {actual} expected {expected} expired={artifact.get("expired")}')
          wr=artifact.get('workflow_run') or {}
          if str(wr.get('id'))!=os.environ['WINDOWS_RUN'] or wr.get('head_sha')!=candidate:
              raise SystemExit('artifact provenance does not point to exact Windows run/candidate')
          print('Exact v14.2 GitHub evidence PASS')
          PY
      - name: Finalize roadmap, README and evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Tools/finalize_v142_roadmap.py Tools/generate_progress_svgs.py Tools/swir_visual_report_guard.py Tools/verify_v142_deception.py Tools/verify_v142_presentation.py Tools/verify_v142_runtime_gate.py
          python Tools/verify_v142_deception.py
          python Tools/verify_v142_presentation.py
          python Tools/verify_v142_runtime_gate.py
          python Tools/finalize_v142_roadmap.py
          python Tools/generate_progress_svgs.py --write --embed
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          python - <<'PY'
          from pathlib import Path
          import re
          road=Path('ROADMAP.md').read_text(encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ', road, re.M)); open_=len(re.findall(r'^- \[ \] ', road, re.M))
          assert (done,open_,done+open_)==(487,0,487)
          assert '| **487** | **0** | **487** | **100.0%** |' in road
          assert 'STATUS-V14.2%20QUALIFIED-brightgreen' in road
          assert '## v14.2 — Deception, Emission Discipline & Shoot-and-Scoot Warfare — QUALIFIED' in road
          assert '**487 / 487 completed (100.0%)**' in readme
          assert 'Deception, Emission Discipline & Shoot-and-Scoot Warfare v14.2 — qualified' in readme
          assert '## 🔎 Search Keywords' in readme
          for text,name in ((road,'ROADMAP'),(readme,'README')):
              if re.search(r'(?m)^[\s>*-]*[█▓▒░]{6,}', text):
                  raise SystemExit(name+' contains retired character meter')
          print('v14.2 closed-state math/presentation PASS')
          PY
          git diff --check
      - name: Commit exact-evidence closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg docs/qualification/V14_2_WINDOWS_QUALIFICATION.md
          git diff --cached --quiet && { echo 'No closeout changes required.'; exit 0; }
          git commit -m 'roadmap(v14.2): close exact-qualified deception milestone [skip ci]'
          git push origin HEAD:dev-v14-2
