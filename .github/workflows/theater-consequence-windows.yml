name: Theater Consequence v10.2 Windows Gate

on:
  push:
    branches:
      - 'dev-v10-2'
    paths:
      - '.theater-consequence-v102-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v10.2 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v10.2 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v10.2.0-dev"
          test -f Assets/Scripts/TheaterConsequenceEngineDirector.cs
          test -f Assets/Scripts/TheaterConsequenceEngineCISmokeProbe.cs
          grep -q 'TheaterSectorDoctrine.Breakthrough' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q 'TheaterSectorDoctrine.SupplyStarved' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q 'TheaterSectorDoctrine.PreparedDefense' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q 'WarStateCampaignMemoryDirector.Instance' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q 'TheaterOrderDirector.Instance' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q 'CombinedArmsCampaignCommandDirector.Instance' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q 'SpawnProjectile' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q 'WarEconomyDirector.AwardMissionBonds' Assets/Scripts/TheaterConsequenceEngineDirector.cs
          grep -q '## v10.2 — Theater Consequence Engine, Sector Doctrines & Branching War State — IN PROGRESS' ROADMAP.md
          grep -q 'DONE-214%2F218' ROADMAP.md
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v102-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v102-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v10.2-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v10.2-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.2-candidate-Windows-x64
          path: TankRevivalOverdrive-v10.2-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v10.2 candidate and validate consequence engine
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.2-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v10.2-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v10.2 consequence-engine packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item THEATER_CONSEQUENCE_PASS.txt, THEATER_CONSEQUENCE_FAIL.txt, TheaterConsequencePlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-theater-consequence-smoke','-logFile','TheaterConsequencePlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v10.2 consequence-engine smoke timed out after 60 seconds'
          }
          if (Test-Path 'THEATER_CONSEQUENCE_FAIL.txt') {
            Get-Content THEATER_CONSEQUENCE_FAIL.txt
            if (Test-Path TheaterConsequencePlayer.log) { Get-Content TheaterConsequencePlayer.log -Tail 220 }
            throw 'v10.2 consequence-engine runtime probe reported FAIL'
          }
          if (!(Test-Path 'THEATER_CONSEQUENCE_PASS.txt')) {
            if (Test-Path TheaterConsequencePlayer.log) { Get-Content TheaterConsequencePlayer.log -Tail 220 }
            throw "Runtime exited without v10.2 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content THEATER_CONSEQUENCE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path TheaterConsequencePlayer.log) {
            if (Select-String -Path TheaterConsequencePlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content TheaterConsequencePlayer.log -Tail 240
              throw 'Blocking exception signature found during v10.2 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v10.2-consequence-diagnostics
          path: |
            candidate/runtime/THEATER_CONSEQUENCE_PASS.txt
            candidate/runtime/THEATER_CONSEQUENCE_FAIL.txt
            candidate/runtime/TheaterConsequencePlayer.log
          if-no-files-found: ignore
          retention-days: 14
