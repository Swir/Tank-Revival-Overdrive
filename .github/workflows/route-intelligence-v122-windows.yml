name: Route Intelligence v12.2 Windows Gate

on:
  push:
    branches: ['dev-v12-2']
    paths:
      - 'Assets/Scripts/LogisticsRouteIntelligenceDirector.cs'
      - 'Assets/Scripts/LogisticsRouteIntelligenceCISmokeProbe.cs'
      - '.github/workflows/route-intelligence-v122-windows.yml'
      - '.v122-qualification-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v12.2 route, decoy and authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          test -f Assets/Scripts/LogisticsRouteIntelligenceCISmokeProbe.cs
          test -f Assets/Scripts/OperationalSustainmentDirector.cs
          test -f Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          test -f Assets/Scripts/ReactiveCoverBreachDirector.cs
          test -f Assets/Scripts/TerrainIntelligenceDirector.cs
          test -f Assets/Scripts/TacticalNavigationDirector.cs
          grep -q 'RouteCount = 3' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'MaxReroutes = 2' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'MaxDecoys = 1' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'MaxAmbushActors = 3' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'SustainmentLaneField.SetValue' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'ReactiveCoverBreachDirector.TryFindRecentBreachNear' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'TacticalNavigationAgent' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'AddComponent<Health>' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'RigidbodyType2D.Kinematic' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'ShouldSpawnDecoy' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'UpdateIntel' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'AssignRouteCell' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          grep -q 'V12_2_ROUTE_INTEL_SMOKE_OK.txt' Assets/Scripts/LogisticsRouteIntelligenceCISmokeProbe.cs
          grep -q 'TerrainIntelligenceDirector.ConfigurationValid' Assets/Scripts/LogisticsRouteIntelligenceCISmokeProbe.cs
          grep -q 'routeCases=' Assets/Scripts/LogisticsRouteIntelligenceCISmokeProbe.cs
          grep -q 'decoyCases=' Assets/Scripts/LogisticsRouteIntelligenceCISmokeProbe.cs
          if grep -Eq 'SpawnProjectile\(|AddComponent<Projectile>|\.Damage\(' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs; then
            echo 'Route intelligence contains forbidden projectile/direct-damage authority.' >&2
            exit 1
          fi
          if grep -q 'MovePosition' Assets/Scripts/LogisticsRouteIntelligenceDirector.cs; then
            echo 'Route intelligence must not move the real sustainment column directly.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(319,8,327),(done,open_,total)
          assert 'ROADMAP-97.6%25-brightgreen' in s
          assert 'DONE-319%2F327' in s
          assert 'STATUS-V12.2%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.6%' in s
          assert '| **319** | **8** | **327** | **97.6%** |' in s
          start=s.index('## v12.2 — Route Intelligence, Ambush & Decoy Warfare — IN DEVELOPMENT')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0

  build-candidate:
    name: Build exact v12.2 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V122RouteIntelligence-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V122RouteIntelligence-Library-${{ runner.os }}-6000.3.17f1-
            V121OperationalSustainment-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v12.2-route-intelligence-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v12.2-route-intelligence-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.2-route-intelligence-Windows-x64
          path: TankRevivalOverdrive-v12.2-route-intelligence-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v12.2 route intelligence
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.2-route-intelligence-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v12.2-route-intelligence-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v12.2 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V12_2_ROUTE_INTEL_SMOKE_OK.txt, V12_2_ROUTE_INTEL_SMOKE_FAIL.txt, V122RouteIntelPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-tr-v122-smoke','-logFile','V122RouteIntelPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v12.2 route intelligence smoke timed out after 70 seconds'
          }
          if (Test-Path 'V12_2_ROUTE_INTEL_SMOKE_FAIL.txt') {
            Get-Content V12_2_ROUTE_INTEL_SMOKE_FAIL.txt
            if (Test-Path V122RouteIntelPlayer.log) { Get-Content V122RouteIntelPlayer.log -Tail 300 }
            throw 'v12.2 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V12_2_ROUTE_INTEL_SMOKE_OK.txt')) {
            if (Test-Path V122RouteIntelPlayer.log) { Get-Content V122RouteIntelPlayer.log -Tail 300 }
            throw "Runtime exited without v12.2 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V12_2_ROUTE_INTEL_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V122RouteIntelPlayer.log) {
            if (Select-String -Path V122RouteIntelPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V122RouteIntelPlayer.log -Tail 340
              throw 'Blocking exception signature found during v12.2 runtime smoke'
            }
          }
          Write-Host 'v12.2 route intelligence runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.2-route-intelligence-diagnostics
          path: |
            candidate/runtime/V12_2_ROUTE_INTEL_SMOKE_OK.txt
            candidate/runtime/V12_2_ROUTE_INTEL_SMOKE_FAIL.txt
            candidate/runtime/V122RouteIntelPlayer.log
          if-no-files-found: ignore
          retention-days: 14
