name: Component Damage & Emergency Repair v12.9 Windows Gate

on:
  push:
    branches: ['dev-v12-9']
    paths:
      - '.v129-windows-gate-trigger'
      - 'Assets/Scripts/ComponentDamageWarfare.cs'
      - 'Assets/Scripts/ArmorSystem.cs'
      - 'Assets/Scripts/EmergencyRepairSystem.cs'
      - 'Assets/Scripts/ComponentDamageRepairDirector.cs'
      - 'Assets/Scripts/ComponentDamageRepairCISmokeProbe.cs'
      - 'Assets/Scripts/ComponentDamageRepairCISmokeProbe.cs.meta'
      - 'Assets/Scripts/PlayerTank.cs'
      - 'Assets/Scripts/EnemyTank.cs'
      - 'Assets/Scripts/FireControlBallisticsDirector.cs'
      - 'Assets/Scripts/Projectile.cs'
      - '.github/scripts/package_v129_component_warfare.py'
      - '.github/scripts/test_package_v129_component_warfare.py'
      - '.github/workflows/component-damage-repair-v129-windows.yml'
      - 'CHANGELOG_v12.9.md'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.17f1
  CANDIDATE_ZIP: TankRevivalOverdrive-v12.9-component-warfare-Windows-x64.zip
  PACKAGE_DIR: tro-v129-package

jobs:
  source-contracts:
    name: Verify v12.9 component, repair, authority and roadmap contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch checkout and packager fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v12-9'
          python -m py_compile .github/scripts/package_v129_component_warfare.py .github/scripts/test_package_v129_component_warfare.py
          python .github/scripts/test_package_v129_component_warfare.py
      - name: Verify implementation and canonical authority integration
        shell: bash
        run: |
          set -euo pipefail
          for f in Assets/Scripts/ComponentDamageWarfare.cs Assets/Scripts/ArmorSystem.cs Assets/Scripts/EmergencyRepairSystem.cs Assets/Scripts/ComponentDamageRepairDirector.cs Assets/Scripts/ComponentDamageRepairCISmokeProbe.cs Assets/Scripts/PlayerTank.cs Assets/Scripts/EnemyTank.cs Assets/Scripts/FireControlBallisticsDirector.cs Assets/Scripts/Projectile.cs CHANGELOG_v12.9.md; do test -f "$f"; done
          test "$(cat VERSION)" = 'v12.9.0-dev'
          grep -q 'DamagedThreshold = 70' Assets/Scripts/ArmorSystem.cs
          grep -q 'CriticalThreshold = 35' Assets/Scripts/ArmorSystem.cs
          grep -q 'DisabledThreshold = 12' Assets/Scripts/ArmorSystem.cs
          grep -q 'MinModuleDamage = 10' Assets/Scripts/ComponentDamageWarfare.cs
          grep -q 'MaxModuleDamage = 62' Assets/Scripts/ComponentDamageWarfare.cs
          grep -q 'MaxCharges = 2' Assets/Scripts/EmergencyRepairSystem.cs
          grep -q 'RepairAmount = 38' Assets/Scripts/EmergencyRepairSystem.cs
          grep -q 'ChannelSeconds = 2.6f' Assets/Scripts/EmergencyRepairSystem.cs
          grep -q 'CooldownSeconds = 10f' Assets/Scripts/EmergencyRepairSystem.cs
          grep -q 'MaxTrackedRepairSystems = 128' Assets/Scripts/ComponentDamageRepairDirector.cs
          grep -q 'MobilityMultiplier' Assets/Scripts/PlayerTank.cs
          grep -q 'ReloadMultiplier' Assets/Scripts/PlayerTank.cs
          grep -q 'MobilityMultiplier' Assets/Scripts/EnemyTank.cs
          grep -q 'ReloadMultiplier' Assets/Scripts/EnemyTank.cs
          grep -q 'WeaponFunctionMultiplier' Assets/Scripts/FireControlBallisticsDirector.cs
          grep -q 'ComponentDamageWarfare.PreferredModule' Assets/Scripts/ArmorSystem.cs
          grep -q 'V12_9_COMPONENT_DAMAGE_REPAIR_OK.txt' Assets/Scripts/ComponentDamageRepairCISmokeProbe.cs
          grep -q 'matrixCases != 21' Assets/Scripts/ComponentDamageRepairCISmokeProbe.cs
          grep -q 'CompleteImmediatelyForSmoke' Assets/Scripts/ComponentDamageRepairCISmokeProbe.cs
          if grep -Eq '\.Damage\(|\.Heal\(|SpawnProjectile|\.MovePosition\(|AddWarBonds|AwardMissionBonds|BindingFlags\.NonPublic|GetField\(' Assets/Scripts/ComponentDamageRepairDirector.cs Assets/Scripts/EmergencyRepairSystem.cs; then
            echo 'v12.9 repair layer contains forbidden Health/projectile/movement/economy/private-reflection authority.' >&2; exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for t in ['<!-- ROADMAP-PROGRESS:START -->','<!-- ROADMAP-PROGRESS:END -->','## 📊 Overall progress','| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |']: assert t in s,t
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(375,8,383),(done,open_,total)
          assert 'ROADMAP-97.9%25-yellow' in s and 'DONE-375%2F383' in s and 'STATUS-V12.9%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.9%' in s and '| **375** | **8** | **383** | **97.9%** |' in s
          section=s[s.index('## v12.9 — Component Damage & Emergency Repair Warfare — IN DEVELOPMENT'):]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          print('v12.9 roadmap scope: PASS')

  build-candidate:
    name: Build and package one exact v12.9 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail; test -n "$UNITY_LICENSE"; test -n "$UNITY_EMAIL"; test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V129ComponentWarfare-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V129ComponentWarfare-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            V128ReleaseTrain-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Dev-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
      - name: Build development player once
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Discover, stage and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/package_v129_component_warfare.py --build-root build --output-dir "${RUNNER_TEMP}/${PACKAGE_DIR}" --candidate-sha "${GITHUB_SHA}" --commit-sha "${GITHUB_SHA}" --unity-version "${UNITY_VERSION}" --version-file VERSION --zip-name "${CANDIDATE_ZIP}" --diagnostics-path "${GITHUB_WORKSPACE}/V129_COMPONENT_WARFARE_BUILD_TREE.txt"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.9-build-discovery
          path: V129_COMPONENT_WARFARE_BUILD_TREE.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.9-component-warfare-Windows-x64
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/${{ env.CANDIDATE_ZIP }}
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V129_COMPONENT_WARFARE_SHA256.txt
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V129_COMPONENT_WARFARE_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14

  packaged-exe-regression:
    name: Run v12.9 smoke, v12.8 integration and 80/90/100 soak on the same EXE
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.9-component-warfare-Windows-x64
          path: candidate
      - name: Verify package digest, provenance and attribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate
          $zip='${{ env.CANDIDATE_ZIP }}'; $expected=((Get-Content V129_COMPONENT_WARFARE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant(); $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw 'candidate ZIP digest mismatch'}
          $p=Get-Content V129_COMPONENT_WARFARE_PROVENANCE.json -Raw|ConvertFrom-Json
          if($p.candidate_sha -ne '${{ github.sha }}' -or $p.commit_sha -ne '${{ github.sha }}' -or $p.sha256 -ne $actual){throw 'candidate provenance mismatch'}
          Expand-Archive $zip -DestinationPath runtime -Force
          if(!(Test-Path runtime/TankRevivalOverdrive.exe) -or !(Test-Path runtime/TankRevivalOverdrive_Data)){throw 'packaged Unity runtime incomplete'}
          $info=Get-Content runtime/V129_COMPONENT_WARFARE_BUILD.txt -Raw; if($info -notmatch 'candidate_sha=${{ github.sha }}'){throw 'runtime attribution mismatch'}
          Write-Host "Verified exact v12.9 candidate SHA256: $actual"
      - name: Run exact single-binary qualification matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate/runtime
          $blocking='Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException'
          function Invoke-Smoke([string]$Name,[string]$Flag,[string]$Pass,[string]$Fail,[string]$Log,[int]$TimeoutMs){
            Remove-Item $Pass,$Fail,$Log -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics',$Flag,'-logFile',$Log -PassThru
            if(!$p.WaitForExit($TimeoutMs)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "$Name timed out"}
            if(Test-Path $Fail){Get-Content $Fail; if(Test-Path $Log){Get-Content $Log -Tail 350}; throw "$Name emitted FAIL"}
            if(!(Test-Path $Pass)){if(Test-Path $Log){Get-Content $Log -Tail 350}; throw "$Name exited without PASS (exit=$($p.ExitCode))"}
            if($p.ExitCode -ne 0){throw "$Name non-zero exit $($p.ExitCode)"}
            if(Test-Path $Log){if(Select-String -Path $Log -Pattern $blocking -Quiet){Get-Content $Log -Tail 400; throw "$Name blocking exception signature"}}
            Get-Content $Pass; Write-Host "$Name PASS"
          }
          Invoke-Smoke 'v12.9 component/repair' '-tr-v129-smoke' 'V12_9_COMPONENT_DAMAGE_REPAIR_OK.txt' 'V12_9_COMPONENT_DAMAGE_REPAIR_FAIL.txt' 'V129Player.log' 80000
          Invoke-Smoke 'v12.8 integration regression' '-tr-v128-smoke' 'V12_8_RELEASE_TRAIN_INTEGRATION_OK.txt' 'V12_8_RELEASE_TRAIN_INTEGRATION_FAIL.txt' 'V128Regression.log' 80000
          Invoke-Smoke 'round 80/90/100 soak regression' '-demo-ci-soak' 'DEMO_SOAK_PASS.txt' 'DEMO_SOAK_FAIL.txt' 'V129Soak.log' 110000
          'v12.9 exact-candidate matrix PASS' | Set-Content V12_9_WINDOWS_MATRIX_OK.txt
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.9-component-warfare-diagnostics
          path: |
            candidate/runtime/V12_9_COMPONENT_DAMAGE_REPAIR_OK.txt
            candidate/runtime/V12_9_COMPONENT_DAMAGE_REPAIR_FAIL.txt
            candidate/runtime/V12_8_RELEASE_TRAIN_INTEGRATION_OK.txt
            candidate/runtime/V12_8_RELEASE_TRAIN_INTEGRATION_FAIL.txt
            candidate/runtime/DEMO_SOAK_PASS.txt
            candidate/runtime/DEMO_SOAK_FAIL.txt
            candidate/runtime/V12_9_WINDOWS_MATRIX_OK.txt
            candidate/runtime/V129Player.log
            candidate/runtime/V128Regression.log
            candidate/runtime/V129Soak.log
          if-no-files-found: ignore
          retention-days: 14
