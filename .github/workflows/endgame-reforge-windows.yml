name: War State Endgame v10.7 Windows Gate

on:
  push:
    branches:
      - 'dev-v10-7'
    paths:
      - '.endgame-reforge-v107-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v10.7 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v10.7 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v10.7.0-dev"
          test -f Assets/Scripts/WarStateEndgameDirector.cs
          test -f Assets/Scripts/WarStateEndgameCISmokeProbe.cs
          grep -q 'WarStateEndgameDirector_v10_7' Assets/Scripts/WarStateEndgameDirector.cs
          grep -q 'CounterOffensiveCampaignDirector.Instance' Assets/Scripts/WarStateEndgameDirector.cs
          grep -q 'EndgameStartRound = 90' Assets/Scripts/WarStateEndgameDirector.cs
          grep -q 'FinalRound = 100' Assets/Scripts/WarStateEndgameDirector.cs
          grep -q 'SpawnProjectile' Assets/Scripts/WarStateEndgameDirector.cs
          grep -q '## v10.7 — War State Director, Dynamic Operation Chains & Campaign Endgame Reforge — IN PROGRESS' ROADMAP.md
          grep -q 'DONE-234%2F239' ROADMAP.md
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v107-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v107-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v10.7-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v10.7-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.7-candidate-Windows-x64
          path: TankRevivalOverdrive-v10.7-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v10.7 candidate and validate endgame reforge
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.7-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v10.7-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v10.7 endgame packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item ENDGAME_REFORGE_PASS.txt, ENDGAME_REFORGE_FAIL.txt, EndgamePlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-endgame-reforge-smoke','-logFile','EndgamePlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v10.7 endgame smoke timed out after 60 seconds'
          }
          if (Test-Path 'ENDGAME_REFORGE_FAIL.txt') {
            Get-Content ENDGAME_REFORGE_FAIL.txt
            if (Test-Path EndgamePlayer.log) { Get-Content EndgamePlayer.log -Tail 240 }
            throw 'v10.7 endgame runtime probe reported FAIL'
          }
          if (!(Test-Path 'ENDGAME_REFORGE_PASS.txt')) {
            if (Test-Path EndgamePlayer.log) { Get-Content EndgamePlayer.log -Tail 240 }
            throw "Runtime exited without v10.7 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content ENDGAME_REFORGE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path EndgamePlayer.log) {
            if (Select-String -Path EndgamePlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content EndgamePlayer.log -Tail 260
              throw 'Blocking exception signature found during v10.7 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v10.7-endgame-diagnostics
          path: |
            candidate/runtime/ENDGAME_REFORGE_PASS.txt
            candidate/runtime/ENDGAME_REFORGE_FAIL.txt
            candidate/runtime/EndgamePlayer.log
          if-no-files-found: ignore
          retention-days: 14
