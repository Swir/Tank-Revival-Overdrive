name: Reactive Cover Breakthrough v11.8 Windows Gate

on:
  push:
    branches: ['dev-v11-8']
    paths: ['.v118-reactive-cover-gate-trigger']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v11.8 cover, breach and authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/Obstacle.cs
          test -f Assets/Scripts/Projectile.cs
          test -f Assets/Scripts/ReactiveCoverBreachDirector.cs
          test -f Assets/Scripts/ReactiveCoverBreachCISmokeProbe.cs
          test -f Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          test -f Assets/Scripts/SiegeLineWarfareDirector.cs
          test -f Assets/Scripts/MassBattleFxBudget.cs
          grep -q 'ObstacleImpactResult ResolveProjectileImpact' Assets/Scripts/Obstacle.cs
          grep -q 'StructuralDamageFor' Assets/Scripts/Obstacle.cs
          grep -q 'AmmoType.ArmorPiercing' Assets/Scripts/Obstacle.cs
          grep -q 'AmmoType.Explosive' Assets/Scripts/Obstacle.cs
          grep -q 'AmmoType.Plasma' Assets/Scripts/Obstacle.cs
          grep -q 'ReactiveCoverBreachDirector.ReportBreach' Assets/Scripts/Obstacle.cs
          grep -q 'obstacle.ResolveProjectileImpact' Assets/Scripts/Projectile.cs
          grep -q 'directObstacle' Assets/Scripts/Projectile.cs
          grep -q 'AmmoType.Explosive' Assets/Scripts/SiegeLineWarfareDirector.cs
          grep -q 'TryFindBestBreach' Assets/Scripts/AdaptivePlatoonManeuverDirector.cs
          grep -q 'MaxRecentBreaches = 16' Assets/Scripts/ReactiveCoverBreachDirector.cs
          grep -q 'V118_REACTIVE_COVER_SMOKE_OK.txt' Assets/Scripts/ReactiveCoverBreachCISmokeProbe.cs
          if grep -Eq '\.SpawnProjectile\(|\.MovePosition\(|\.Damage\(|\.Heal\(' Assets/Scripts/ReactiveCoverBreachDirector.cs; then
            echo 'Breach memory contains forbidden gameplay-authority call.' >&2
            exit 1
          fi
          if grep -Eq 'AddComponent<Rigidbody2D>|AddComponent<Health>|AddComponent<ArmorSystem>|AddComponent<Projectile>' Assets/Scripts/ReactiveCoverBreachDirector.cs; then
            echo 'Breach memory attempts to create gameplay-authority components.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(287,8,295),(done,open_,total)
          assert 'ROADMAP-97.3%25-brightgreen' in s
          assert 'DONE-287%2F295' in s
          assert 'STATUS-V11.8%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.3%' in s
          assert '| **287** | **8** | **295** | **97.3%** |' in s
          start=s.index('## v11.8 — Reactive Cover Breakthrough & Destructible Tactical Terrain — IN DEVELOPMENT')
          end=s.index('\n## Development rules',start)
          section=s[start:end]
          assert section.count('- [ ]')==8
          assert section.count('- [x]')==0

  build-candidate:
    name: Build exact v11.8 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V118ReactiveCover-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V118ReactiveCover-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
      - name: Pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v11.8-reactive-cover-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v11.8-reactive-cover-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.8-reactive-cover-Windows-x64
          path: TankRevivalOverdrive-v11.8-reactive-cover-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v11.8 reactive cover
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.8-reactive-cover-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v11.8-reactive-cover-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v11.8 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V118_REACTIVE_COVER_SMOKE_OK.txt, V118_REACTIVE_COVER_SMOKE_FAIL.txt, V118ReactiveCoverPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-v118-reactive-cover-smoke','-logFile','V118ReactiveCoverPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v11.8 reactive cover smoke timed out after 70 seconds'
          }
          if (Test-Path 'V118_REACTIVE_COVER_SMOKE_FAIL.txt') {
            Get-Content V118_REACTIVE_COVER_SMOKE_FAIL.txt
            if (Test-Path V118ReactiveCoverPlayer.log) { Get-Content V118ReactiveCoverPlayer.log -Tail 240 }
            throw 'v11.8 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V118_REACTIVE_COVER_SMOKE_OK.txt')) {
            if (Test-Path V118ReactiveCoverPlayer.log) { Get-Content V118ReactiveCoverPlayer.log -Tail 240 }
            throw "Runtime exited without v11.8 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V118_REACTIVE_COVER_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V118ReactiveCoverPlayer.log) {
            if (Select-String -Path V118ReactiveCoverPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V118ReactiveCoverPlayer.log -Tail 280
              throw 'Blocking exception signature found during v11.8 runtime smoke'
            }
          }
          Write-Host 'v11.8 reactive cover breakthrough runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v11.8-reactive-cover-diagnostics
          path: |
            candidate/runtime/V118_REACTIVE_COVER_SMOKE_OK.txt
            candidate/runtime/V118_REACTIVE_COVER_SMOKE_FAIL.txt
            candidate/runtime/V118ReactiveCoverPlayer.log
          if-no-files-found: ignore
          retention-days: 14
