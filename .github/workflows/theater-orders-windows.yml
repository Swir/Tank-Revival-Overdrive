name: Theater Orders v10.1 Windows Gate

on:
  push:
    branches:
      - 'dev-v10-1'
    paths:
      - '.theater-orders-v101-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v10.1 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v10.1 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v10.1.0-dev"
          test -f Assets/Scripts/TheaterOrderDirector.cs
          test -f Assets/Scripts/TheaterOrderCISmokeProbe.cs
          grep -q 'TheaterOrderKind.Assault' Assets/Scripts/TheaterOrderDirector.cs
          grep -q 'TheaterOrderKind.Interdiction' Assets/Scripts/TheaterOrderDirector.cs
          grep -q 'TheaterOrderKind.Fortify' Assets/Scripts/TheaterOrderDirector.cs
          grep -q 'SpawnProjectile' Assets/Scripts/TheaterOrderDirector.cs
          grep -q 'ENEMY_THEATER_COMMAND_RELAY_V100' Assets/Scripts/TheaterOrderDirector.cs
          grep -q 'ENEMY_LOGISTICS_' Assets/Scripts/TheaterOrderDirector.cs
          grep -q 'WarEconomyDirector.AwardMissionBonds' Assets/Scripts/TheaterOrderDirector.cs
          grep -q 'CombinedArmsCampaignCommandDirector.Instance' Assets/Scripts/TheaterOrderDirector.cs
          grep -q '## v10.1 — Theater Orders, Operation Branching & Campaign Consequences — IN PROGRESS' ROADMAP.md
          grep -q 'DONE-210%2F214' ROADMAP.md
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v101-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v101-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v10.1-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v10.1-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.1-candidate-Windows-x64
          path: TankRevivalOverdrive-v10.1-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v10.1 candidate and validate theater orders
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.1-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v10.1-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v10.1 theater-orders packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item THEATER_ORDERS_PASS.txt, THEATER_ORDERS_FAIL.txt, TheaterOrdersPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-theater-orders-smoke','-logFile','TheaterOrdersPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v10.1 theater-orders smoke timed out after 60 seconds'
          }
          if (Test-Path 'THEATER_ORDERS_FAIL.txt') {
            Get-Content THEATER_ORDERS_FAIL.txt
            if (Test-Path TheaterOrdersPlayer.log) { Get-Content TheaterOrdersPlayer.log -Tail 220 }
            throw 'v10.1 theater-orders runtime probe reported FAIL'
          }
          if (!(Test-Path 'THEATER_ORDERS_PASS.txt')) {
            if (Test-Path TheaterOrdersPlayer.log) { Get-Content TheaterOrdersPlayer.log -Tail 220 }
            throw "Runtime exited without v10.1 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content THEATER_ORDERS_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path TheaterOrdersPlayer.log) {
            if (Select-String -Path TheaterOrdersPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content TheaterOrdersPlayer.log -Tail 240
              throw 'Blocking exception signature found during v10.1 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v10.1-theater-orders-diagnostics
          path: |
            candidate/runtime/THEATER_ORDERS_PASS.txt
            candidate/runtime/THEATER_ORDERS_FAIL.txt
            candidate/runtime/TheaterOrdersPlayer.log
          if-no-files-found: ignore
          retention-days: 14
