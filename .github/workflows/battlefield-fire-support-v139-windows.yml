name: Fire Support v13.9 Windows Qualification Gate

on:
  push:
    branches: ['dev-v13-9']
    paths:
      - '.v139-windows-gate-trigger'
      - 'Assets/Scripts/BattlefieldFireSupportV139.cs'
      - 'Assets/Scripts/BattlefieldFireSupportCISmokeProbe.cs'
      - 'Assets/Scripts/BattlefieldSuppressionMoraleV138.cs'
      - 'Assets/Scripts/BattlefieldCohesionV133.cs'
      - 'Assets/Scripts/BattlefieldSensorFusionV136.cs'
      - 'Assets/Scripts/TacticalTerrainV134.cs'
      - 'Assets/Scripts/RuntimeBattleRegistry.cs'
      - 'Assets/Scripts/TankGame.cs'
      - 'Assets/Scripts/DemoCISoakProbe.cs'
      - 'Assets/Editor/CIBuild.cs'
      - '.github/scripts/package_v139_fire_support.py'
      - '.github/scripts/test_package_v139_fire_support.py'
      - '.github/workflows/battlefield-fire-support-v139-windows.yml'
      - 'Tools/verify_v139_fire_support.py'
      - 'Tools/verify_csharp_type_uniqueness.py'
      - 'Tools/verify_production_audio_assets.py'
      - 'Tools/verify_unity_ci_bootstrap.py'
      - 'Tools/generate_progress_svgs.py'
      - 'Tools/swir_visual_report_guard.py'
      - 'ROADMAP.md'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.17f1
  CANDIDATE_ZIP: TankRevivalOverdrive-v13.9-fire-support-Windows-x64.zip
  PACKAGE_DIR: tro-v139-package

jobs:
  source-contracts:
    name: Verify v13.9 fire-support, authority, progress and package contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      qualification_needed: ${{ steps.roadmap-state.outputs.qualification_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source/package contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v13-9'
          test "$(cat VERSION)" = 'v13.9.0-dev'
          python -m py_compile \
            .github/scripts/package_v139_fire_support.py \
            .github/scripts/test_package_v139_fire_support.py \
            Tools/verify_v139_fire_support.py \
            Tools/verify_csharp_type_uniqueness.py \
            Tools/verify_production_audio_assets.py \
            Tools/verify_unity_ci_bootstrap.py \
            Tools/generate_progress_svgs.py \
            Tools/swir_visual_report_guard.py
          python .github/scripts/test_package_v139_fire_support.py
          python Tools/verify_v139_fire_support.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/verify_production_audio_assets.py
          python Tools/verify_unity_ci_bootstrap.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          git diff --check
      - name: Verify clean qualification policy
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/battlefield-fire-support-v139-windows.yml'
          grep -Fq 'Enforce clean Unity qualification state' "$workflow"
          cache_action='actions/'"cache@"
          if grep -Fq "uses: ${cache_action}" "$workflow"; then
            echo 'Qualification must not use Unity Library caches.' >&2
            exit 1
          fi
          restore_key='restore'"-keys:"
          if grep -Fq "$restore_key" "$workflow"; then
            echo 'Cross-candidate restore keys are forbidden.' >&2
            exit 1
          fi
      - name: Verify open v13.9 roadmap truth
        id: roadmap-state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', roadmap, re.M))
          open_ = len(re.findall(r'^- \[ \] ', roadmap, re.M))
          total = done + open_
          if (done, open_, total) != (455, 8, 463):
              raise SystemExit(
                  f'v13.9 exact-candidate gate requires open roadmap state 455/463; '
                  f'found {done}/{total} with {open_} open'
              )
          assert '| **455** | **8** | **463** | **98.3%** |' in roadmap
          assert 'V13.9%20IN%20DEVELOPMENT' in roadmap
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('qualification_needed=true\n')
          print('qualification_needed=true')
          PY

  build-candidate:
    name: Build and package one exact v13.9 Windows x64 candidate
    needs: source-contracts
    if: needs.source-contracts.outputs.qualification_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Enforce clean Unity qualification state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Library Temp obj
          test ! -e Library
          test ! -e Temp
          echo 'Exact v13.9 qualification starts from a clean Unity import state.'
      - name: Build development player once
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Discover, stage and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/package_v139_fire_support.py \
            --build-root build \
            --output-dir "${RUNNER_TEMP}/${PACKAGE_DIR}" \
            --candidate-sha "${GITHUB_SHA}" \
            --commit-sha "${GITHUB_SHA}" \
            --unity-version "${UNITY_VERSION}" \
            --version-file VERSION \
            --zip-name "${CANDIDATE_ZIP}" \
            --diagnostics-path "${GITHUB_WORKSPACE}/V139_FIRE_SUPPORT_BUILD_TREE.txt"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v13.9-fire-support-build-discovery
          path: V139_FIRE_SUPPORT_BUILD_TREE.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v13.9-fire-support-Windows-x64
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/${{ env.CANDIDATE_ZIP }}
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V139_FIRE_SUPPORT_SHA256.txt
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V139_FIRE_SUPPORT_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14

  packaged-exe-regression:
    name: Run v13.9 fire-support plus v13.8-v13.6 and 80/90/100 regression on the same EXE
    needs: [source-contracts, build-candidate]
    if: needs.source-contracts.outputs.qualification_needed == 'true' && needs.build-candidate.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v13.9-fire-support-Windows-x64
          path: candidate
      - name: Verify exact package provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location candidate
          $zip='${{ env.CANDIDATE_ZIP }}'
          $expected=((Get-Content V139_FIRE_SUPPORT_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw 'candidate ZIP digest mismatch'}
          $p=Get-Content V139_FIRE_SUPPORT_PROVENANCE.json -Raw|ConvertFrom-Json
          if($p.candidate_sha -ne '${{ github.sha }}' -or
             $p.commit_sha -ne '${{ github.sha }}' -or
             $p.sha256 -ne $actual -or
             $p.version -ne 'v13.9.0-dev'){
            throw 'candidate provenance mismatch'
          }
          Expand-Archive $zip -DestinationPath runtime -Force
          if(!(Test-Path runtime/TankRevivalOverdrive.exe) -or !(Test-Path runtime/TankRevivalOverdrive_Data)){
            throw 'packaged Unity runtime incomplete'
          }
          $info=Get-Content runtime/V139_FIRE_SUPPORT_BUILD.txt -Raw
          if($info -notmatch 'candidate_sha=${{ github.sha }}'){throw 'runtime attribution mismatch'}
          Write-Host "Verified exact v13.9 candidate SHA256: $actual"
      - name: Run exact single-binary qualification matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location candidate/runtime
          $blocking='Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException'
          function Invoke-Smoke([string]$Name,[string]$Flag,[string]$Pass,[string]$Fail,[string]$Log,[int]$TimeoutMs){
            Remove-Item $Pass,$Fail,$Log -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics',$Flag,'-logFile',$Log -PassThru
            if(!$p.WaitForExit($TimeoutMs)){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$Name timed out"
            }
            if(Test-Path $Fail){
              Get-Content $Fail
              if(Test-Path $Log){Get-Content $Log -Tail 350}
              throw "$Name emitted FAIL"
            }
            if(!(Test-Path $Pass)){
              if(Test-Path $Log){Get-Content $Log -Tail 350}
              throw "$Name exited without PASS (exit=$($p.ExitCode))"
            }
            if($p.ExitCode -ne 0){throw "$Name non-zero exit $($p.ExitCode)"}
            if(Test-Path $Log){
              if(Select-String -Path $Log -Pattern $blocking -Quiet){
                Get-Content $Log -Tail 400
                throw "$Name blocking exception signature"
              }
            }
            Get-Content $Pass
            Write-Host "$Name PASS"
          }
          Invoke-Smoke 'production authored-audio presentation preflight' '-production-presentation-smoke' 'PRODUCTION_PRESENTATION_PASS.txt' 'PRODUCTION_PRESENTATION_FAIL.txt' 'V139ProductionAudio.log' 80000
          Invoke-Smoke 'v13.9 fire-support command' '-tr-v139-smoke' 'V13_9_FIRE_SUPPORT_OK.txt' 'V13_9_FIRE_SUPPORT_FAIL.txt' 'V139Player.log' 90000
          Invoke-Smoke 'v13.8 suppression and morale regression' '-tr-v138-smoke' 'V13_8_SUPPRESSION_MORALE_OK.txt' 'V13_8_SUPPRESSION_MORALE_FAIL.txt' 'V138Regression.log' 90000
          Invoke-Smoke 'v13.7 late-round performance regression' '-tr-v137-smoke' 'V13_7_LATE_ROUND_PERFORMANCE_OK.txt' 'V13_7_LATE_ROUND_PERFORMANCE_FAIL.txt' 'V137Regression.log' 90000
          Invoke-Smoke 'v13.6 sensor fusion regression' '-tr-v136-smoke' 'V13_6_SENSOR_FUSION_OK.txt' 'V13_6_SENSOR_FUSION_FAIL.txt' 'V136Regression.log' 90000
          Invoke-Smoke 'round 80/90/100 soak regression' '-demo-ci-soak' 'DEMO_SOAK_PASS.txt' 'DEMO_SOAK_FAIL.txt' 'V139Soak.log' 110000
          'v13.9 exact-candidate qualification matrix PASS' | Set-Content V13_9_WINDOWS_MATRIX_OK.txt
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v13.9-fire-support-diagnostics
          path: |
            candidate/runtime/PRODUCTION_PRESENTATION_PASS.txt
            candidate/runtime/PRODUCTION_PRESENTATION_FAIL.txt
            candidate/runtime/V13_9_FIRE_SUPPORT_OK.txt
            candidate/runtime/V13_9_FIRE_SUPPORT_FAIL.txt
            candidate/runtime/V13_8_SUPPRESSION_MORALE_OK.txt
            candidate/runtime/V13_7_LATE_ROUND_PERFORMANCE_OK.txt
            candidate/runtime/V13_6_SENSOR_FUSION_OK.txt
            candidate/runtime/DEMO_SOAK_PASS.txt
            candidate/runtime/V13_9_WINDOWS_MATRIX_OK.txt
            candidate/runtime/V139ProductionAudio.log
            candidate/runtime/V139Player.log
            candidate/runtime/V138Regression.log
            candidate/runtime/V137Regression.log
            candidate/runtime/V136Regression.log
            candidate/runtime/V139Soak.log
          if-no-files-found: ignore
          retention-days: 14
