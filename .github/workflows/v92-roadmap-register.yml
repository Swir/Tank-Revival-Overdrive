name: V9.2 Roadmap Register

on:
  push:
    branches:
      - 'dev-v9-2'
    paths:
      - '.roadmap-v92-register-trigger'

permissions:
  contents: write

jobs:
  register-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v9-2
          fetch-depth: 0
      - name: Register v9.2 scope before implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('ROADMAP.md')
          text=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          if marker not in text: raise SystemExit('roadmap marker missing')
          if '## v9.2 — Fortification Networks, Artillery Positions & Breakthrough Operations' in text:
              raise SystemExit('v9.2 already registered')
          anchor='## Development rules'
          if anchor not in text: raise SystemExit('development rules anchor missing')
          section='''## v9.2 — Fortification Networks, Artillery Positions & Breakthrough Operations — IN PROGRESS
- [ ] Multi-node fortification network connects strongpoints with artillery and repair positions across friendly frontline lanes using existing Health/frontline authority.
- [ ] Artillery positions provide bounded real HE fire support while repair posts provide limited local recovery, with hard cadence and sustain caps.
- [ ] Enemy breakthrough operations retask existing Heavy/Siege/Elite units through TacticalNavigationAgent to attack the weakest fortification node with bounded projectile pressure.
- [ ] Packaged Windows v9.2 gate validates fortification-network scheduling, support/breakthrough safety bounds, runtime installation and exact EXE boot before qualification.

'''
          text=text.replace(anchor,section+anchor,1)
          completed=len(re.findall(r'^- \[x\] ',text,flags=re.M))
          remaining=len(re.findall(r'^- \[ \] ',text,flags=re.M))
          total=completed+remaining
          if (completed,remaining,total)!=(190,4,194): raise SystemExit(f'unexpected scope {completed}/{total} remaining={remaining}')
          pct=completed/total*100
          text=re.sub(r'badge\.svg\?branch=[^\"\)]+','badge.svg?branch=dev-v9-2',text,count=1)
          text=re.sub(r'https://img\.shields\.io/badge/ROADMAP-[^\"]+','https://img.shields.io/badge/ROADMAP-97.9%25-d29922?style=for-the-badge',text,count=1)
          text=re.sub(r'https://img\.shields\.io/badge/DONE-[^\"]+','https://img.shields.io/badge/DONE-190%2F194-1f6feb?style=for-the-badge',text,count=1)
          text=re.sub(r'https://img\.shields\.io/badge/STATUS-[^\"]+','https://img.shields.io/badge/STATUS-V9.2%20IN%20PROGRESS-d29922?style=for-the-badge',text,count=1)
          text=re.sub(r'(?m)^[█░]{20} [0-9.]+%$','████████████████████ 97.9%',text,count=1)
          text=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|','| **190** | **4** | **194** | **97.9%** |',text,count=1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify standard lock and registered scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!-- SWIR-ROADMAP-STANDARD:v1 -->' ROADMAP.md
          grep -q '## 📊 Overall progress' ROADMAP.md
          grep -q 'DONE-190%2F194' ROADMAP.md
          grep -q 'STATUS-V9.2%20IN%20PROGRESS' ROADMAP.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^- \[x\] ',text,flags=re.M))==190
          assert len(re.findall(r'^- \[ \] ',text,flags=re.M))==4
          m=re.search(r'(?m)^([█░]+) ([0-9.]+)%$',text)
          assert m and len(m.group(1))==20 and m.group(2)=='97.9'
          assert '| **190** | **4** | **194** | **97.9%** |' in text
          PY
      - name: Commit roadmap scope
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'roadmap(v9.2): register fortification network scope'
          git push origin HEAD:dev-v9-2
