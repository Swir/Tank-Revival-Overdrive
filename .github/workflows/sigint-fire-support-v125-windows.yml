name: Signals Intelligence Fire Support v12.5 Windows Gate

on:
  push:
    branches: ['dev-v12-5']
    paths:
      - 'Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs'
      - 'Assets/Scripts/SignalsIntelligenceFireSupportCISmokeProbe.cs'
      - 'Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs.meta'
      - 'Assets/Scripts/SignalsIntelligenceFireSupportCISmokeProbe.cs.meta'
      - 'CHANGELOG_v12.5.md'
      - 'VERSION'
      - '.github/workflows/sigint-fire-support-v125-windows.yml'
      - '.v125-qualification-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v12.5 SIGINT/fire-support authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          test -f Assets/Scripts/SignalsIntelligenceFireSupportCISmokeProbe.cs
          test -f Assets/Scripts/MobileSignalWarfareDirector.cs
          test -f Assets/Scripts/ReconElectronicWarfareDirector.cs
          test -f Assets/Scripts/OperationalSustainmentDirector.cs
          test -f Assets/Scripts/TankGame.cs
          test -f CHANGELOG_v12.5.md
          test "$(cat VERSION)" = 'v12.5.0-dev'
          grep -q 'MaxEmitters = 2' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'MaxGuardActors = 3' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'MaxFireMissionsPerOperation = 2' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'ShellsPerMission = 3' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'TriangulationQualityForGeometry' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'TankGame' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'SpawnProjectile' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'AmmoType.Explosive' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'TacticalNavigationAgent' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'TryGetRelayPosition' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'IsRelaySuppressed' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          grep -q 'V12_5_SIGINT_FIRE_SUPPORT_SMOKE_OK.txt' Assets/Scripts/SignalsIntelligenceFireSupportCISmokeProbe.cs
          grep -q 'anchorCases=' Assets/Scripts/SignalsIntelligenceFireSupportCISmokeProbe.cs
          if grep -Eq '\.Damage\(|AddComponent<Projectile>|GetComponent<Projectile>' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs; then
            echo 'SIGINT director contains forbidden direct-damage/projectile construction authority.' >&2
            exit 1
          fi
          if grep -Eq 'enemy\.transform\.position\s*=|enemy\.GetComponent<Rigidbody2D>\(\).*MovePosition|actor\.transform\.position\s*=' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs; then
            echo 'SIGINT director must not directly move EnemyTank actors.' >&2
            exit 1
          fi
          if grep -Eq 'GetField\(|BindingFlags|System\.Reflection' Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs; then
            echo 'SIGINT director must use public bridges, not private reflection.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          assert '<!-- ROADMAP-PROGRESS:START -->' in s and '<!-- ROADMAP-PROGRESS:END -->' in s
          assert '## 📊 Overall progress' in s
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(343,8,351),(done,open_,total)
          assert 'ROADMAP-97.7%25-7c3aed' in s
          assert 'DONE-343%2F351' in s
          assert 'STATUS-V12.5%20IN%20DEVELOPMENT-7c3aed' in s
          assert '███████████████████░ 97.7%' in s
          assert '| **343** | **8** | **351** | **97.7%** |' in s
          start=s.index('## v12.5 — Signals Intelligence Fire Support & Deception Raids — IN DEVELOPMENT')
          section=s[start:]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0

  build-candidate:
    name: Build exact v12.5 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V125SIGINT-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V125SIGINT-Library-${{ runner.os }}-6000.3.17f1-
            V124MobileSignal-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v12.5-sigint-fire-support-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v12.5-sigint-fire-support-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.5-sigint-fire-support-Windows-x64
          path: TankRevivalOverdrive-v12.5-sigint-fire-support-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v12.5 SIGINT fire support
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.5-sigint-fire-support-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v12.5-sigint-fire-support-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v12.5 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V12_5_SIGINT_FIRE_SUPPORT_SMOKE_OK.txt, V12_5_SIGINT_FIRE_SUPPORT_SMOKE_FAIL.txt, V125SIGINTPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-tr-v125-smoke','-logFile','V125SIGINTPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v12.5 SIGINT smoke timed out after 70 seconds'
          }
          if (Test-Path 'V12_5_SIGINT_FIRE_SUPPORT_SMOKE_FAIL.txt') {
            Get-Content V12_5_SIGINT_FIRE_SUPPORT_SMOKE_FAIL.txt
            if (Test-Path V125SIGINTPlayer.log) { Get-Content V125SIGINTPlayer.log -Tail 360 }
            throw 'v12.5 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V12_5_SIGINT_FIRE_SUPPORT_SMOKE_OK.txt')) {
            if (Test-Path V125SIGINTPlayer.log) { Get-Content V125SIGINTPlayer.log -Tail 360 }
            throw "Runtime exited without v12.5 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V12_5_SIGINT_FIRE_SUPPORT_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V125SIGINTPlayer.log) {
            if (Select-String -Path V125SIGINTPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V125SIGINTPlayer.log -Tail 380
              throw 'Blocking exception signature found during v12.5 runtime smoke'
            }
          }
          Write-Host 'v12.5 SIGINT fire-support runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.5-sigint-fire-support-diagnostics
          path: |
            candidate/runtime/V12_5_SIGINT_FIRE_SUPPORT_SMOKE_OK.txt
            candidate/runtime/V12_5_SIGINT_FIRE_SUPPORT_SMOKE_FAIL.txt
            candidate/runtime/V125SIGINTPlayer.log
          if-no-files-found: ignore
          retention-days: 14
