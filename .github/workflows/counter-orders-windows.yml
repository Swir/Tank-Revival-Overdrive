name: Player Counter-Orders v10.5 Windows Gate

on:
  push:
    branches:
      - 'dev-v10-5'
    paths:
      - '.counter-orders-v105-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v10.5 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v10.5 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v10.5.0-dev"
          test -f Assets/Scripts/PlayerCounterOrderDirector.cs
          test -f Assets/Scripts/PlayerCounterOrderCISmokeProbe.cs
          grep -q 'PlayerCounterOrderDirector_v10_5' Assets/Scripts/PlayerCounterOrderDirector.cs
          grep -q 'HighCommandDeceptionWarDirector.Instance' Assets/Scripts/PlayerCounterOrderDirector.cs
          grep -q 'CommandNetworkHuntDirector' Assets/Scripts/PlayerCounterOrderCISmokeProbe.cs
          grep -q 'DynamicFrontlineTerritoryDirector.LanePosition' Assets/Scripts/PlayerCounterOrderDirector.cs
          grep -q 'SpawnProjectile' Assets/Scripts/PlayerCounterOrderDirector.cs
          grep -q 'WarEconomyDirector.AwardMissionBonds' Assets/Scripts/PlayerCounterOrderDirector.cs
          grep -q 'MaxResponseBeats = 2' Assets/Scripts/PlayerCounterOrderDirector.cs
          grep -q 'MaxSupportShellsPerBeat = 2' Assets/Scripts/PlayerCounterOrderDirector.cs
          grep -q '## v10.5 — Player Counter-Orders, Reserve Traps & Operational Intelligence — IN PROGRESS' ROADMAP.md
          grep -q 'DONE-226%2F230' ROADMAP.md
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v105-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v105-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v10.5-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v10.5-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.5-candidate-Windows-x64
          path: TankRevivalOverdrive-v10.5-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v10.5 candidate and validate player counter-orders
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.5-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v10.5-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v10.5 player counter-orders packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item COUNTER_ORDERS_PASS.txt, COUNTER_ORDERS_FAIL.txt, CounterOrdersPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-counter-orders-smoke','-logFile','CounterOrdersPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v10.5 counter-orders smoke timed out after 60 seconds'
          }
          if (Test-Path 'COUNTER_ORDERS_FAIL.txt') {
            Get-Content COUNTER_ORDERS_FAIL.txt
            if (Test-Path CounterOrdersPlayer.log) { Get-Content CounterOrdersPlayer.log -Tail 240 }
            throw 'v10.5 counter-orders runtime probe reported FAIL'
          }
          if (!(Test-Path 'COUNTER_ORDERS_PASS.txt')) {
            if (Test-Path CounterOrdersPlayer.log) { Get-Content CounterOrdersPlayer.log -Tail 240 }
            throw "Runtime exited without v10.5 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content COUNTER_ORDERS_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path CounterOrdersPlayer.log) {
            if (Select-String -Path CounterOrdersPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content CounterOrdersPlayer.log -Tail 260
              throw 'Blocking exception signature found during v10.5 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v10.5-counter-orders-diagnostics
          path: |
            candidate/runtime/COUNTER_ORDERS_PASS.txt
            candidate/runtime/COUNTER_ORDERS_FAIL.txt
            candidate/runtime/CounterOrdersPlayer.log
          if-no-files-found: ignore
          retention-days: 14
