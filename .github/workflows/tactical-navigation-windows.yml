name: Tactical Navigation Windows Gate

on:
  push:
    branches:
      - 'dev-v7-3'
    paths:
      - '.tactical-navigation-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-navigation:
    name: Build v7.3 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate v7.3 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v7.3.0-dev"
          test -f Assets/Scripts/TacticalNavigationDirector.cs
          test -f Assets/Scripts/TacticalNavigationCISmokeProbe.cs
          grep -q "DecisionCadence = 0.30f" Assets/Scripts/TacticalNavigationDirector.cs
          grep -q "MaxManagedEnemies = 40" Assets/Scripts/TacticalNavigationDirector.cs
          grep -q "SquadTacticalRole.Flanker" Assets/Scripts/TacticalNavigationDirector.cs
          grep -q "AntiStallSeconds" Assets/Scripts/TacticalNavigationDirector.cs
          grep -q -- "-tactical-navigation-smoke" Assets/Scripts/TacticalNavigationCISmokeProbe.cs
          echo "v7.3 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: TacticalNavigation-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            TacticalNavigation-Library-${{ runner.os }}-6000.3.17f1-
            SquadAI-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v7.3-tactical-navigation-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v7.3-tactical-navigation-Windows-x64.zip

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.3-tactical-navigation-Windows-x64
          path: TankRevival-v7.3-tactical-navigation-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v7.3 EXE on Windows
    needs: build-navigation
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v7.3-tactical-navigation-Windows-x64
          path: candidate

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v7.3-tactical-navigation-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }

      - name: Run tactical navigation smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item TACTICAL_NAV_PASS.txt, TACTICAL_NAV_FAIL.txt, TacticalNavigationPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-tactical-navigation-smoke','-logFile','TacticalNavigationPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Tactical navigation smoke timed out after 60 seconds'
          }
          if (Test-Path 'TACTICAL_NAV_FAIL.txt') {
            Get-Content TACTICAL_NAV_FAIL.txt
            if (Test-Path TacticalNavigationPlayer.log) { Get-Content TacticalNavigationPlayer.log -Tail 220 }
            throw 'Tactical navigation runtime probe reported FAIL'
          }
          if (!(Test-Path 'TACTICAL_NAV_PASS.txt')) {
            if (Test-Path TacticalNavigationPlayer.log) { Get-Content TacticalNavigationPlayer.log -Tail 220 }
            throw "Runtime exited without tactical navigation PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content TACTICAL_NAV_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Select-String -Path TacticalNavigationPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
            Get-Content TacticalNavigationPlayer.log -Tail 260
            throw 'Blocking exception signature found during tactical navigation smoke'
          }
          Write-Host 'v7.3 tactical navigation runtime smoke passed.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.3-tactical-navigation-diagnostics
          path: |
            candidate/runtime/TACTICAL_NAV_PASS.txt
            candidate/runtime/TACTICAL_NAV_FAIL.txt
            candidate/runtime/TacticalNavigationPlayer.log
          if-no-files-found: ignore
          retention-days: 14
