name: Forward Recovery Windows Gate

on:
  push:
    branches:
      - 'dev-v8-9'
    paths:
      - '.forward-recovery-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovery:
    name: Build v8.9 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Validate v8.9 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v8.9.0-dev"
          test -f Assets/Scripts/ForwardRecoveryFrontlineDirector.cs
          test -f Assets/Scripts/ForwardRecoveryFrontlineCISmokeProbe.cs
          grep -q "ForwardRecoveryPhase" Assets/Scripts/ForwardRecoveryFrontlineDirector.cs
          grep -q "BattlefieldSalvageDirector" Assets/Scripts/ForwardRecoveryFrontlineDirector.cs
          grep -q "TacticalNavigationAgent" Assets/Scripts/ForwardRecoveryFrontlineDirector.cs
          grep -q "SpawnProjectile" Assets/Scripts/ForwardRecoveryFrontlineDirector.cs
          grep -q "KeyCode.B" Assets/Scripts/ForwardRecoveryFrontlineDirector.cs
          grep -q "SupportPulseCadence" Assets/Scripts/ForwardRecoveryFrontlineDirector.cs
          grep -q -- "-forward-recovery-smoke" Assets/Scripts/ForwardRecoveryFrontlineCISmokeProbe.cs
          echo "v8.9 source gate passed."
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: ForwardRecovery-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ForwardRecovery-Library-${{ runner.os }}-6000.3.17f1-
            BattlefieldSalvage-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v8.9-forward-recovery-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v8.9-forward-recovery-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v8.9-forward-recovery-Windows-x64
          path: TankRevival-v8.9-forward-recovery-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v8.9 EXE on Windows
    needs: build-recovery
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v8.9-forward-recovery-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v8.9-forward-recovery-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }
      - name: Run forward-recovery smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item FORWARD_RECOVERY_PASS.txt, FORWARD_RECOVERY_FAIL.txt, ForwardRecoveryPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-forward-recovery-smoke','-logFile','ForwardRecoveryPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Forward-recovery smoke timed out after 60 seconds'
          }
          if (Test-Path 'FORWARD_RECOVERY_FAIL.txt') {
            Get-Content FORWARD_RECOVERY_FAIL.txt
            if (Test-Path ForwardRecoveryPlayer.log) { Get-Content ForwardRecoveryPlayer.log -Tail 320 }
            throw 'Forward-recovery runtime probe reported FAIL'
          }
          if (!(Test-Path 'FORWARD_RECOVERY_PASS.txt')) {
            if (Test-Path ForwardRecoveryPlayer.log) { Get-Content ForwardRecoveryPlayer.log -Tail 320 }
            throw 'Forward-recovery PASS marker missing'
          }
          Get-Content FORWARD_RECOVERY_PASS.txt
