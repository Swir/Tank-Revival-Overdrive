name: Combat Readability Windows Gate

on:
  push:
    branches:
      - 'dev-v6-4'
    paths:
      - '.dev-build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-combat-readability-candidate:
    name: Compile v6.4 Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: CombatReadability-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            CombatReadability-Library-${{ runner.os }}-6000.3.17f1-
            CombinedArms-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable
        shell: bash
        run: |
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
      - name: Pack exact candidate
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v6.4-combat-readability-Windows-x64.zip .
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v6.4-combat-readability-Windows-x64
          path: TankRevivalOverdrive-v6.4-combat-readability-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  combat-readability-runtime-smoke:
    name: Boot packaged EXE and verify v6.4 combat readability
    needs: build-combat-readability-candidate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v6.4-combat-readability-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v6.4-combat-readability-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
      - name: Run v6.4 combat readability smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item COMBAT_READABILITY_PASS.txt, COMBAT_READABILITY_FAIL.txt, CombatReadabilityPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-combat-readability-smoke','-logFile','CombatReadabilityPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Combat readability smoke timed out after 60 seconds' }
          if (Test-Path 'COMBAT_READABILITY_FAIL.txt') { Get-Content COMBAT_READABILITY_FAIL.txt; if (Test-Path CombatReadabilityPlayer.log) { Get-Content CombatReadabilityPlayer.log -Tail 180 }; throw 'Combat readability runtime probe reported FAIL' }
          if (!(Test-Path 'COMBAT_READABILITY_PASS.txt')) { if (Test-Path CombatReadabilityPlayer.log) { Get-Content CombatReadabilityPlayer.log -Tail 180 }; throw "Runtime exited without combat-readability PASS marker (exit=$($p.ExitCode))" }
          Get-Content COMBAT_READABILITY_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path CombatReadabilityPlayer.log) {
            if (Select-String -Path CombatReadabilityPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) { Get-Content CombatReadabilityPlayer.log -Tail 220; throw 'Blocking exception signature found during v6.4 runtime smoke' }
          }
          Write-Host 'v6.4 combat readability runtime smoke passed.'
      - name: Upload combat-readability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v6.4-combat-readability-diagnostics
          path: |
            candidate/runtime/COMBAT_READABILITY_PASS.txt
            candidate/runtime/COMBAT_READABILITY_FAIL.txt
            candidate/runtime/CombatReadabilityPlayer.log
          if-no-files-found: ignore
          retention-days: 14
