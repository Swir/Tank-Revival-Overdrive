name: v14.2 Full-Play Windows Release Candidate

on:
  push:
    branches: ['release/v14.2-full-play']
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.17f1
  CANDIDATE_ZIP: TankRevivalOverdrive-v14.2.0-Windows-x64.zip
  PACKAGE_DIR: tro-v142-full-play-package

jobs:
  source-contracts:
    name: Verify final v14.2 full-play source and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'release/v14.2-full-play'
          test "$(cat VERSION)" = 'v14.2.0'
          python -m py_compile Tools/verify_v142_full_play_release.py .github/scripts/package_v142_full_play.py Tools/verify_v142_deception.py Tools/verify_v142_presentation.py Tools/verify_v142_runtime_gate.py Tools/verify_csharp_type_uniqueness.py Tools/verify_production_audio_assets.py
          python Tools/verify_v142_full_play_release.py
          python Tools/verify_v142_deception.py
          python Tools/verify_v142_presentation.py
          python Tools/verify_v142_runtime_gate.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/verify_production_audio_assets.py
          git diff --check
      - name: Verify frozen v14.2 roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('ROADMAP.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ',text,re.M)); open_=len(re.findall(r'^- \[ \] ',text,re.M))
          if (done,open_) != (487,0): raise SystemExit(f'expected frozen 487/487, got {done}/{done+open_}')
          if '## v14.2 — Deception, Emission Discipline & Shoot-and-Scoot Warfare — QUALIFIED' not in text:
              raise SystemExit('v14.2 qualified milestone heading missing')
          print('frozen v14.2 roadmap PASS: 487/487')
          PY

  build-candidate:
    name: Build and package exact v14.2 full-play Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"; test -n "$UNITY_EMAIL"; test -n "$UNITY_PASSWORD"
      - name: Enforce clean Unity qualification state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          rm -rf Library Temp obj
      - name: Build non-development full-play candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildDemoCandidate
          allowDirtyBuild: true
      - name: Stage deterministic self-contained package
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/package_v142_full_play.py --build-root build --output-dir "${RUNNER_TEMP}/${PACKAGE_DIR}" --candidate-sha "${GITHUB_SHA}" --commit-sha "${GITHUB_SHA}" --unity-version "${UNITY_VERSION}" --version-file VERSION --zip-name "${CANDIDATE_ZIP}" --diagnostics-path "${GITHUB_WORKSPACE}/V142_FULL_PLAY_BUILD_TREE.txt"
      - name: Upload exact full-play candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v14.2.0-full-play-Windows-x64
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/${{ env.CANDIDATE_ZIP }}
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V142_FULL_PLAY_SHA256.txt
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V142_FULL_PLAY_PROVENANCE.json
            V142_FULL_PLAY_BUILD_TREE.txt
          if-no-files-found: error
          retention-days: 14

  packaged-runtime:
    name: Full-play flow, regressions and rounds 80/90/100 on the same EXE
    needs: [source-contracts, build-candidate]
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v14.2.0-full-play-Windows-x64
          path: candidate
      - name: Verify package provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate
          $zip='${{ env.CANDIDATE_ZIP }}'
          $expected=((Get-Content V142_FULL_PLAY_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw 'candidate ZIP digest mismatch'}
          $p=Get-Content V142_FULL_PLAY_PROVENANCE.json -Raw|ConvertFrom-Json
          if($p.candidate_sha -ne '${{ github.sha }}' -or $p.commit_sha -ne '${{ github.sha }}' -or $p.sha256 -ne $actual -or $p.version -ne 'v14.2.0'){throw 'candidate provenance mismatch'}
          Expand-Archive $zip -DestinationPath runtime -Force
          foreach($required in @('TankRevivalOverdrive.exe','TankRevivalOverdrive_Data','BUILD_INFO.txt','DEMO_MANIFEST.txt','README_DEMO.txt','RELEASE_NOTES.txt','KNOWN_ISSUES.txt','V142_FULL_PLAY_BUILD.txt')){if(!(Test-Path "runtime/$required")){throw "missing $required"}}
          Write-Host "Verified exact full-play candidate SHA256: $actual"
      - name: Run exact single-binary qualification matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate/runtime
          $blocking='Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException'
          function Invoke-Smoke([string]$Name,[string]$Flag,[string]$Pass,[string]$Fail,[string]$Log,[int]$TimeoutMs){
            Remove-Item $Pass,$Fail,$Log -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics',$Flag,'-logFile',$Log -PassThru
            if(!$p.WaitForExit($TimeoutMs)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "$Name timed out"}
            if(Test-Path $Fail){if(Test-Path $Log){Get-Content $Log -Tail 300}; throw "$Name emitted FAIL"}
            if(!(Test-Path $Pass)){if(Test-Path $Log){Get-Content $Log -Tail 300}; throw "$Name exited without PASS"}
            if($p.ExitCode -ne 0){throw "$Name non-zero exit $($p.ExitCode)"}
            if(Test-Path $Log){if(Select-String -Path $Log -Pattern $blocking -Quiet){Get-Content $Log -Tail 350; throw "$Name blocking exception signature"}}
            Write-Host "$Name PASS"
          }
          Invoke-Smoke 'packaged bootstrap' '-demo-ci-smoke' 'DEMO_SMOKE_PASS.txt' 'DEMO_SMOKE_FAIL.txt' 'Bootstrap.log' 80000
          Invoke-Smoke 'full-play menu/play/pause/resume flow' '-v142-full-play-smoke' 'V14_2_FULL_PLAY_OK.txt' 'V14_2_FULL_PLAY_FAIL.txt' 'FullPlay.log' 90000
          Invoke-Smoke 'production authored audio' '-production-presentation-smoke' 'PRODUCTION_PRESENTATION_PASS.txt' 'PRODUCTION_PRESENTATION_FAIL.txt' 'Audio.log' 80000
          Invoke-Smoke 'v14.2 deception' '-tr-v142-smoke' 'V14_2_DECEPTION_OK.txt' 'V14_2_DECEPTION_FAIL.txt' 'V142.log' 90000
          Invoke-Smoke 'v14.1 regression' '-tr-v141-smoke' 'V14_1_COUNTER_OBSERVATION_OK.txt' 'V14_1_COUNTER_OBSERVATION_FAIL.txt' 'V141.log' 90000
          Invoke-Smoke 'v14.0 regression' '-tr-v140-smoke' 'V14_0_COUNTER_BATTERY_OK.txt' 'V14_0_COUNTER_BATTERY_FAIL.txt' 'V140.log' 90000
          Invoke-Smoke 'v13.9 regression' '-tr-v139-smoke' 'V13_9_FIRE_SUPPORT_OK.txt' 'V13_9_FIRE_SUPPORT_FAIL.txt' 'V139.log' 90000
          Invoke-Smoke 'v13.8 regression' '-tr-v138-smoke' 'V13_8_SUPPRESSION_MORALE_OK.txt' 'V13_8_SUPPRESSION_MORALE_FAIL.txt' 'V138.log' 90000
          Invoke-Smoke 'round 80/90/100 soak' '-demo-ci-soak' 'DEMO_SOAK_PASS.txt' 'DEMO_SOAK_FAIL.txt' 'Soak.log' 120000
          'v14.2 full-play runtime matrix PASS' | Set-Content V14_2_FULL_PLAY_WINDOWS_MATRIX_OK.txt
      - name: Capture fullscreen clean-HUD gameplay evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate/runtime
          Remove-Item V14_2_FULL_PLAY_VISUAL_OK.txt,V14_2_FULL_PLAY_VISUAL_FAIL.txt,V14_2_FULL_PLAY_SCREENSHOT.png,Visual.log -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-v142-full-play-visual-smoke','-screen-fullscreen','1','-logFile','Visual.log' -PassThru
          if(!$p.WaitForExit(90000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'visual smoke timed out'}
          if(Test-Path V14_2_FULL_PLAY_VISUAL_FAIL.txt){Get-Content V14_2_FULL_PLAY_VISUAL_FAIL.txt; throw 'visual smoke failed'}
          if(!(Test-Path V14_2_FULL_PLAY_VISUAL_OK.txt) -or !(Test-Path V14_2_FULL_PLAY_SCREENSHOT.png)){if(Test-Path Visual.log){Get-Content Visual.log -Tail 350}; throw 'visual evidence missing'}
      - name: Upload runtime and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v14.2.0-full-play-evidence
          path: |
            candidate/runtime/*_PASS.txt
            candidate/runtime/V14_2_*_OK.txt
            candidate/runtime/V14_2_FULL_PLAY_SCREENSHOT.png
            candidate/runtime/*.log
          if-no-files-found: ignore
          retention-days: 14
