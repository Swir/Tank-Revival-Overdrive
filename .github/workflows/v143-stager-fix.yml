name: v14.3 Stager Fix
on:
  push:
    branches: [dev-v14-3]
    paths: ['.github/workflows/v143-stager-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix verifier false positive and retrigger stager
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v143-feature-stager.yml')
          s=p.read_text(encoding='utf-8')
          old="              'Rigidbody2D', 'Instantiate(', 'Destroy(enemy',"
          new="              'Instantiate(', 'Destroy(enemy',"
          if old not in s:
              raise SystemExit('expected verifier token not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/v143-stager-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v143-feature-stager.yml .github/workflows/v143-stager-fix.yml
          git commit -m 'ci(v14.3): ignore authority names in source comments [skip ci]'
          git push origin HEAD:dev-v14-3
