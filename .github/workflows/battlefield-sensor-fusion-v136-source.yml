name: Battlefield Sensor Fusion v13.6 Source Qualification

on:
  push:
    branches: ['dev-v13-6']
    paths:
      - 'Assets/Scripts/BattlefieldSensorFusionV136.cs'
      - 'Assets/Scripts/BattlefieldSensorFusionCISmokeProbe.cs'
      - 'Assets/Scripts/BattlefieldWeatherV135.cs'
      - 'Assets/Scripts/ReconElectronicWarfareDirector.cs'
      - 'Assets/Scripts/TacticalTerrainDirector.cs'
      - 'Assets/Scripts/RuntimeBattleRegistry.cs'
      - 'Tools/verify_v136_sensor_fusion.py'
      - 'Tools/verify_csharp_type_uniqueness.py'
      - 'Tools/generate_progress_svgs.py'
      - 'Tools/swir_visual_report_guard.py'
      - '.github/scripts/package_v136_sensor_fusion.py'
      - '.github/scripts/test_package_v136_sensor_fusion.py'
      - '.github/workflows/battlefield-sensor-fusion-v136-source.yml'
      - 'ROADMAP.md'
      - 'README.md'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v13.6 sensor fusion, authority and progress contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v13-6'
          test "$(cat VERSION)" = 'v13.6.0-dev'
      - name: Compile and run deterministic source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            Tools/verify_v136_sensor_fusion.py \
            Tools/verify_csharp_type_uniqueness.py \
            Tools/verify_production_audio_assets.py \
            Tools/verify_unity_ci_bootstrap.py \
            Tools/generate_progress_svgs.py \
            Tools/swir_visual_report_guard.py \
            .github/scripts/package_v136_sensor_fusion.py \
            .github/scripts/test_package_v136_sensor_fusion.py
          python .github/scripts/test_package_v136_sensor_fusion.py
          python Tools/verify_v136_sensor_fusion.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/verify_production_audio_assets.py
          python Tools/verify_unity_ci_bootstrap.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          git diff --check
      - name: Verify sensor layer cannot become a parallel gameplay authority
        shell: python
        run: |
          from pathlib import Path
          s=Path('Assets/Scripts/BattlefieldSensorFusionV136.cs').read_text(encoding='utf-8')
          forbidden={
            '.Damage(':'direct damage',
            'SpawnProjectile(':'projectile spawn',
            'MovePosition(':'movement authority',
            'WarEconomyDirector.':'economy mutation',
            'FindObjectsByType<EnemyTank>':'enemy scene scan',
            'new List<':'unbounded list',
            'new Dictionary<':'unbounded dictionary',
          }
          for token,label in forbidden.items():
            if token in s:
              raise SystemExit(f'forbidden sensor authority: {label} ({token})')
          assert 'RuntimeBattleRegistry.EnemySnapshot' in s
          assert 'BattlefieldWeatherDirector.Instance.CurrentPlan' in s
          assert 'TacticalTerrainMap.TerrainAt' in s
          assert 'ReconElectronicWarfareDirector.Instance' in s
          assert 'MaxTrackedContacts = 24' in s
          assert 'MaxWorldMarkers = 8' in s
          print('v13.6 bounded sensor authority audit: PASS')
