name: Advanced Gunnery v11.3 Windows Gate

on:
  push:
    branches: ['dev-v11-3']
    paths: ['.advanced-gunnery-v113-trigger']
  workflow_dispatch:

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v11.3 source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/AdvancedGunneryDoctrineDirector.cs
          test -f Assets/Scripts/CounterFireThreatMemory.cs
          test -f Assets/Scripts/AdvancedGunneryCISmokeProbe.cs
          grep -q 'Health.Damaged+=OnDamaged' Assets/Scripts/EnemyTank.cs
          grep -q 'CounterFireThreatMemory.ShouldRetaliate' Assets/Scripts/EnemyTank.cs
          grep -q 'CounterFireThreatMemory.AccuracyMultiplier' Assets/Scripts/EnemyTank.cs
          grep -q 'MaxTrackedThreats = 12' Assets/Scripts/CounterFireThreatMemory.cs
          grep -q 'MemorySeconds = 5.5f' Assets/Scripts/CounterFireThreatMemory.cs
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
          grep -q 'DONE-259%2F264' ROADMAP.md
          git diff --check
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"; test -n "$UNITY_EMAIL"; test -n "$UNITY_PASSWORD"
      - uses: actions/cache@v4
        with:
          path: Library
          key: v113-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v113-Library-${{ runner.os }}-6000.3.17f1-
            v112-Library-${{ runner.os }}-6000.3.17f1-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v11.3-candidate-Windows-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.3-candidate-Windows-x64
          path: TankRevivalOverdrive-v11.3-candidate-Windows-x64.zip

  packaged-exe-smoke:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v11.3-candidate-Windows-x64
          path: candidate
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v11.3-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          Set-Location runtime
          $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-advanced-gunnery-v113-smoke','-logFile','AdvancedGunneryPlayer.log' -PassThru
          if(!$p.WaitForExit(60000)){Stop-Process -Id $p.Id -Force; throw 'smoke timeout'}
          if(Test-Path 'ADVANCED_GUNNERY_V113_FAIL.txt'){Get-Content ADVANCED_GUNNERY_V113_FAIL.txt; throw 'runtime probe failed'}
          if(!(Test-Path 'ADVANCED_GUNNERY_V113_PASS.txt')){throw 'PASS marker missing'}
          if($p.ExitCode -ne 0){throw "runtime exit $($p.ExitCode)"}
          if(Select-String -Path AdvancedGunneryPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet){throw 'blocking exception signature'}
