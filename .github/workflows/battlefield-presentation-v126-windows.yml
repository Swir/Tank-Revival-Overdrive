name: Battlefield Presentation Overdrive v12.6 Windows Gate

on:
  push:
    branches: ['dev-v12-6']
    paths:
      - 'Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs'
      - 'Assets/Scripts/BattlefieldPresentationOverdriveCISmokeProbe.cs'
      - 'Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs.meta'
      - 'Assets/Scripts/BattlefieldPresentationOverdriveCISmokeProbe.cs.meta'
      - 'CHANGELOG_v12.6.md'
      - 'VERSION'
      - '.github/workflows/battlefield-presentation-v126-windows.yml'
      - '.v126-qualification-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Verify v12.6 presentation and authority contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          test -f Assets/Scripts/BattlefieldPresentationOverdriveCISmokeProbe.cs
          test -f Assets/Scripts/CombinedArmsMobileFrontDirector.cs
          test -f Assets/Scripts/OperationalSustainmentDirector.cs
          test -f Assets/Scripts/LogisticsRouteIntelligenceDirector.cs
          test -f Assets/Scripts/ReconElectronicWarfareDirector.cs
          test -f Assets/Scripts/MobileSignalWarfareDirector.cs
          test -f Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs
          test -f CHANGELOG_v12.6.md
          test "$(cat VERSION)" = 'v12.6.0-dev'
          grep -q 'MaxTelegraphs = 12' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'MaxAlerts = 4' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'ComputeBudget' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'PriorityScore' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'TacticalPresentationSnapshot' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'TryGetRelayPosition' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'EmitterAnchor' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'MobileJammerAnchor' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'LineRenderer' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'V12_6_BATTLEFIELD_PRESENTATION_SMOKE_OK.txt' Assets/Scripts/BattlefieldPresentationOverdriveCISmokeProbe.cs
          grep -q 'ringCases=' Assets/Scripts/BattlefieldPresentationOverdriveCISmokeProbe.cs
          if grep -Eq 'SpawnProjectile|\.Damage\(|AddComponent<Health>|AddComponent<Projectile>|GetComponent<Projectile>|\.MovePosition\(|TacticalNavigationAgent|System\.Reflection|BindingFlags|GetField\(' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs; then
            echo 'Presentation director contains forbidden gameplay/damage/movement/reflection authority.' >&2
            exit 1
          fi
          if grep -Eq 'FindObjectsByType|FindObjectsOfType|Physics2D\.' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs; then
            echo 'Presentation director contains an unbounded scene/physics scan.' >&2
            exit 1
          fi
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          assert '<!-- ROADMAP-PROGRESS:START -->' in s and '<!-- ROADMAP-PROGRESS:END -->' in s
          assert '## 📊 Overall progress' in s
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(351,8,359),(done,open_,total)
          assert 'ROADMAP-97.8%25-yellow' in s
          assert 'DONE-351%2F359' in s
          assert 'STATUS-V12.6%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.8%' in s
          assert '| **351** | **8** | **359** | **97.8%** |' in s
          start=s.index('## v12.6 — Battlefield Presentation Overdrive & Unified Tactical HUD — IN DEVELOPMENT')
          section=s[start:]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0

  build-candidate:
    name: Build exact v12.6 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V126Presentation-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V126Presentation-Library-${{ runner.os }}-6000.3.17f1-
            V125SIGINT-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v12.6-battlefield-presentation-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v12.6-battlefield-presentation-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.6-battlefield-presentation-Windows-x64
          path: TankRevivalOverdrive-v12.6-battlefield-presentation-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact EXE and verify v12.6 battlefield presentation
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v12.6-battlefield-presentation-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v12.6-battlefield-presentation-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v12.6 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item V12_6_BATTLEFIELD_PRESENTATION_SMOKE_OK.txt, V12_6_BATTLEFIELD_PRESENTATION_SMOKE_FAIL.txt, V126PresentationPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-tr-v126-smoke','-logFile','V126PresentationPlayer.log' -PassThru
          if (!$p.WaitForExit(70000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v12.6 presentation smoke timed out after 70 seconds'
          }
          if (Test-Path 'V12_6_BATTLEFIELD_PRESENTATION_SMOKE_FAIL.txt') {
            Get-Content V12_6_BATTLEFIELD_PRESENTATION_SMOKE_FAIL.txt
            if (Test-Path V126PresentationPlayer.log) { Get-Content V126PresentationPlayer.log -Tail 360 }
            throw 'v12.6 runtime probe reported FAIL'
          }
          if (!(Test-Path 'V12_6_BATTLEFIELD_PRESENTATION_SMOKE_OK.txt')) {
            if (Test-Path V126PresentationPlayer.log) { Get-Content V126PresentationPlayer.log -Tail 360 }
            throw "Runtime exited without v12.6 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content V12_6_BATTLEFIELD_PRESENTATION_SMOKE_OK.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path V126PresentationPlayer.log) {
            if (Select-String -Path V126PresentationPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException' -Quiet) {
              Get-Content V126PresentationPlayer.log -Tail 380
              throw 'Blocking exception signature found during v12.6 runtime smoke'
            }
          }
          Write-Host 'v12.6 battlefield presentation runtime smoke passed.'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v12.6-battlefield-presentation-diagnostics
          path: |
            candidate/runtime/V12_6_BATTLEFIELD_PRESENTATION_SMOKE_OK.txt
            candidate/runtime/V12_6_BATTLEFIELD_PRESENTATION_SMOKE_FAIL.txt
            candidate/runtime/V126PresentationPlayer.log
          if-no-files-found: ignore
          retention-days: 14
