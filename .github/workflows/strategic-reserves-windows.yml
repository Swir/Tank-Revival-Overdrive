name: Strategic Reserves Windows Gate

on:
  push:
    branches:
      - 'dev-v8-5'
    paths:
      - '.strategic-reserves-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-strategic-reserves:
    name: Build v8.5 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Validate v8.5 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v8.5.0-dev"
          test -f Assets/Scripts/StrategicReserveAttritionDirector.cs
          test -f Assets/Scripts/StrategicReserveAttritionCISmokeProbe.cs
          grep -q "SectorCount = 10" Assets/Scripts/StrategicReserveAttritionDirector.cs
          grep -q "ResolveSectorEntry" Assets/Scripts/StrategicReserveAttritionDirector.cs
          grep -q "TryReserveKind" Assets/Scripts/StrategicReserveAttritionDirector.cs
          grep -q "RefineEncounter" Assets/Scripts/StrategicReserveAttritionDirector.cs
          grep -q -- "-strategic-reserves-smoke" Assets/Scripts/StrategicReserveAttritionCISmokeProbe.cs
          echo "v8.5 source gate passed."
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: StrategicReserves-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StrategicReserves-Library-${{ runner.os }}-6000.3.17f1-
            WarState-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v8.5-strategic-reserves-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v8.5-strategic-reserves-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v8.5-strategic-reserves-Windows-x64
          path: TankRevival-v8.5-strategic-reserves-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v8.5 EXE on Windows
    needs: build-strategic-reserves
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v8.5-strategic-reserves-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v8.5-strategic-reserves-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }
      - name: Run strategic-reserves smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item STRATEGIC_RESERVES_PASS.txt, STRATEGIC_RESERVES_FAIL.txt, StrategicReservesPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-strategic-reserves-smoke','-logFile','StrategicReservesPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Strategic-reserves smoke timed out after 60 seconds'
          }
          if (Test-Path 'STRATEGIC_RESERVES_FAIL.txt') {
            Get-Content STRATEGIC_RESERVES_FAIL.txt
            if (Test-Path StrategicReservesPlayer.log) { Get-Content StrategicReservesPlayer.log -Tail 260 }
            throw 'Strategic-reserves runtime probe reported FAIL'
          }
          if (!(Test-Path 'STRATEGIC_RESERVES_PASS.txt')) {
            if (Test-Path StrategicReservesPlayer.log) { Get-Content StrategicReservesPlayer.log -Tail 260 }
            throw 'Strategic-reserves PASS marker missing'
          }
          Get-Content STRATEGIC_RESERVES_PASS.txt
