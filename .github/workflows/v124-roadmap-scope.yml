name: ROADMAP v12.4 Scope Registrar

on:
  push:
    branches: ['dev-v12-4']
    paths:
      - '.github/workflows/v124-roadmap-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v12-4
      - name: Register v12.4 roadmap scope
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$', s, re.M)) == 1
          done = len(re.findall(r'^- \[x\] ', s, re.M))
          open_ = len(re.findall(r'^- \[ \] ', s, re.M))
          assert (done, open_) == (335, 0), (done, open_)
          assert '## v12.4 — Mobile Signal Warfare & Counter-Recon Raids' not in s
          section = '''\n## v12.4 — Mobile Signal Warfare & Counter-Recon Raids — IN DEVELOPMENT\n- [ ] A bounded physical mobile-jammer asset follows enemy logistics operations using canonical Health/collision authority without taking OperationalSustainmentDirector or real-column movement authority.\n- [ ] The v12.3 recon network exposes bounded relay telemetry, temporary relay suppression and counter-jamming recovery bridges so later systems can interact without reaching into private state.\n- [ ] Existing Fast/Elite/Sniper combatants can form a bounded counter-recon hunter raid through TacticalNavigationAgent and attack relay sectors without replacing EnemyTank/Rigidbody2D authority.\n- [ ] Hunter presence near a live relay can temporarily suppress its intelligence contribution through a telegraphed finite sabotage window; relay recovery and re-sync remain possible without hidden direct damage.\n- [ ] Player proximity to the mobile jammer creates a readable transmission-intercept objective; defeating or fully intercepting the asset grants a short counter-jamming window and only existing War Bond/intelligence rewards.\n- [ ] Compact mobile-signal telemetry/HUD exposes jammer state, intercept progress, counter-jam recovery, suppressed relays and raid strength while all new state is cleaned on operation/round resolution.\n- [ ] v12.4 runtime smoke verifies mobile-jammer bounds, health scaling, intercept monotonicity, hunter-role caps, relay suppression/recovery bridges, cleanup and unchanged Health/Projectile/TankGame authority.\n- [ ] Packaged Windows x64 v12.4 qualification builds and boots the exact candidate, executes mobile-signal/counter-recon smoke checks and rejects blocking exception signatures before qualification.\n'''
          marker = '\n## Development rules'
          assert marker in s
          s = s.replace(marker, section + marker, 1)
          s = s.replace('badge.svg?branch=dev-v12-3', 'badge.svg?branch=dev-v12-4', 1)
          s = s.replace('ROADMAP-100.0%25-brightgreen', 'ROADMAP-97.7%25-brightgreen', 1)
          s = s.replace('DONE-335%2F335-1f6feb', 'DONE-335%2F343-1f6feb', 1)
          s = s.replace('STATUS-V12.3%20QUALIFIED-brightgreen', 'STATUS-V12.4%20IN%20DEVELOPMENT-yellow', 1)
          s = s.replace('████████████████████ 100.0%', '███████████████████░ 97.7%', 1)
          s = s.replace('| **335** | **0** | **335** | **100.0%** |', '| **335** | **8** | **343** | **97.7%** |', 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify SWIR Roadmap v1 dashboard after registration
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(335,8,343),(done,open_,total)
          assert 'ROADMAP-97.7%25-brightgreen' in s
          assert 'DONE-335%2F343' in s
          assert 'STATUS-V12.4%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 97.7%' in s
          assert '| **335** | **8** | **343** | **97.7%** |' in s
          start=s.index('## v12.4 — Mobile Signal Warfare & Counter-Recon Raids — IN DEVELOPMENT')
          end=s.index('\n## Development rules', start)
          section=s[start:end]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
      - name: Commit registered roadmap scope
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ROADMAP.md; then
            echo 'ROADMAP already registered; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v12.4): register mobile signal warfare roadmap scope'
          git push origin HEAD:dev-v12-4
