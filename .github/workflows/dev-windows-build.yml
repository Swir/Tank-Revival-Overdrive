name: Dev Windows Build

on:
  push:
    branches:
      - 'dev-v*'
    paths:
      - '.dev-build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-dev:
    name: Compile dev Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Dev-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Dev-Library-${{ runner.os }}-6000.3.17f1-
            Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify development executable
        shell: bash
        run: |
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          echo "Development Windows player verified."

      - name: Pack development build
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-dev-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-dev-Windows-x64.zip

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-dev-Windows-x64
          path: TankRevivalOverdrive-dev-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  production-presentation-runtime-smoke:
    name: Boot dev EXE and verify v5.2 production presentation
    needs: build-windows-dev
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download exact development artifact
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-dev-Windows-x64
          path: candidate

      - name: Extract development player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-dev-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }

      - name: Run v5.2 production presentation smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item PRODUCTION_PRESENTATION_PASS.txt, PRODUCTION_PRESENTATION_FAIL.txt, ProductionPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-production-presentation-smoke','-logFile','ProductionPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Production presentation smoke probe timed out after 60 seconds'
          }
          if (Test-Path 'PRODUCTION_PRESENTATION_FAIL.txt') {
            Get-Content PRODUCTION_PRESENTATION_FAIL.txt
            if (Test-Path ProductionPlayer.log) { Get-Content ProductionPlayer.log -Tail 180 }
            throw 'Production presentation runtime probe reported FAIL'
          }
          if (!(Test-Path 'PRODUCTION_PRESENTATION_PASS.txt')) {
            if (Test-Path ProductionPlayer.log) { Get-Content ProductionPlayer.log -Tail 180 }
            throw "Runtime exited without production presentation PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content PRODUCTION_PRESENTATION_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path ProductionPlayer.log) {
            if (Select-String -Path ProductionPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
              Get-Content ProductionPlayer.log -Tail 220
              throw 'Blocking exception signature found during production presentation runtime smoke'
            }
          }
          Write-Host 'v5.2 production presentation runtime smoke passed.'

      - name: Upload production presentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v5.2-production-presentation-diagnostics
          path: |
            candidate/runtime/PRODUCTION_PRESENTATION_PASS.txt
            candidate/runtime/PRODUCTION_PRESENTATION_FAIL.txt
            candidate/runtime/ProductionPlayer.log
          if-no-files-found: ignore
          retention-days: 14

  campaign-expansion-runtime-smoke:
    name: Boot dev EXE and verify v5.3 campaign expansion
    needs: build-windows-dev
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download exact development artifact
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-dev-Windows-x64
          path: candidate

      - name: Extract development player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-dev-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }

      - name: Run v5.3 campaign expansion smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item CAMPAIGN_EXPANSION_PASS.txt, CAMPAIGN_EXPANSION_FAIL.txt, CampaignExpansionPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-campaign-expansion-smoke','-logFile','CampaignExpansionPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Campaign expansion smoke probe timed out after 60 seconds'
          }
          if (Test-Path 'CAMPAIGN_EXPANSION_FAIL.txt') {
            Get-Content CAMPAIGN_EXPANSION_FAIL.txt
            if (Test-Path CampaignExpansionPlayer.log) { Get-Content CampaignExpansionPlayer.log -Tail 180 }
            throw 'Campaign expansion runtime probe reported FAIL'
          }
          if (!(Test-Path 'CAMPAIGN_EXPANSION_PASS.txt')) {
            if (Test-Path CampaignExpansionPlayer.log) { Get-Content CampaignExpansionPlayer.log -Tail 180 }
            throw "Runtime exited without campaign expansion PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content CAMPAIGN_EXPANSION_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path CampaignExpansionPlayer.log) {
            if (Select-String -Path CampaignExpansionPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
              Get-Content CampaignExpansionPlayer.log -Tail 220
              throw 'Blocking exception signature found during v5.3 campaign expansion smoke'
            }
          }
          Write-Host 'v5.3 campaign expansion runtime smoke passed.'

      - name: Upload campaign expansion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v5.3-campaign-expansion-diagnostics
          path: |
            candidate/runtime/CAMPAIGN_EXPANSION_PASS.txt
            candidate/runtime/CAMPAIGN_EXPANSION_FAIL.txt
            candidate/runtime/CampaignExpansionPlayer.log
          if-no-files-found: ignore
          retention-days: 14
