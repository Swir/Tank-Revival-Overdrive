name: ROADMAP v13.7 Qualification Finalizer

on:
  push:
    branches: ['dev-v13-7']
    paths:
      - '.v137-finalizer-trigger'
      - 'Tools/finalize_v137_roadmap.py'
      - '.github/workflows/finalize-v137-roadmap.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-v137-roadmap-${{ github.ref }}
  cancel-in-progress: false

env:
  QUAL_RUN_ID: '35393272731'
  CANDIDATE_SHA: 'dc646fc60be572e625f5ea310058aab10d2f26da'
  CANDIDATE_ARTIFACT_ID: '10566756672'
  CANDIDATE_ARTIFACT_DIGEST: 'sha256:e4b063898c0e516fda4064d183080a4219861c593e572153b327bd857f8b05c4'
  CANDIDATE_ZIP_SHA256: '0328a6613dcc64dffb1f675282e27a798b0f3abcb561e13423b7b6de3d75c25f'
  CANDIDATE_ZIP_BYTES: '60548408'

jobs:
  finalize-qualified-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact successful Windows gate and candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/actions/runs/${QUAL_RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = "${CANDIDATE_SHA}"
          test "$(jq -r '.head_branch' <<<"$run_json")" = dev-v13-7
          test "$(jq -r '.name' <<<"$run_json")" = 'Late-Round Performance v13.7 Windows Qualification Gate'
          artifact_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$artifact_json")" = "${QUAL_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact_json")" = "${CANDIDATE_SHA}"
          test "$(jq -r '.name' <<<"$artifact_json")" = 'TankRevivalOverdrive-v13.7-late-round-performance-Windows-x64'
          test "$(jq -r '.digest' <<<"$artifact_json")" = "${CANDIDATE_ARTIFACT_DIGEST}"
          test "$(jq -r '.expired' <<<"$artifact_json")" = false

      - name: Verify candidate provenance payload and post-candidate whitelist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${CANDIDATE_SHA}" HEAD
          mapfile -t changed < <(git diff --name-only "${CANDIDATE_SHA}"..HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              Tools/finalize_v137_roadmap.py|.github/workflows/finalize-v137-roadmap.yml|.v137-finalizer-trigger) ;;
              *) echo "Non-whitelisted post-candidate change: $path" >&2; exit 1 ;;
            esac
          done
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" -o /tmp/v137-artifact.zip
          mkdir -p /tmp/v137-artifact && unzip -q /tmp/v137-artifact.zip -d /tmp/v137-artifact
          test "$(sha256sum /tmp/v137-artifact/TankRevivalOverdrive-v13.7-late-round-performance-Windows-x64.zip | awk '{print $1}')" = "${CANDIDATE_ZIP_SHA256}"
          test "$(stat -c '%s' /tmp/v137-artifact/TankRevivalOverdrive-v13.7-late-round-performance-Windows-x64.zip)" = "${CANDIDATE_ZIP_BYTES}"
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('/tmp/v137-artifact')
          p=json.loads((root/'V137_LATE_ROUND_PERFORMANCE_PROVENANCE.json').read_text(encoding='utf-8'))
          assert p['candidate_sha']==os.environ['CANDIDATE_SHA']==p['commit_sha']
          assert p['sha256']==os.environ['CANDIDATE_ZIP_SHA256']
          assert str(p['bytes'])==os.environ['CANDIDATE_ZIP_BYTES']
          assert p['version']=='v13.7.0-dev'
          assert p['unity_version']=='6000.3.17f1'
          assert p['schema']=='tank-revival-v13.7-late-round-performance/v1'
          checksum=(root/'V137_LATE_ROUND_PERFORMANCE_SHA256.txt').read_text(encoding='utf-8')
          assert os.environ['CANDIDATE_ZIP_SHA256'] in checksum
          PY

      - name: Harden presentation generator and closed-state verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          finalizer=Path('Tools/finalize_v137_roadmap.py')
          s=finalizer.read_text(encoding='utf-8')
          s=s.replace('a244565049fad753a31a67eb1b03302b53af3a64d63539d3f8ddc07093250956','0328a6613dcc64dffb1f675282e27a798b0f3abcb561e13423b7b6de3d75c25f')
          s=s.replace('INNER_ZIP_BYTES = 60586250','INNER_ZIP_BYTES = 60548408')
          finalizer.write_text(s,encoding='utf-8')

          generator=Path('Tools/generate_progress_svgs.py')
          g=generator.read_text(encoding='utf-8')
          replacements={
              'SWIR Progress SVG Pro reusable template':'SWIR Progress SVG Pro reusable TEMPLATE',
              'Template only. Progress values are N/A until generated from verified authoritative data.':'TEMPLATE only. Progress values are N/A until generated from verified authoritative data.',
              'Template — replace only from verified authoritative data':'TEMPLATE — replace only from verified authoritative data',
          }
          for old,new in replacements.items():
              if old not in g:
                  raise SystemExit(f'generator TEMPLATE hardening token missing: {old}')
              g=g.replace(old,new)
          generator.write_text(g,encoding='utf-8')

          verifier=Path('Tools/verify_v137_late_round_performance.py')
          v=verifier.read_text(encoding='utf-8')
          start=v.index("    done = len(re.findall(r'^- \\[x\\] ', roadmap, re.M)); open_ = len(re.findall(r'^- \\[ \\] ', roadmap, re.M))")
          end=v.index("    return 0", start)
          closed_aware="""    done = len(re.findall(r'^- \\[x\\] ', roadmap, re.M)); open_ = len(re.findall(r'^- \\[ \\] ', roadmap, re.M))
    state = (done, open_, done + open_)
    if state == (439, 8, 447):
        require('| **439** | **8** | **447** | **98.2%** |' in roadmap, 'open roadmap numeric dashboard mismatch')
        require('V13.7%20IN%20DEVELOPMENT' in roadmap, 'open roadmap status mismatch')
        heading = '## v13.7 — Late-Round Performance & Battle Density Reforge — IN DEVELOPMENT'
        require(heading in roadmap, 'open v13.7 heading missing')
        section = roadmap[roadmap.index(heading):]
        require(section.count('- [ ]') == 8 and section.count('- [x]') == 0, 'v13.7 items must remain unchecked before Windows qualification')
        state_label = '439/447 (98.2%) V13.7 IN DEVELOPMENT'
    elif state == (447, 0, 447):
        require('| **447** | **0** | **447** | **100.0%** |' in roadmap, 'qualified roadmap numeric dashboard mismatch')
        require('V13.7%20QUALIFIED' in roadmap, 'qualified roadmap status mismatch')
        heading = '## v13.7 — Late-Round Performance & Battle Density Reforge — QUALIFIED'
        require(heading in roadmap, 'qualified v13.7 heading missing')
        section = roadmap[roadmap.index(heading):]
        require(section.count('- [x]') == 8 and section.count('- [ ]') == 0, 'qualified v13.7 section must contain exactly eight completed items')
        state_label = '447/447 (100.0%) V13.7 QUALIFIED'
    else:
        raise SystemExit(f'v13.7 verifier FAILED: unsupported roadmap state {done}/{done + open_} with {open_} open')
    require('<!-- SWIR-README-STANDARD:v2 -->' in readme and '## 🔎 Search Keywords' in readme, 'README PRO v2/Search Keywords missing')
    require(readme.count('assets/readme/progress-card.svg') == 1 and roadmap.count('assets/readme/progress-mini.svg') == 1, 'SVG embedding contract mismatch')

    print('v13.7 late-round performance source contract: PASS')
    print('roadmap: ' + state_label)
"""
          verifier.write_text(v[:start] + closed_aware + v[end:], encoding='utf-8')
          PY
          python -m py_compile Tools/finalize_v137_roadmap.py Tools/generate_progress_svgs.py Tools/verify_v137_late_round_performance.py Tools/swir_visual_report_guard.py

      - name: Finalize roadmap, evidence and SVG presentation
        shell: bash
        run: |
          set -euo pipefail
          python Tools/finalize_v137_roadmap.py
          python Tools/generate_progress_svgs.py --write --embed
          python Tools/generate_progress_svgs.py --check
          python Tools/verify_v137_late_round_performance.py
          python Tools/swir_visual_report_guard.py --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8'); r=Path('README.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M))
          assert (done,open_,done+open_)==(447,0,447),(done,open_,done+open_)
          assert '| **447** | **0** | **447** | **100.0%** |' in s
          assert 'V13.7%20QUALIFIED' in s
          assert s.count('assets/readme/progress-mini.svg')==1
          assert r.count('assets/readme/progress-card.svg')==1
          assert '<!-- SWIR-README-STANDARD:v2 -->' in r and '## 🔎 Search Keywords' in r
          assert 'V13.7 QUALIFIED' in r and '447 / 447 completed (100.0%)' in r
          assert '0328a6613dcc64dffb1f675282e27a798b0f3abcb561e13423b7b6de3d75c25f' in r
          section=s[s.index('## v13.7 — Late-Round Performance & Battle Density Reforge — QUALIFIED'):]
          assert section.count('- [x]')==8 and section.count('- [ ]')==0
          evidence=Path('docs/qualification/V13_7_WINDOWS_QUALIFICATION.md').read_text(encoding='utf-8')
          assert '0328a6613dcc64dffb1f675282e27a798b0f3abcb561e13423b7b6de3d75c25f' in evidence
          assert '60548408' in evidence
          template=Path('assets/readme/progress-template.svg').read_text(encoding='utf-8')
          assert 'TEMPLATE' in template and 'N/A' in template
          assert 'assets/readme/progress-template.svg' not in r and 'assets/readme/progress-template.svg' not in s
          PY
          git diff --check

      - name: Commit exact qualified state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg docs/qualification/V13_7_WINDOWS_QUALIFICATION.md Tools/finalize_v137_roadmap.py Tools/generate_progress_svgs.py Tools/verify_v137_late_round_performance.py; then
            echo 'v13.7 qualified state already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg docs/qualification/V13_7_WINDOWS_QUALIFICATION.md Tools/finalize_v137_roadmap.py Tools/generate_progress_svgs.py Tools/verify_v137_late_round_performance.py
          git commit -m 'docs(v13.7): finalize qualified performance milestone'
          git push origin HEAD:dev-v13-7
