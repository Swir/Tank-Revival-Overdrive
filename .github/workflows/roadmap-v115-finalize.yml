name: ROADMAP v11.5 Qualification Finalizer
on:
  push:
    branches: ['dev-v11-5']
    paths: ['.roadmap-v115-finalize-trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify qualified implementation and roadmap contract
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/PlatoonFireMissionCoordinator.cs
          test -f Assets/Scripts/PlatoonAssaultCISmokeProbe.cs
          test -f .github/workflows/platoon-assault-v115-windows.yml
          grep -q 'enum PlatoonRole' Assets/Scripts/PlatoonFireMissionCoordinator.cs
          grep -q 'PrioritySignature' Assets/Scripts/PlatoonFireMissionCoordinator.cs
          grep -q 'AssaultPhaseSeconds = 8f' Assets/Scripts/PlatoonFireMissionCoordinator.cs
          grep -q 'MaxActors = 24' Assets/Scripts/PlatoonFireMissionCoordinator.cs
          grep -q 'PlatoonFireMissionCoordinator.PreferPlayer' Assets/Scripts/EnemyTank.cs
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-269%2F274' ROADMAP.md
          grep -q 'V11.5%20IN%20DEVELOPMENT' ROADMAP.md
      - name: Finalize v11.5 checklist and dashboard
        shell: python
        run: |
          from pathlib import Path
          p=Path('ROADMAP.md')
          s=p.read_text(encoding='utf-8')
          start=s.index('## v11.5 — Platoon Roles, Target Handoffs & Coordinated Assaults')
          end=s.index('\n## Development rules', start)
          section=s[start:end]
          if section.count('- [ ]') != 5:
              raise SystemExit('Expected exactly five open v11.5 deliverables')
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED').replace('- [ ]','- [x]')
          s=s[:start]+section+s[end:]
          s=s.replace('ROADMAP-98.2%25-brightgreen','ROADMAP-100.0%25-brightgreen')
          s=s.replace('DONE-269%2F274','DONE-274%2F274')
          s=s.replace('STATUS-V11.5%20IN%20DEVELOPMENT-yellow','STATUS-V11.5%20QUALIFIED-brightgreen')
          s=s.replace('████████████████████ 98.2%','████████████████████ 100.0%')
          s=s.replace('| **269** | **5** | **274** | **98.2%** |','| **274** | **0** | **274** | **100.0%** |')
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify exact progress consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(274,0,274),(done,open_,total)
          assert s.count('<!-- SWIR-ROADMAP-STANDARD:v1 -->') >= 1
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M)) == 1
          for token in ['ROADMAP-100.0%25-brightgreen','DONE-274%2F274','STATUS-V11.5%20QUALIFIED-brightgreen','████████████████████ 100.0%','| **274** | **0** | **274** | **100.0%** |']:
              assert token in s,token
          start=s.index('## v11.5 — Platoon Roles, Target Handoffs & Coordinated Assaults')
          end=s.index('\n## Development rules',start)
          assert s[start:end].count('- [x]')==5
          assert s[start:end].count('- [ ]')==0
      - name: Commit qualification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v11.5): qualify platoon assault milestone'
          git push