name: ROADMAP v12.0 Scope Registrar
on:
  push:
    branches: [dev-v12-0]
    paths: ['.v120-roadmap-scope-trigger']
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v12-0
      - name: Register v12.0 scope and verify SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          assert sum(1 for line in s.splitlines() if line.strip()==marker)==1
          heading='## v12.0 — Combined Arms Operations & Mobile Front Objectives — IN DEVELOPMENT'
          if heading not in s:
              anchor='\n## Development rules\n'
              block='''\n## v12.0 — Combined Arms Operations & Mobile Front Objectives — IN DEVELOPMENT\n- [ ] A bounded combined-arms operation director links late-campaign frontline state, command momentum, engineering/breach intelligence and specialist platoons without replacing TankGame round authority.\n- [ ] Deterministic non-boss rounds 60–99 can launch mobile-front operations only when existing major operation schedulers are idle, preventing stacked objective overload.\n- [ ] Physical mobile command posts use authoritative Health/collision and advance or fall back from real Player/enemy presence instead of scripted invulnerability.\n- [ ] Existing enemy Heavy/Sniper/Siege/Elite actors are retasked as bounded escort/breaker groups through TacticalNavigationAgent while EnemyTank/Rigidbody2D remain movement authority.\n- [ ] Fresh v11.8/v11.9 breach state can redirect the mobile objective through genuinely open sectors; resolved counter-breaches are ignored until re-opened.\n- [ ] Successful operations create bounded real support/recovery and War Bond rewards, while failed enemy breakthroughs create readable frontline pressure without hidden damage or a parallel economy.\n- [ ] v12.0 runtime telemetry/smoke verifies operation scheduling, mobile-node bounds, escort caps, breach routing, cleanup and late-round authority/performance contracts.\n- [ ] Packaged Windows x64 v12.0 qualification builds and boots the exact candidate, executes combined-arms mobile-front smoke checks and rejects blocking exception signatures before qualification.\n'''
              assert anchor in s
              s=s.replace(anchor,block+anchor,1)
          completed=len(re.findall(r'^- \[x\] ',s,re.M)); remaining=len(re.findall(r'^- \[ \] ',s,re.M)); total=completed+remaining
          assert (completed,remaining,total)==(303,8,311),(completed,remaining,total)
          pct=round(completed*100/total,1); filled=round(20*completed/total); bar='█'*filled+'░'*(20-filled)
          start=s.index('<!-- ROADMAP-PROGRESS:START -->'); end=s.index('<!-- ROADMAP-PROGRESS:END -->')+len('<!-- ROADMAP-PROGRESS:END -->')
          dashboard=f'''<!-- ROADMAP-PROGRESS:START -->\n<p align="center">\n  <a href="https://github.com/Swir/Tank-Revival-Overdrive/actions/workflows/dev-windows-build.yml"><img alt="CI" src="https://github.com/Swir/Tank-Revival-Overdrive/actions/workflows/dev-windows-build.yml/badge.svg?branch=dev-v12-0"></a>\n  <img alt="Roadmap progress" src="https://img.shields.io/badge/ROADMAP-{pct:.1f}%25-brightgreen?style=for-the-badge">\n  <img alt="Completed" src="https://img.shields.io/badge/DONE-{completed}%2F{total}-1f6feb?style=for-the-badge">\n  <img alt="Status" src="https://img.shields.io/badge/STATUS-V12.0%20IN%20DEVELOPMENT-yellow?style=for-the-badge">\n</p>\n\n## 📊 Overall progress\n\n```text\n{bar} {pct:.1f}%\n```\n\n| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |\n|---:|---:|---:|---:|\n| **{completed}** | **{remaining}** | **{total}** | **{pct:.1f}%** |\n\n> **Progress rule:** calculate progress from explicit roadmap deliverables only: `[x] / ([x] + [ ])`. Update the checklist first, then badges, numbers, percentage and the 20-segment bar. Never estimate progress from version numbers, commit count, elapsed time or activity.\n<!-- ROADMAP-PROGRESS:END -->'''
          s=s[:start]+dashboard+s[end:]
          p.write_text(s,encoding='utf-8')
          r=p.read_text(encoding='utf-8')
          assert heading in r
          assert 'DONE-303%2F311' in r
          assert 'STATUS-V12.0%20IN%20DEVELOPMENT-yellow' in r
          assert '███████████████████░ 97.4%' in r
          assert '| **303** | **8** | **311** | **97.4%** |' in r
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',r,re.M))==1
      - name: Commit roadmap scope
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v12.0): register combined arms mobile-front milestone'
          git push
