name: Battlefield Weather v13.5 Windows Qualification Gate

on:
  push:
    branches: ['dev-v13-5']
    paths:
      - '.v135-windows-gate-trigger'
      - 'Assets/Scripts/BattlefieldWeatherV135.cs'
      - 'Assets/Scripts/BattlefieldWeatherCISmokeProbe.cs'
      - 'Assets/Scripts/PlayerTank.cs'
      - 'Assets/Scripts/EnemyTank.cs'
      - 'Assets/Editor/CIBuild.cs'
      - '.github/scripts/package_v135_battlefield_weather.py'
      - '.github/scripts/test_package_v135_battlefield_weather.py'
      - '.github/workflows/battlefield-weather-v135-windows.yml'
      - 'Tools/verify_v135_battlefield_weather.py'
      - 'Tools/verify_csharp_type_uniqueness.py'
      - 'Tools/verify_production_audio_assets.py'
      - 'Tools/verify_unity_ci_bootstrap.py'
      - 'Tools/generate_progress_svgs.py'
      - 'CHANGELOG_v13.5.md'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.17f1
  CANDIDATE_ZIP: TankRevivalOverdrive-v13.5-battlefield-weather-Windows-x64.zip
  PACKAGE_DIR: tro-v135-package

jobs:
  source-contracts:
    name: Verify v13.5 weather, authority, progress and package contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source/package contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v13-5'
          test "$(cat VERSION)" = 'v13.5.0-dev'
          python -m py_compile .github/scripts/package_v135_battlefield_weather.py .github/scripts/test_package_v135_battlefield_weather.py Tools/verify_v135_battlefield_weather.py Tools/verify_csharp_type_uniqueness.py Tools/verify_production_audio_assets.py Tools/verify_unity_ci_bootstrap.py Tools/generate_progress_svgs.py Tools/swir_visual_report_guard.py
          python .github/scripts/test_package_v135_battlefield_weather.py
          python Tools/verify_v135_battlefield_weather.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/verify_production_audio_assets.py
          python Tools/verify_unity_ci_bootstrap.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check
          git diff --check
      - name: Verify clean qualification policy
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/battlefield-weather-v135-windows.yml'
          grep -Fq 'Enforce clean Unity qualification state' "$workflow"
          cache_action='actions/'"cache@"
          if grep -Fq "uses: ${cache_action}" "$workflow"; then echo 'Qualification must not use Unity Library caches.' >&2; exit 1; fi
          restore_key='restore'"-keys:"
          if grep -Fq "$restore_key" "$workflow"; then echo 'Cross-candidate restore keys are forbidden.' >&2; exit 1; fi
      - name: Verify open v13.5 roadmap truth
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8'); r=Path('README.md').read_text(encoding='utf-8')
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<!-- SWIR-README-STANDARD:v2 -->' in r
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(423,8,431),(done,open_,total)
          assert '| **423** | **8** | **431** | **98.1%** |' in s
          assert 'V13.5%20IN%20DEVELOPMENT' in s
          assert s.count('assets/readme/progress-mini.svg')==1 and r.count('assets/readme/progress-card.svg')==1
          section=s[s.index('## v13.5 — Battlefield Weather & Visibility Warfare — IN DEVELOPMENT'):]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0

  build-candidate:
    name: Build and package one exact v13.5 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"; test -n "$UNITY_EMAIL"; test -n "$UNITY_PASSWORD"
      - name: Enforce clean Unity qualification state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Library Temp obj
          test ! -e Library; test ! -e Temp
          echo 'Exact v13.5 qualification starts from a clean Unity import state.'
      - name: Build development player once
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Discover, stage and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/package_v135_battlefield_weather.py --build-root build --output-dir "${RUNNER_TEMP}/${PACKAGE_DIR}" --candidate-sha "${GITHUB_SHA}" --commit-sha "${GITHUB_SHA}" --unity-version "${UNITY_VERSION}" --version-file VERSION --zip-name "${CANDIDATE_ZIP}" --diagnostics-path "${GITHUB_WORKSPACE}/V135_BATTLEFIELD_WEATHER_BUILD_TREE.txt"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v13.5-battlefield-weather-build-discovery
          path: V135_BATTLEFIELD_WEATHER_BUILD_TREE.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v13.5-battlefield-weather-Windows-x64
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/${{ env.CANDIDATE_ZIP }}
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V135_BATTLEFIELD_WEATHER_SHA256.txt
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V135_BATTLEFIELD_WEATHER_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14

  packaged-exe-regression:
    name: Run v13.5 weather plus v13.4/v13.3 and 80/90/100 regression on the same EXE
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v13.5-battlefield-weather-Windows-x64
          path: candidate
      - name: Verify exact package provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate
          $zip='${{ env.CANDIDATE_ZIP }}'; $expected=((Get-Content V135_BATTLEFIELD_WEATHER_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant(); $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw 'candidate ZIP digest mismatch'}
          $p=Get-Content V135_BATTLEFIELD_WEATHER_PROVENANCE.json -Raw|ConvertFrom-Json
          if($p.candidate_sha -ne '${{ github.sha }}' -or $p.commit_sha -ne '${{ github.sha }}' -or $p.sha256 -ne $actual -or $p.version -ne 'v13.5.0-dev'){throw 'candidate provenance mismatch'}
          Expand-Archive $zip -DestinationPath runtime -Force
          if(!(Test-Path runtime/TankRevivalOverdrive.exe) -or !(Test-Path runtime/TankRevivalOverdrive_Data)){throw 'packaged Unity runtime incomplete'}
          $info=Get-Content runtime/V135_BATTLEFIELD_WEATHER_BUILD.txt -Raw; if($info -notmatch 'candidate_sha=${{ github.sha }}'){throw 'runtime attribution mismatch'}
          Write-Host "Verified exact v13.5 candidate SHA256: $actual"
      - name: Run exact single-binary qualification matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate/runtime
          $blocking='Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException'
          function Invoke-Smoke([string]$Name,[string]$Flag,[string]$Pass,[string]$Fail,[string]$Log,[int]$TimeoutMs){
            Remove-Item $Pass,$Fail,$Log -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics',$Flag,'-logFile',$Log -PassThru
            if(!$p.WaitForExit($TimeoutMs)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "$Name timed out"}
            if(Test-Path $Fail){Get-Content $Fail; if(Test-Path $Log){Get-Content $Log -Tail 350}; throw "$Name emitted FAIL"}
            if(!(Test-Path $Pass)){if(Test-Path $Log){Get-Content $Log -Tail 350}; throw "$Name exited without PASS (exit=$($p.ExitCode))"}
            if($p.ExitCode -ne 0){throw "$Name non-zero exit $($p.ExitCode)"}
            if(Test-Path $Log){if(Select-String -Path $Log -Pattern $blocking -Quiet){Get-Content $Log -Tail 400; throw "$Name blocking exception signature"}}
            Get-Content $Pass; Write-Host "$Name PASS"
          }
          Invoke-Smoke 'production authored-audio presentation preflight' '-production-presentation-smoke' 'PRODUCTION_PRESENTATION_PASS.txt' 'PRODUCTION_PRESENTATION_FAIL.txt' 'V135ProductionAudio.log' 80000
          Invoke-Smoke 'v13.5 battlefield weather and visibility' '-tr-v135-smoke' 'V13_5_BATTLEFIELD_WEATHER_OK.txt' 'V13_5_BATTLEFIELD_WEATHER_FAIL.txt' 'V135Player.log' 90000
          Invoke-Smoke 'v13.4 tactical terrain regression' '-tr-v134-smoke' 'V13_4_TACTICAL_TERRAIN_OK.txt' 'V13_4_TACTICAL_TERRAIN_FAIL.txt' 'V134Regression.log' 90000
          Invoke-Smoke 'v13.3 battlefield cohesion regression' '-tr-v133-smoke' 'V13_3_BATTLEFIELD_COHESION_OK.txt' 'V13_3_BATTLEFIELD_COHESION_FAIL.txt' 'V133Regression.log' 80000
          Invoke-Smoke 'round 80/90/100 soak regression' '-demo-ci-soak' 'DEMO_SOAK_PASS.txt' 'DEMO_SOAK_FAIL.txt' 'V135Soak.log' 110000
          'v13.5 exact-candidate qualification matrix PASS' | Set-Content V13_5_WINDOWS_MATRIX_OK.txt
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v13.5-battlefield-weather-diagnostics
          path: |
            candidate/runtime/PRODUCTION_PRESENTATION_PASS.txt
            candidate/runtime/PRODUCTION_PRESENTATION_FAIL.txt
            candidate/runtime/V13_5_BATTLEFIELD_WEATHER_OK.txt
            candidate/runtime/V13_5_BATTLEFIELD_WEATHER_FAIL.txt
            candidate/runtime/V13_4_TACTICAL_TERRAIN_OK.txt
            candidate/runtime/V13_3_BATTLEFIELD_COHESION_OK.txt
            candidate/runtime/DEMO_SOAK_PASS.txt
            candidate/runtime/V13_5_WINDOWS_MATRIX_OK.txt
            candidate/runtime/V135ProductionAudio.log
            candidate/runtime/V135Player.log
            candidate/runtime/V134Regression.log
            candidate/runtime/V133Regression.log
            candidate/runtime/V135Soak.log
          if-no-files-found: ignore
          retention-days: 14
