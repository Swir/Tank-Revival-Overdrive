name: Dynamic Frontline v9.0 Windows Gate

on:
  push:
    branches:
      - 'dev-v9-0'
    paths:
      - '.dynamic-frontline-v90-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontline:
    name: Build v9.0 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Validate v9.0 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v9.0.0-dev"
          test -f Assets/Scripts/DynamicFrontlineTerritoryDirector.cs
          test -f Assets/Scripts/DynamicFrontlineTerritoryCISmokeProbe.cs
          grep -q "FrontlineControlState" Assets/Scripts/DynamicFrontlineTerritoryDirector.cs
          grep -q "TacticalNavigationAgent" Assets/Scripts/DynamicFrontlineTerritoryDirector.cs
          grep -q "CampaignEncounterDirector" Assets/Scripts/DynamicFrontlineTerritoryDirector.cs
          grep -q "DynamicBattlefieldDirector" Assets/Scripts/DynamicFrontlineTerritoryDirector.cs
          grep -q "ForwardRecoveryFrontlineDirector" Assets/Scripts/DynamicFrontlineTerritoryDirector.cs
          grep -q -- "-dynamic-frontline-smoke" Assets/Scripts/DynamicFrontlineTerritoryCISmokeProbe.cs
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: DynamicFrontlineV90-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            DynamicFrontlineV90-Library-${{ runner.os }}-6000.3.17f1-
            ForwardRecovery-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and pack exact candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v9.0-dynamic-frontline-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v9.0-dynamic-frontline-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v9.0-dynamic-frontline-Windows-x64
          path: TankRevival-v9.0-dynamic-frontline-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v9.0 EXE on Windows
    needs: build-frontline
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevival-v9.0-dynamic-frontline-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v9.0-dynamic-frontline-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
      - name: Run dynamic-frontline smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item DYNAMIC_FRONTLINE_PASS.txt, DYNAMIC_FRONTLINE_FAIL.txt, DynamicFrontlinePlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-dynamic-frontline-smoke','-logFile','DynamicFrontlinePlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Dynamic-frontline smoke timed out after 60 seconds'
          }
          if (Test-Path 'DYNAMIC_FRONTLINE_FAIL.txt') {
            Get-Content DYNAMIC_FRONTLINE_FAIL.txt
            if (Test-Path DynamicFrontlinePlayer.log) { Get-Content DynamicFrontlinePlayer.log -Tail 320 }
            throw 'Dynamic-frontline runtime probe reported FAIL'
          }
          if (!(Test-Path 'DYNAMIC_FRONTLINE_PASS.txt')) {
            if (Test-Path DynamicFrontlinePlayer.log) { Get-Content DynamicFrontlinePlayer.log -Tail 320 }
            throw 'Dynamic-frontline PASS marker missing'
          }
          Get-Content DYNAMIC_FRONTLINE_PASS.txt
