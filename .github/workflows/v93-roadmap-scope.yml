name: ROADMAP v9.3 Scope Registrar

on:
  push:
    branches:
      - 'dev-v9-3'
    paths:
      - '.roadmap-v93-scope-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v9-3
          fetch-depth: 0
      - name: Register honest v9.3 scope
        shell: python
        run: |
          from pathlib import Path
          p=Path('ROADMAP.md')
          s=p.read_text(encoding='utf-8')
          marker='## v9.3 — Siege Lines, Counter-Battery Warfare & Breach Operations — IN PROGRESS'
          if marker not in s:
              block='''\n## v9.3 — Siege Lines, Counter-Battery Warfare & Breach Operations — IN PROGRESS\n- [ ] Enemy siege lines deploy bounded physical artillery batteries with authoritative Health/collision on selected non-boss rounds, creating destroyable battlefield objectives instead of invisible pressure multipliers.\n- [ ] Friendly artillery gains bounded counter-battery fire against live siege batteries while enemy batteries use authoritative HE projectiles to suppress fortified lanes and open temporary breach windows.\n- [ ] Breach operations retask existing Heavy/Siege/Elite units through TacticalNavigationAgent toward defended lanes, with strict actor/shot/cadence budgets and no parallel enemy roster or damage authority.\n- [ ] Packaged Windows v9.3 gate validates siege scheduling, battery/counter-battery/breach safety bounds, runtime installation and exact EXE boot before qualification.\n'''
              s=s.replace('\n## Development rules', block+'\n## Development rules')
          s=s.replace('badge.svg?branch=dev-v9-2','badge.svg?branch=dev-v9-3')
          s=s.replace('ROADMAP-100.0%25-2ea043','ROADMAP-98.0%25-d29922')
          s=s.replace('DONE-194%2F194-1f6feb','DONE-194%2F198-1f6feb')
          s=s.replace('STATUS-V9.2%20QUALIFIED-2ea043','STATUS-V9.3%20IN%20PROGRESS-d29922')
          s=s.replace('████████████████████ 100.0%','████████████████████ 98.0%')
          s=s.replace('| **194** | **0** | **194** | **100.0%** |','| **194** | **4** | **198** | **98.0%** |')
          p.write_text(s,encoding='utf-8')
      - name: Validate dashboard/checklist consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!-- SWIR-ROADMAP-STANDARD:v1 -->' ROADMAP.md
          grep -q 'badge.svg?branch=dev-v9-3' ROADMAP.md
          grep -q 'ROADMAP-98.0%25' ROADMAP.md
          grep -q 'DONE-194%2F198' ROADMAP.md
          grep -q 'STATUS-V9.3%20IN%20PROGRESS' ROADMAP.md
          test "$(grep -c '^- \[x\]' ROADMAP.md)" -eq 194
          test "$(grep -c '^- \[ \]' ROADMAP.md)" -eq 4
          grep -q '| \*\*194\*\* | \*\*4\*\* | \*\*198\*\* | \*\*98.0%\*\* |' ROADMAP.md
      - name: Commit scope registration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'roadmap(v9.3): register siege-line milestone scope'
          git push origin HEAD:dev-v9-3
