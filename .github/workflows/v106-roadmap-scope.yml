name: ROADMAP v10.6 Scope Registration

on:
  push:
    branches:
      - 'dev-v10-6'
    paths:
      - '.roadmap-v106-scope-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v10-6
          fetch-depth: 0
      - name: Register v10.6 milestone before implementation
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<!-- ROADMAP-PROGRESS:START -->' in s and '<!-- ROADMAP-PROGRESS:END -->' in s
          assert '## v10.6 — Counter-Offensive Campaigns, Captured Intelligence & Command Collapse' not in s
          marker = '\n## Development rules'
          assert marker in s
          lines = [
              '',
              '## v10.6 — Counter-Offensive Campaigns, Captured Intelligence & Command Collapse — IN PROGRESS',
              '- [ ] Counter-order execution is assessed against live battlefield results, producing bounded SUCCESS, STALEMATE or FAILURE outcomes instead of ending after scripted response beats.',
              '- [ ] Successful BLOCK, COUNTERATTACK and DEEP STRIKE outcomes seed distinct next-sector counter-offensive plans with real combat support, captured-intelligence effects and persistent but capped operational momentum.',
              '- [ ] Failed counter-orders can trigger bounded High Command evacuation/recovery pressure, while captured intelligence and command-collapse state remain integrated with existing enemy roster, Health, frontline, War Bonds and projectile authority.',
              '- [ ] Packaged Windows v10.6 counter-offensive gate validates outcome assessment, next-sector carryover, strict caps, v10.5/v10.4 integration, runtime installation and exact EXE boot before qualification.',
              ''
          ]
          section = '\n'.join(lines)
          s = s.replace(marker, '\n' + section + marker, 1)
          s = s.replace('badge.svg?branch=dev-v10-5', 'badge.svg?branch=dev-v10-6', 1)
          s = s.replace('ROADMAP-100.0%25-2ea043', 'ROADMAP-98.3%25-d29922', 1)
          s = s.replace('DONE-230%2F230-1f6feb', 'DONE-230%2F234-1f6feb', 1)
          s = s.replace('STATUS-V10.5%20QUALIFIED-2ea043', 'STATUS-V10.6%20IN%20PROGRESS-d29922', 1)
          s = s.replace('████████████████████ 100.0%', '████████████████████ 98.3%', 1)
          s = s.replace('| **230** | **0** | **230** | **100.0%** |', '| **230** | **4** | **234** | **98.3%** |', 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify scope and dashboard consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('ROADMAP.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', s, re.M))
          open_ = len(re.findall(r'^- \[ \] ', s, re.M))
          assert (done, open_) == (230, 4), (done, open_)
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<img alt="CI"' in s and '<img alt="Roadmap progress"' in s
          assert '<img alt="Completed"' in s and '<img alt="Status"' in s
          assert 'badge.svg?branch=dev-v10-6' in s
          assert 'ROADMAP-98.3%25-d29922' in s
          assert 'DONE-230%2F234-1f6feb' in s
          assert 'STATUS-V10.6%20IN%20PROGRESS-d29922' in s
          assert '████████████████████ 98.3%' in s
          assert '| **230** | **4** | **234** | **98.3%** |' in s
          assert s.count('## v10.6 — Counter-Offensive Campaigns, Captured Intelligence & Command Collapse — IN PROGRESS') == 1
      - name: Commit registered roadmap scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m 'roadmap(v10.6): register counter-offensive milestone scope'
          git push origin HEAD:dev-v10-6
