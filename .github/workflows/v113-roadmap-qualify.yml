name: ROADMAP v11.3 Qualification Finalizer

on:
  push:
    branches: ['dev-v11-3']
    paths: ['.v113-roadmap-qualify-trigger']

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v11-3
      - name: Verify exact qualified candidate contract
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/AdvancedGunneryDoctrineDirector.cs
          test -f Assets/Scripts/CounterFireThreatMemory.cs
          test -f Assets/Scripts/AdvancedGunneryCISmokeProbe.cs
          grep -q 'Health.Damaged+=OnDamaged' Assets/Scripts/EnemyTank.cs
          grep -q 'CounterFireThreatMemory.ShouldRetaliate' Assets/Scripts/EnemyTank.cs
          grep -q 'CounterFireThreatMemory.AccuracyMultiplier' Assets/Scripts/EnemyTank.cs
          grep -q '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md
          grep -q 'DONE-259%2F264' ROADMAP.md
      - name: Qualify verified v11.3 roadmap deliverables
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          heading='## v11.3 — Advanced Gunnery Doctrine & Counter-Fire Warfare — IN DEVELOPMENT'
          assert heading in s
          start=s.index(heading)
          end=s.find('\n## ',start+len(heading))
          if end < 0: end=len(s)
          section=s[start:end]
          assert section.count('- [ ] ')==5
          section=section.replace('- [ ] ','- [x] ')
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED',1)
          s=s[:start]+section+s[end:]
          s=s.replace('ROADMAP-98.1%25-7c3aed','ROADMAP-100.0%25-2ea043',1)
          s=s.replace('DONE-259%2F264-1f6feb','DONE-264%2F264-1f6feb',1)
          s=s.replace('STATUS-V11.3%20IN%20DEVELOPMENT-7c3aed','STATUS-V11.3%20QUALIFIED-2ea043',1)
          s=s.replace('████████████████████ 98.1%','████████████████████ 100.0%',1)
          s=s.replace('| **259** | **5** | **264** | **98.1%** |','| **264** | **0** | **264** | **100.0%** |',1)
          c=len(re.findall(r'^- \[x\] ',s,re.M)); r=len(re.findall(r'^- \[ \] ',s,re.M))
          assert (c,r)==(264,0),(c,r)
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          assert 'DONE-264%2F264' in s and 'STATUS-V11.3%20QUALIFIED' in s
          assert '████████████████████ 100.0%' in s
          assert '| **264** | **0** | **264** | **100.0%** |' in s
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify SWIR roadmap v1 consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          assert '## 📊 Overall progress' in s
          assert 'DONE-264%2F264' in s
          assert 'ROADMAP-100.0%25' in s
          assert 'STATUS-V11.3%20QUALIFIED' in s
          assert len(re.findall(r'^- \[x\] ',s,re.M))==264
          assert len(re.findall(r'^- \[ \] ',s,re.M))==0
      - name: Commit qualification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git diff --cached --check
          git commit -m 'docs(v11.3): qualify advanced gunnery milestone'
          git push origin HEAD:dev-v11-3
