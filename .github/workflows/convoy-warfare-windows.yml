name: Convoy Warfare Windows Gate

on:
  push:
    branches:
      - 'dev-v6-2'
    paths:
      - '.dev-build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-convoy-candidate:
    name: Compile v6.2 Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: ConvoyWarfare-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ConvoyWarfare-Library-${{ runner.os }}-6000.3.17f1-
            MultiStageOps-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify executable
        shell: bash
        run: |
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
      - name: Pack exact candidate
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v6.2-convoy-warfare-Windows-x64.zip .
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v6.2-convoy-warfare-Windows-x64
          path: TankRevivalOverdrive-v6.2-convoy-warfare-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  convoy-runtime-smoke:
    name: Boot packaged EXE and verify v6.2 convoy warfare
    needs: build-convoy-candidate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v6.2-convoy-warfare-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v6.2-convoy-warfare-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
      - name: Run v6.2 convoy warfare smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item CONVOY_WARFARE_PASS.txt, CONVOY_WARFARE_FAIL.txt, ConvoyWarfarePlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-convoy-warfare-smoke','-logFile','ConvoyWarfarePlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Convoy warfare smoke timed out after 60 seconds' }
          if (Test-Path 'CONVOY_WARFARE_FAIL.txt') { Get-Content CONVOY_WARFARE_FAIL.txt; if (Test-Path ConvoyWarfarePlayer.log) { Get-Content ConvoyWarfarePlayer.log -Tail 180 }; throw 'Convoy warfare runtime probe reported FAIL' }
          if (!(Test-Path 'CONVOY_WARFARE_PASS.txt')) { if (Test-Path ConvoyWarfarePlayer.log) { Get-Content ConvoyWarfarePlayer.log -Tail 180 }; throw "Runtime exited without convoy PASS marker (exit=$($p.ExitCode))" }
          Get-Content CONVOY_WARFARE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path ConvoyWarfarePlayer.log) {
            if (Select-String -Path ConvoyWarfarePlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException' -Quiet) { Get-Content ConvoyWarfarePlayer.log -Tail 220; throw 'Blocking exception signature found during v6.2 runtime smoke' }
          }
          Write-Host 'v6.2 convoy warfare runtime smoke passed.'
      - name: Upload convoy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v6.2-convoy-warfare-diagnostics
          path: |
            candidate/runtime/CONVOY_WARFARE_PASS.txt
            candidate/runtime/CONVOY_WARFARE_FAIL.txt
            candidate/runtime/ConvoyWarfarePlayer.log
          if-no-files-found: ignore
          retention-days: 14
