name: EW Command Windows Gate

on:
  push:
    branches:
      - 'dev-v7-7'
    paths:
      - '.ew-command-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ew-command:
    name: Build v7.7 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate v7.7 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v7.7.0-dev"
          test -f Assets/Scripts/EnemyElectronicWarfareDirector.cs
          test -f Assets/Scripts/EnemyElectronicWarfareCISmokeProbe.cs
          grep -q "MinimumCommandRound = 20" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "CommandHealthMultiplier = 1.40f" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "TacticalSuperiorityDuration = 6.0f" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "MaxSmokeResponders = 4" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "DecoyDuration = 6.0f" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "DecoyCooldown = 20.0f" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "CommandDecoyDetectionDelay = 3.0f" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "TankGame.SpawnProjectile\|_game.SpawnProjectile" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "TacticalCounterplayDirector.Instance" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "AdaptiveFireControlDirector.Instance" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q "TacticalNavigationAgent" Assets/Scripts/EnemyElectronicWarfareDirector.cs
          grep -q -- "-ew-command-smoke" Assets/Scripts/EnemyElectronicWarfareCISmokeProbe.cs
          echo "v7.7 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: EwCommand-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            EwCommand-Library-${{ runner.os }}-6000.3.17f1-
            TacticalCounterplay-Library-${{ runner.os }}-6000.3.17f1-
            AdaptiveFireControl-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v7.7-ew-command-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v7.7-ew-command-Windows-x64.zip

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.7-ew-command-Windows-x64
          path: TankRevival-v7.7-ew-command-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v7.7 EXE on Windows
    needs: build-ew-command
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v7.7-ew-command-Windows-x64
          path: candidate

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v7.7-ew-command-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }

      - name: Run EW command smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item EW_COMMAND_PASS.txt, EW_COMMAND_FAIL.txt, EwCommandPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-ew-command-smoke','-logFile','EwCommandPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'EW command smoke timed out after 60 seconds'
          }
          if (Test-Path 'EW_COMMAND_FAIL.txt') {
            Get-Content EW_COMMAND_FAIL.txt
            if (Test-Path EwCommandPlayer.log) { Get-Content EwCommandPlayer.log -Tail 220 }
            throw 'EW command runtime probe reported FAIL'
          }
          if (!(Test-Path 'EW_COMMAND_PASS.txt')) {
            if (Test-Path EwCommandPlayer.log) { Get-Content EwCommandPlayer.log -Tail 220 }
            throw "Runtime exited without EW command PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content EW_COMMAND_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Select-String -Path EwCommandPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
            Get-Content EwCommandPlayer.log -Tail 260
            throw 'Blocking exception signature found during EW command smoke'
          }
          Write-Host 'v7.7 EW command runtime smoke passed.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.7-ew-command-diagnostics
          path: |
            candidate/runtime/EW_COMMAND_PASS.txt
            candidate/runtime/EW_COMMAND_FAIL.txt
            candidate/runtime/EwCommandPlayer.log
          if-no-files-found: ignore
          retention-days: 14
