name: V8.8 Roadmap Qualification Lock

on:
  push:
    branches:
      - 'dev-v8-8'
    paths:
      - '.roadmap-v88-trigger'

permissions:
  contents: write

jobs:
  qualify-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v8-8
          fetch-depth: 0
      - name: Close verified v8.8 scope and recalculate dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          if '<!-- SWIR-ROADMAP-STANDARD:v1 -->' not in text:
              raise SystemExit('SWIR roadmap marker missing')
          heading = '## v8.8 — Battlefield Salvage, Field Resupply & Logistics Counteroffensive — IN PROGRESS'
          if heading not in text:
              raise SystemExit('v8.8 in-progress heading missing')
          start = text.index(heading)
          end = text.index('## Development rules', start)
          section = text[start:end]
          if section.count('- [ ] ') != 4:
              raise SystemExit('expected exactly four unchecked v8.8 deliverables')
          section = section.replace('— IN PROGRESS', '— COMPLETE', 1).replace('- [ ] ', '- [x] ')
          text = text[:start] + section + text[end:]

          completed = len(re.findall(r'^- \[x\] ', text, flags=re.M))
          remaining = len(re.findall(r'^- \[ \] ', text, flags=re.M))
          total = completed + remaining
          pct = completed / total * 100 if total else 0.0
          filled = max(0, min(20, round(pct / 5.0)))
          bar = '█' * filled + '░' * (20 - filled)

          if completed != 178 or remaining != 0 or total != 178:
              raise SystemExit(f'unexpected final checklist state {completed}/{total} remaining={remaining}')

          text = re.sub(r'badge\.svg\?branch=[^\"\)]+', 'badge.svg?branch=dev-v8-8', text, count=1)
          text = re.sub(r'https://img\.shields\.io/badge/ROADMAP-[^\"]+', 'https://img.shields.io/badge/ROADMAP-100.0%25-22c55e?style=for-the-badge', text, count=1)
          text = re.sub(r'https://img\.shields\.io/badge/DONE-[^\"]+', 'https://img.shields.io/badge/DONE-178%2F178-1f6feb?style=for-the-badge', text, count=1)
          text = re.sub(r'https://img\.shields\.io/badge/STATUS-[^\"]+', 'https://img.shields.io/badge/STATUS-V8.8%20QUALIFIED-22c55e?style=for-the-badge', text, count=1)
          text = re.sub(r'(?m)^[█░]{20} [0-9.]+%$', f'{bar} {pct:.1f}%', text, count=1)
          text = re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|', '| **178** | **0** | **178** | **100.0%** |', text, count=1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify SWIR roadmap lock
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!-- SWIR-ROADMAP-STANDARD:v1 -->' ROADMAP.md
          grep -q '<!-- ROADMAP-PROGRESS:START -->' ROADMAP.md
          grep -q '<!-- ROADMAP-PROGRESS:END -->' ROADMAP.md
          grep -q 'badge.svg?branch=dev-v8-8' ROADMAP.md
          grep -q 'ROADMAP-100.0%25-22c55e' ROADMAP.md
          grep -q 'DONE-178%2F178' ROADMAP.md
          grep -q 'STATUS-V8.8%20QUALIFIED-22c55e' ROADMAP.md
          grep -q '## 📊 Overall progress' ROADMAP.md
          grep -q '| \*\*178\*\* | \*\*0\*\* | \*\*178\*\* | \*\*100.0%\*\* |' ROADMAP.md
          grep -q '## v8.8 — Battlefield Salvage, Field Resupply & Logistics Counteroffensive — COMPLETE' ROADMAP.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('ROADMAP.md').read_text(encoding='utf-8')
          m = re.search(r'(?m)^([█░]+) ([0-9.]+)%$', text)
          assert m and len(m.group(1)) == 20 and m.group(1) == '█' * 20 and m.group(2) == '100.0'
          start = text.index('## v8.8 — Battlefield Salvage')
          end = text.index('## Development rules', start)
          section = text[start:end]
          assert section.count('- [x] ') == 4 and section.count('- [ ] ') == 0
          assert len(re.findall(r'^- \[x\] ', text, flags=re.M)) == 178
          assert len(re.findall(r'^- \[ \] ', text, flags=re.M)) == 0
          PY
      - name: Commit qualified roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v8.8): apply locked roadmap state'
          git push origin HEAD:dev-v8-8
