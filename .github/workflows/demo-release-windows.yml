name: Public Demo Release Windows

on:
  push:
    branches:
      - dev-v6-3
    paths:
      - '.demo-release-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demo:
    name: Build public Windows demo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate public demo source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v6.3.0-demo"
          test -f Assets/Scripts/DemoExperienceDirector.cs
          test -f Assets/Scripts/DemoAcceptanceGate.cs
          test -f Assets/Scripts/DemoCISmokeProbe.cs
          test -f Assets/Scripts/DemoCISoakProbe.cs
          test -f Assets/Scripts/RuntimeStabilityDirector.cs
          test -f Assets/Scripts/ProjectilePool.cs
          test -f Assets/Scripts/CombinedArmsDirector.cs
          grep -q "BuildDemoCandidate" Assets/Editor/CIBuild.cs
          grep -q -- "-demo-ci-smoke" Assets/Scripts/DemoCISmokeProbe.cs
          grep -q -- "-demo-ci-soak" Assets/Scripts/DemoCISoakProbe.cs
          grep -q "80, 90, 100" Assets/Scripts/DemoCISoakProbe.cs
          echo "Public demo source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Public-Demo-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Demo-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
            Library-${{ runner.os }}-6000.3.17f1-

      - name: Build non-development Windows demo
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildDemoCandidate
          allowDirtyBuild: true

      - name: Validate packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          test -f "$root/BUILD_INFO.txt"
          test -f "$root/DEMO_MANIFEST.txt"
          test -f "$root/README_DEMO.txt"
          grep -q "Build: 6.3.0-demo" "$root/BUILD_INFO.txt"
          grep -q "Demo candidate: 6.3.0-demo" "$root/DEMO_MANIFEST.txt"
          grep -q "Commit: $GITHUB_SHA" "$root/DEMO_MANIFEST.txt"
          test -s "$root/TankRevivalOverdrive.exe"
          echo "Windows public-demo runtime gate passed."

      - name: Pack public demo
        shell: bash
        run: |
          set -euo pipefail
          archive=TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip
          cd build/StandaloneWindows64
          zip -r "../../$archive" .
          cd ../..
          test -s "$archive"
          sha256sum "$archive" | tee "$archive.sha256"

      - name: Upload public demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64
          path: |
            TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip
            TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  windows-runtime-smoke:
    name: Boot packaged public demo EXE on Windows
    needs: build-demo
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download packaged public demo
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64
          path: candidate

      - name: Verify checksum and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          $zip = 'TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip'
          $expected = (Get-Content "$zip.sha256").Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected.ToLowerInvariant() -ne $actual) { throw "Checksum mismatch: $expected != $actual" }
          Expand-Archive $zip -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }

      - name: Launch real standalone runtime smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item DEMO_SMOKE_PASS.txt, DEMO_SMOKE_FAIL.txt, Player.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-demo-ci-smoke','-logFile','Player.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Standalone smoke probe timed out after 60 seconds'
          }
          if (Test-Path 'DEMO_SMOKE_FAIL.txt') {
            Get-Content DEMO_SMOKE_FAIL.txt
            if (Test-Path Player.log) { Get-Content Player.log -Tail 160 }
            throw 'Runtime smoke probe reported FAIL'
          }
          if (!(Test-Path 'DEMO_SMOKE_PASS.txt')) {
            if (Test-Path Player.log) { Get-Content Player.log -Tail 160 }
            throw "Runtime exited without PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content DEMO_SMOKE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path Player.log) {
            if (Select-String -Path Player.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
              Get-Content Player.log -Tail 200
              throw 'Blocking exception signature found in Player.log'
            }
          }
          Write-Host 'Packaged Windows public demo boot/runtime smoke gate passed.'

  windows-late-round-soak:
    name: Qualify public demo through rounds 80/90/100
    needs: windows-runtime-smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download exact packaged public demo
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64
          path: candidate

      - name: Verify checksum and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          $zip = 'TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip'
          $expected = (Get-Content "$zip.sha256").Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected.ToLowerInvariant() -ne $actual) { throw "Checksum mismatch: $expected != $actual" }
          Expand-Archive $zip -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }

      - name: Run packaged late-round 80/90/100 qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item DEMO_SOAK_PASS.txt, DEMO_SOAK_FAIL.txt, SoakPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-demo-ci-soak','-logFile','SoakPlayer.log' -PassThru
          if (!$p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Late-round soak timed out after 120 seconds'
          }
          if (Test-Path 'DEMO_SOAK_FAIL.txt') {
            Get-Content DEMO_SOAK_FAIL.txt
            if (Test-Path SoakPlayer.log) { Get-Content SoakPlayer.log -Tail 240 }
            throw 'Packaged late-round qualification reported FAIL'
          }
          if (!(Test-Path 'DEMO_SOAK_PASS.txt')) {
            if (Test-Path SoakPlayer.log) { Get-Content SoakPlayer.log -Tail 240 }
            throw "Runtime exited without soak PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content DEMO_SOAK_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path SoakPlayer.log) {
            if (Select-String -Path SoakPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException' -Quiet) {
              Get-Content SoakPlayer.log -Tail 260
              throw 'Blocking exception signature found during late-round qualification'
            }
          }
          Write-Host 'Packaged Windows late-round 80/90/100 qualification passed.'

  publish-demo-release:
    name: Publish GitHub DEMO Release
    needs: windows-late-round-soak
    runs-on: ubuntu-latest

    steps:
      - name: Download qualified public demo artifact
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64
          path: release

      - name: Publish v6.3.0-demo prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.3.0-demo
        run: |
          set -euo pipefail
          cd release
          cat > RELEASE_NOTES.md <<'EOF'
          # Tank Revival: Orzeł Overdrive — DEMO v6.3.0

          Publiczne demo Windows x64.

          Rozpakuj cały ZIP do osobnego folderu i uruchom `TankRevivalOverdrive.exe`.
          Nie przenoś samego EXE bez folderu `TankRevivalOverdrive_Data`.

          Zawiera 100-rundową kampanię, obronę Orzełka, bossów, specjalną amunicję, aktywną obronę, cele pola walki, konwoje oraz Combined Arms / reinforcement warfare.

          Ten pakiet przeszedł automatyczny packaged-EXE smoke test na świeżym Windows runnerze oraz kwalifikację rund 80/90/100.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip \
              TankRevival-Orzel-Overdrive-DEMO-v6.3.0-Windows-x64.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Tank Revival: Orzeł Overdrive — DEMO v6.3.0" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
