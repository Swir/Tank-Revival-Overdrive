name: ROADMAP v13.4 Qualification Finalizer

on:
  push:
    branches: ['dev-v13-4']
    paths: ['.v134-roadmap-qualification-trigger']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact qualified v13.4 candidate
        shell: python
        run: |
          from pathlib import Path
          import json,os,subprocess,urllib.request
          sha=Path('.v134-roadmap-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha.lower()),sha
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha+'..HEAD'],text=True).splitlines()
          allowed={'.v134-roadmap-qualification-trigger','.github/workflows/roadmap-v134-qualification.yml'}
          assert set(changed).issubset(allowed),'Unqualified source changes after candidate: '+repr(changed)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+sha+'&per_page=100'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'TankRevival-v134-qualifier'})
          with urllib.request.urlopen(req) as response: data=json.load(response)
          matches=[r for r in data.get('workflow_runs',[]) if r.get('name')=='Tactical Terrain v13.4 Windows Qualification Gate' and r.get('path')=='.github/workflows/tactical-terrain-v134-windows.yml' and r.get('head_sha')==sha and r.get('conclusion')=='success']
          assert matches,'No successful exact v13.4 Windows qualification gate for '+sha
          print('Qualified SHA:',sha,'run:',matches[0]['html_url'])
      - name: Verify implementation and open roadmap state
        shell: bash
        run: |
          set -euo pipefail
          for f in Assets/Scripts/TacticalTerrainV134.cs Assets/Scripts/TacticalTerrainCISmokeProbe.cs Assets/Scripts/TankGame.cs Assets/Scripts/EnemyTank.cs Assets/Scripts/Obstacle.cs Assets/Scripts/ReactiveCoverBreachDirector.cs .github/workflows/tactical-terrain-v134-windows.yml .github/scripts/package_v134_tactical_terrain.py .github/scripts/test_package_v134_tactical_terrain.py CHANGELOG_v13.4.md Tools/verify_v134_tactical_terrain.py Tools/verify_production_audio_assets.py Tools/verify_unity_ci_bootstrap.py Tools/generate_progress_svgs.py; do test -f "$f"; done
          test "$(cat VERSION)" = 'v13.4.0-dev'
          grep -q 'V13_4_TACTICAL_TERRAIN_OK.txt' Assets/Scripts/TacticalTerrainCISmokeProbe.cs
          grep -q 'V13_4_WINDOWS_MATRIX_OK.txt' .github/workflows/tactical-terrain-v134-windows.yml
          for flag in -production-presentation-smoke -tr-v134-smoke -tr-v133-smoke -tr-v132-smoke -tr-v131-smoke -tr-v130-smoke -tr-v129-smoke -tr-v128-smoke -demo-ci-soak; do grep -q -- "$flag" .github/workflows/tactical-terrain-v134-windows.yml; done
          python .github/scripts/test_package_v134_tactical_terrain.py
          python Tools/verify_v134_tactical_terrain.py
          python Tools/verify_production_audio_assets.py
          python Tools/verify_unity_ci_bootstrap.py
          python Tools/generate_progress_svgs.py --check
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-415%2F423' ROADMAP.md
          grep -q 'STATUS-V13.4%20IN%20DEVELOPMENT-yellow' ROADMAP.md
      - name: Finalize checklist and protected SWIR dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'; assert len(re.findall(r'^'+re.escape(marker)+r'$',s,re.M))==1
          assert not re.search(r'(?m)^[█░]{8,}\s+[0-9.]+%$',s), 'legacy character meter present before finalization'
          heading='## v13.4 — Tactical Terrain & Cover Warfare — IN DEVELOPMENT'
          start=s.index(heading); section=s[start:]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED',1).replace('- [ ]','- [x]'); s=s[:start]+section
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(423,0,423),(done,open_,total)
          pct=round(done*100/total,1)
          s=re.sub(r'ROADMAP-[0-9.]+%25-[A-Za-z0-9]+',f'ROADMAP-{pct:.1f}%25-brightgreen',s,count=1)
          s=re.sub(r'DONE-[0-9]+%2F[0-9]+',f'DONE-{done}%2F{total}',s,count=1)
          s=re.sub(r'STATUS-V13\.4%20IN%20DEVELOPMENT-yellow',r'STATUS-V13.4%20QUALIFIED-brightgreen',s,count=1)
          s=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|',f'| **{done}** | **{open_}** | **{total}** | **{pct:.1f}%** |',s,count=1)
          assert not re.search(r'(?m)^[█░]{8,}\s+[0-9.]+%$',s), 'finalizer must not create a legacy character meter'
          p.write_text(s,encoding='utf-8')
      - name: Regenerate Progress SVG Pro and README from qualified ROADMAP
        shell: bash
        run: |
          set -euo pipefail
          python Tools/generate_progress_svgs.py --write --embed --check
          python Tools/generate_progress_svgs.py --write --embed --check
          git diff --check
      - name: Synchronize qualified README milestone evidence
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          candidate=Path('.v134-roadmap-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(candidate)==40
          s=re.sub(
              r'(?m)^\[!\[v13\.2 Windows Gate\].*$',
              '[![v13.4 Windows Gate](https://github.com/Swir/Tank-Revival-Overdrive/actions/workflows/tactical-terrain-v134-windows.yml/badge.svg?branch=dev-v13-4)](https://github.com/Swir/Tank-Revival-Overdrive/actions/workflows/tactical-terrain-v134-windows.yml)',
              s,count=1)
          s=s.replace('**Battlefield cohesion v13.3 — in development**','**Battlefield cohesion v13.3 — qualified**')
          s=re.sub(
              r'(?m)^\| 🧪 \*\*Exact-candidate qualification\*\* \|.*?\|$',
              f'| 🧪 **Exact-candidate qualification** | v13.4 qualified exact candidate `{candidate}`: one packaged Windows x64 EXE passed production-audio preflight, v13.4 tactical-terrain smoke, v13.3/v13.2/v13.1/v13.0/v12.9/v12.8 regressions and rounds 80/90/100 soak. |',
              s,count=1)
          s=s.replace('### Battlefield Cohesion v13.3 — in development','### Battlefield Cohesion v13.3 — qualified')
          s=s.replace(
              'A dedicated packaged-EXE smoke probe exists in source, but v13.3 remains **IN DEVELOPMENT** until Windows qualification is green.',
              'The v13.3 packaged-EXE qualification is green; its bounded squad layer remains underneath v13.4 tactical-terrain intent without taking spawn, movement, fire, damage or healing authority.')
          s=s.replace(
              'Recent qualified milestone layers include v13.0 encounter/boss warfare, v13.1 objective warfare and v13.2 adaptive enemy command.',
              'Recent qualified milestone layers include v13.0 encounter/boss warfare, v13.1 objective warfare, v13.2 adaptive enemy command and v13.3 battlefield cohesion.')
          stale=(
              'The qualified v13.2 candidate is `538c4a3790749bcb9180f2d49e6fff4bed9f0f45`; its Windows qualification and exact-SHA roadmap finalization both completed successfully. '
              'v13.3 now has its own source/authority contract and smoke source, but its eight roadmap items remain pending until the v13.3 exact-candidate Windows qualification train is complete.'
          )
          fresh=(
              'The v13.3 exact candidate `0e3496ce095d27b2a686efbb5539cc7e475e3213` completed its Windows qualification before v13.4 development started. '
              f'v13.4 is now qualified at exact candidate `{candidate}`; roadmap completion records that verified development scope only and does not publish a public release automatically.'
          )
          assert stale in s, 'stale v13.2/v13.3 roadmap evidence changed unexpectedly'
          s=s.replace(stale,fresh,1)
          s=re.sub(
              r'(?m)^- \*\*Development milestone:\*\*.*$',
              '- **Development milestone:** v13.4 is qualified on `dev-v13-4`; this qualified development milestone has not been promoted to a new public v13.4 release.',
              s,count=1)
          assert '<!-- SWIR-README-STANDARD:v2 -->' in s and '## 🔎 Search Keywords' in s
          assert 'v13.3 remains unqualified' not in s and 'v13.3 remains **IN DEVELOPMENT**' not in s
          assert not re.search(r'(?m)^[█░]{8,}\s+[0-9.]+%$',s)
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify qualified state
        shell: python
        run: |
          from pathlib import Path
          import re,xml.etree.ElementTree as ET
          s=Path('ROADMAP.md').read_text(encoding='utf-8'); r=Path('README.md').read_text(encoding='utf-8'); t=Path('assets/readme/progress-template.svg').read_text(encoding='utf-8')
          candidate=Path('.v134-roadmap-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          assert len(re.findall(r'^<!-- SWIR-README-STANDARD:v2 -->$',r,re.M))==1
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(423,0,423)
          assert 'ROADMAP-100.0%25-brightgreen' in s and 'DONE-423%2F423' in s and 'STATUS-V13.4%20QUALIFIED-brightgreen' in s
          assert '| **423** | **0** | **423** | **100.0%** |' in s
          assert not re.search(r'(?m)^[█░]{8,}\s+[0-9.]+%$',s)
          assert not re.search(r'(?m)^[█░]{8,}\s+[0-9.]+%$',r)
          section=s[s.index('## v13.4 — Tactical Terrain & Cover Warfare — QUALIFIED'):]
          assert section.count('- [x]')==8 and section.count('- [ ]')==0
          assert s.count('<!-- SWIR-PROGRESS-SVG-PRO:v1 -->')==1 and r.count('<!-- SWIR-PROGRESS-SVG-PRO:v1 -->')==1
          assert s.count('assets/readme/progress-mini.svg')==1 and r.count('assets/readme/progress-card.svg')==1
          assert 'progress-template.svg' not in s and 'progress-template.svg' not in r
          assert 'Template' in t and 'N/A' in t
          assert '423 / 423 completed (100.0%)' in s and '423 / 423 completed (100.0%)' in r
          assert candidate in r and 'v13.4 Windows Gate' in r and 'Battlefield Cohesion v13.3 — qualified' in r
          assert 'v13.3 remains unqualified' not in r and 'v13.3 remains **IN DEVELOPMENT**' not in r
          assert '## 🔎 Search Keywords' in r
          for p in ['assets/readme/progress-card.svg','assets/readme/progress-mini.svg','assets/readme/progress-template.svg']: ET.parse(p)
          print('SWIR v13.4 qualified SVG-only README/roadmap state: PASS')
      - name: Commit qualified roadmap and deterministic progress assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg
          git commit -m 'docs(v13.4): qualify tactical terrain milestone'
          git push origin HEAD:dev-v13-4
