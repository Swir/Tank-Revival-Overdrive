name: ROADMAP v10.3 Scope Registrar

on:
  push:
    branches:
      - 'dev-v10-3'
    paths:
      - '.roadmap-v103-scope-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v10-3
      - name: Register unchecked v10.3 scope and preserve SWIR standard
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<!-- ROADMAP-PROGRESS:START -->' in s and '<!-- ROADMAP-PROGRESS:END -->' in s
          assert '## 📊 Overall progress' in s
          assert '## v10.2 — Theater Consequence Engine, Sector Doctrines & Branching War State — COMPLETE' in s
          assert '## v10.3 — Adaptive Enemy High Command, Counter-Doctrines & Sector War Plans' not in s
          assert len(re.findall(r'^- \[x\] ', s, re.M)) == 218
          assert len(re.findall(r'^- \[ \] ', s, re.M)) == 0
          s = s.replace('badge.svg?branch=dev-v10-2', 'badge.svg?branch=dev-v10-3')
          s = s.replace('ROADMAP-100.0%25-2ea043', 'ROADMAP-98.2%25-d29922')
          s = s.replace('DONE-218%2F218-1f6feb', 'DONE-218%2F222-1f6feb')
          s = s.replace('STATUS-V10.2%20QUALIFIED-2ea043', 'STATUS-V10.3%20IN%20PROGRESS-d29922')
          s = s.replace('████████████████████ 100.0%', '████████████████████ 98.2%', 1)
          s = s.replace('| **218** | **0** | **218** | **100.0%** |', '| **218** | **4** | **222** | **98.2%** |', 1)
          block = '''\n## v10.3 — Adaptive Enemy High Command, Counter-Doctrines & Sector War Plans — IN PROGRESS\n- [ ] Adaptive Enemy High Command reads the rolling v10.2 sector-doctrine history and resolves a bounded enemy counter-doctrine for later sector rounds, with deterministic history weighting, boss safety and no replacement of existing campaign authority.\n- [ ] ARMOR TRAP, DISPERSED LOGISTICS and SIEGE BREACH create materially different counterplay by issuing temporary orders to existing TacticalNavigationAgent units, using bounded AP/HE counter-fire and limited existing-Health logistics sustain rather than parallel movement, damage or economy systems.\n- [ ] Sector war plans are hard-capped and player-readable: at most four retasked combatants and two counter-fire shells per response beat, active only in the mid/late sector window so v10.2 consequences and boss rounds retain their own authority.\n- [ ] Packaged Windows v10.3 high-command gate validates doctrine mapping/history weighting, round windows/caps, v10.2 and tactical-navigation integration, runtime installation and exact EXE boot before qualification.\n'''
          marker = '\n## Development rules\n'
          assert marker in s
          s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate dashboard/checklist consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('ROADMAP.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', s, re.M))
          open_ = len(re.findall(r'^- \[ \] ', s, re.M))
          assert (done, open_) == (218, 4), (done, open_)
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<img alt="CI"' in s and '<img alt="Roadmap progress"' in s
          assert '<img alt="Completed"' in s and '<img alt="Status"' in s
          assert 'badge.svg?branch=dev-v10-3' in s
          assert 'ROADMAP-98.2%25-d29922' in s
          assert 'DONE-218%2F222' in s
          assert 'STATUS-V10.3%20IN%20PROGRESS-d29922' in s
          assert '| **218** | **4** | **222** | **98.2%** |' in s
          assert '████████████████████ 98.2%' in s
          bar = re.search(r'```text\n([^\n]+)\n```', s).group(1).split()[0]
          assert len(bar) == 20, (bar, len(bar))
      - name: Commit roadmap scope
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'roadmap(v10.3): register adaptive-high-command milestone'
          git push origin HEAD:dev-v10-3
