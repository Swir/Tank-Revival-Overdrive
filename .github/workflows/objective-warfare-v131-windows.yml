name: Dynamic Objective Warfare v13.1 Windows Qualification Gate

on:
  push:
    branches: ['dev-v13-1']
    paths:
      - '.v131-windows-gate-trigger'
      - 'Assets/Scripts/ObjectiveWarfareV131.cs'
      - 'Assets/Scripts/ObjectiveWarfareV131.cs.meta'
      - 'Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs'
      - 'Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs.meta'
      - 'Assets/Scripts/TankGame.cs'
      - 'Assets/Scripts/ConvoyWarfareDirector.cs'
      - 'Assets/Scripts/EncounterWarfareV130.cs'
      - 'Assets/Scripts/EnemyTank.cs'
      - 'Assets/Scripts/Health.cs'
      - 'Assets/Scripts/CombinedArmsMobileFrontDirector.cs'
      - 'Assets/Scripts/OperationalSustainmentDirector.cs'
      - 'Assets/Scripts/LogisticsRouteIntelligenceDirector.cs'
      - 'Assets/Scripts/ReconElectronicWarfareDirector.cs'
      - 'Assets/Scripts/MobileSignalWarfareDirector.cs'
      - 'Assets/Scripts/SignalsIntelligenceFireSupportDirector.cs'
      - '.github/scripts/package_v131_objective_warfare.py'
      - '.github/scripts/test_package_v131_objective_warfare.py'
      - '.github/workflows/objective-warfare-v131-windows.yml'
      - 'CHANGELOG_v13.1.md'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.17f1
  CANDIDATE_ZIP: TankRevivalOverdrive-v13.1-objective-warfare-Windows-x64.zip
  PACKAGE_DIR: tro-v131-package

jobs:
  source-contracts:
    name: Verify v13.1 objective, mutator, authority and roadmap contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch checkout and packager fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'dev-v13-1'
          python -m py_compile .github/scripts/package_v131_objective_warfare.py .github/scripts/test_package_v131_objective_warfare.py
          python .github/scripts/test_package_v131_objective_warfare.py
      - name: Verify implementation and canonical authority integration
        shell: bash
        run: |
          set -euo pipefail
          for f in Assets/Scripts/ObjectiveWarfareV131.cs Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs Assets/Scripts/TankGame.cs Assets/Scripts/ConvoyWarfareDirector.cs Assets/Scripts/EncounterWarfareV130.cs CHANGELOG_v13.1.md; do test -f "$f"; done
          test "$(cat VERSION)" = 'v13.1.0-dev'

          # Deterministic objective catalog, boss safety and bounded mutator budgets.
          grep -q 'PlannedRounds = 100' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'ArchetypeCount = 7' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'MutatorCount = 7' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'MaxConcurrencyDelta = 1' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'MinSpawnScale = 0.90f' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'MaxSpawnScale = 1.12f' Assets/Scripts/ObjectiveWarfareV131.cs
          for kind in Annihilation SectorDefense CommandBreakthrough EmitterHunt SupplyInterception ConvoyRescue Counterattack; do grep -q "$kind" Assets/Scripts/ObjectiveWarfareV131.cs; done
          for mutator in ReinforcementTempo SupplySurge HunterScreen HeavyBreakers SignalFriction ElasticDefense; do grep -q "$mutator" Assets/Scripts/ObjectiveWarfareV131.cs; done
          grep -q 'ConvoyWarfareDirector.HasMissionForRound' Assets/Scripts/ObjectiveWarfareV131.cs
          grep -q 'EncounterReadinessV130 readiness' Assets/Scripts/ObjectiveWarfareV131.cs

          # Live integration remains advisory to TankGame, existing convoy and canonical combat authorities.
          grep -q 'ObjectiveWarfareDirector.EnsureInstalled' Assets/Scripts/TankGame.cs
          grep -q 'ObjectiveWarfareDirector.CanResolveRound' Assets/Scripts/TankGame.cs
          grep -q 'ObjectivePlannerV131.EnemyForObjectiveSpawn' Assets/Scripts/TankGame.cs
          grep -q 'ResolveActiveMaxAlive' Assets/Scripts/TankGame.cs
          grep -q 'ResolveActiveSpawnInterval' Assets/Scripts/TankGame.cs
          grep -q 'NotifyEnemyDestroyed(kind)' Assets/Scripts/TankGame.cs
          grep -q 'NotifyEagleDamaged(amount)' Assets/Scripts/TankGame.cs
          grep -q 'ApplyObjectiveResult' Assets/Scripts/TankGame.cs
          grep -q 'MissionActive =>' Assets/Scripts/ConvoyWarfareDirector.cs
          grep -q 'MissionResolved =>' Assets/Scripts/ConvoyWarfareDirector.cs
          grep -q 'RouteProgress01 =>' Assets/Scripts/ConvoyWarfareDirector.cs

          # v13.1 objective code may observe state and return bounded directives, never own damage/movement/projectiles/economy.
          if grep -Eq '\.Damage\(|\.Heal\(|SpawnProjectile|\.MovePosition\(|AddWarBonds|AwardMissionBonds|BindingFlags\.NonPublic|GetField\(' Assets/Scripts/ObjectiveWarfareV131.cs; then
            echo 'v13.1 objective layer contains forbidden Health/projectile/movement/economy/private-reflection authority.' >&2; exit 1
          fi
          if grep -Eq 'new Rigidbody2D|AddComponent<Rigidbody2D>|AddComponent<Health>|AddComponent<Projectile>' Assets/Scripts/ObjectiveWarfareV131.cs; then
            echo 'v13.1 objective layer creates duplicate gameplay authorities.' >&2; exit 1
          fi

          # Packaged smoke covers all plans, catalogs, cross-system bands and pure state transitions.
          grep -q 'V13_1_OBJECTIVE_WARFARE_OK.txt' Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs
          grep -q 'ObjectivePlannerV131.PlannedRounds' Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs
          grep -q 'archetypeCount != ObjectivePlannerV131.ArchetypeCount' Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs
          grep -q 'mutatorCount < 6' Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs
          grep -q 'cross-system readiness does not influence' Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs
          grep -q 'runtimeTransitions=command/emitter/supply/defense/counter/convoy/annihilation' Assets/Scripts/ObjectiveWarfareCISmokeProbe.cs
      - name: Verify ROADMAP scope and SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for t in ['<!-- ROADMAP-PROGRESS:START -->','<!-- ROADMAP-PROGRESS:END -->','## 📊 Overall progress','| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |']: assert t in s,t
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(391,8,399),(done,open_,total)
          assert 'ROADMAP-98.0%25-yellow' in s and 'DONE-391%2F399' in s and 'STATUS-V13.1%20IN%20DEVELOPMENT-yellow' in s
          assert '███████████████████░ 98.0%' in s and '| **391** | **8** | **399** | **98.0%** |' in s
          section=s[s.index('## v13.1 — Dynamic Objective Warfare & Battlefield Mutators — IN DEVELOPMENT'):]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          print('v13.1 roadmap scope: PASS')

  build-candidate:
    name: Build and package one exact v13.1 Windows x64 candidate
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"; test -n "$UNITY_EMAIL"; test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: V131ObjectiveWarfare-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            V131ObjectiveWarfare-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            V130EncounterWarfare-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            V129ComponentWarfare-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            V128ReleaseTrain-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Dev-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
      - name: Build development player once
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Discover, stage and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/package_v131_objective_warfare.py --build-root build --output-dir "${RUNNER_TEMP}/${PACKAGE_DIR}" --candidate-sha "${GITHUB_SHA}" --commit-sha "${GITHUB_SHA}" --unity-version "${UNITY_VERSION}" --version-file VERSION --zip-name "${CANDIDATE_ZIP}" --diagnostics-path "${GITHUB_WORKSPACE}/V131_OBJECTIVE_WARFARE_BUILD_TREE.txt"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v13.1-objective-warfare-build-discovery
          path: V131_OBJECTIVE_WARFARE_BUILD_TREE.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v13.1-objective-warfare-Windows-x64
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/${{ env.CANDIDATE_ZIP }}
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V131_OBJECTIVE_WARFARE_SHA256.txt
            ${{ runner.temp }}/${{ env.PACKAGE_DIR }}/V131_OBJECTIVE_WARFARE_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14

  packaged-exe-regression:
    name: Run v13.1 plus v13.0/v12.9/v12.8 and 80/90/100 regression on the same EXE
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v13.1-objective-warfare-Windows-x64
          path: candidate
      - name: Verify package digest, provenance and attribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate
          $zip='${{ env.CANDIDATE_ZIP }}'; $expected=((Get-Content V131_OBJECTIVE_WARFARE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant(); $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw 'candidate ZIP digest mismatch'}
          $p=Get-Content V131_OBJECTIVE_WARFARE_PROVENANCE.json -Raw|ConvertFrom-Json
          if($p.candidate_sha -ne '${{ github.sha }}' -or $p.commit_sha -ne '${{ github.sha }}' -or $p.sha256 -ne $actual){throw 'candidate provenance mismatch'}
          Expand-Archive $zip -DestinationPath runtime -Force
          if(!(Test-Path runtime/TankRevivalOverdrive.exe) -or !(Test-Path runtime/TankRevivalOverdrive_Data)){throw 'packaged Unity runtime incomplete'}
          $info=Get-Content runtime/V131_OBJECTIVE_WARFARE_BUILD.txt -Raw; if($info -notmatch 'candidate_sha=${{ github.sha }}'){throw 'runtime attribution mismatch'}
          Write-Host "Verified exact v13.1 candidate SHA256: $actual"
      - name: Run exact single-binary qualification matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location candidate/runtime
          $blocking='Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|UnityException|TargetInvocationException'
          function Invoke-Smoke([string]$Name,[string]$Flag,[string]$Pass,[string]$Fail,[string]$Log,[int]$TimeoutMs){
            Remove-Item $Pass,$Fail,$Log -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics',$Flag,'-logFile',$Log -PassThru
            if(!$p.WaitForExit($TimeoutMs)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "$Name timed out"}
            if(Test-Path $Fail){Get-Content $Fail; if(Test-Path $Log){Get-Content $Log -Tail 350}; throw "$Name emitted FAIL"}
            if(!(Test-Path $Pass)){if(Test-Path $Log){Get-Content $Log -Tail 350}; throw "$Name exited without PASS (exit=$($p.ExitCode))"}
            if($p.ExitCode -ne 0){throw "$Name non-zero exit $($p.ExitCode)"}
            if(Test-Path $Log){if(Select-String -Path $Log -Pattern $blocking -Quiet){Get-Content $Log -Tail 400; throw "$Name blocking exception signature"}}
            Get-Content $Pass; Write-Host "$Name PASS"
          }
          Invoke-Smoke 'v13.1 dynamic objective warfare and mutators' '-tr-v131-smoke' 'V13_1_OBJECTIVE_WARFARE_OK.txt' 'V13_1_OBJECTIVE_WARFARE_FAIL.txt' 'V131Player.log' 80000
          Invoke-Smoke 'v13.0 encounter/cross-stack/boss regression' '-tr-v130-smoke' 'V13_0_ENCOUNTER_WARFARE_OK.txt' 'V13_0_ENCOUNTER_WARFARE_FAIL.txt' 'V130Regression.log' 80000
          Invoke-Smoke 'v12.9 component/repair/casualty/presentation regression' '-tr-v129-smoke' 'V12_9_COMPONENT_DAMAGE_REPAIR_OK.txt' 'V12_9_COMPONENT_DAMAGE_REPAIR_FAIL.txt' 'V129Regression.log' 80000
          Invoke-Smoke 'v12.8 integration regression' '-tr-v128-smoke' 'V12_8_RELEASE_TRAIN_INTEGRATION_OK.txt' 'V12_8_RELEASE_TRAIN_INTEGRATION_FAIL.txt' 'V128Regression.log' 80000
          Invoke-Smoke 'round 80/90/100 soak regression' '-demo-ci-soak' 'DEMO_SOAK_PASS.txt' 'DEMO_SOAK_FAIL.txt' 'V131Soak.log' 110000
          'v13.1 exact-candidate qualification matrix PASS' | Set-Content V13_1_WINDOWS_MATRIX_OK.txt
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v13.1-objective-warfare-diagnostics
          path: |
            candidate/runtime/V13_1_OBJECTIVE_WARFARE_OK.txt
            candidate/runtime/V13_1_OBJECTIVE_WARFARE_FAIL.txt
            candidate/runtime/V13_0_ENCOUNTER_WARFARE_OK.txt
            candidate/runtime/V13_0_ENCOUNTER_WARFARE_FAIL.txt
            candidate/runtime/V12_9_COMPONENT_DAMAGE_REPAIR_OK.txt
            candidate/runtime/V12_9_COMPONENT_DAMAGE_REPAIR_FAIL.txt
            candidate/runtime/V12_8_RELEASE_TRAIN_INTEGRATION_OK.txt
            candidate/runtime/V12_8_RELEASE_TRAIN_INTEGRATION_FAIL.txt
            candidate/runtime/DEMO_SOAK_PASS.txt
            candidate/runtime/DEMO_SOAK_FAIL.txt
            candidate/runtime/V13_1_WINDOWS_MATRIX_OK.txt
            candidate/runtime/V131Player.log
            candidate/runtime/V130Regression.log
            candidate/runtime/V129Regression.log
            candidate/runtime/V128Regression.log
            candidate/runtime/V131Soak.log
          if-no-files-found: ignore
          retention-days: 14
