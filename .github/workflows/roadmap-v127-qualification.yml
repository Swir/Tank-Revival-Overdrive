name: ROADMAP v12.7 Qualification Finalizer

on:
  push:
    branches: ['dev-v12-7']
    paths: ['.v127-roadmap-qualification-trigger']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact qualified Windows candidate
        shell: python
        run: |
          from pathlib import Path
          import json, os, subprocess, urllib.request
          sha=Path('.v127-roadmap-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha.lower()), sha
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha+'..HEAD'],text=True).splitlines()
          allowed={'.v127-roadmap-qualification-trigger'}
          assert set(changed).issubset(allowed), 'Unqualified changes after candidate: '+repr(changed)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+sha+'&per_page=100'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'TankRevival-v127-qualifier'})
          with urllib.request.urlopen(req) as response:
              data=json.load(response)
          matches=[run for run in data.get('workflow_runs',[]) if run.get('name')=='Cinematic Combat Feedback v12.7 Windows Gate' and run.get('head_sha')==sha and run.get('conclusion')=='success']
          assert matches, 'No successful exact v12.7 Windows gate for '+sha
          print('Qualified SHA:',sha,'run:',matches[0]['html_url'])
      - name: Verify qualified v12.7 implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/CinematicCombatFeedbackDirector.cs
          test -f Assets/Scripts/CinematicCombatFeedbackCISmokeProbe.cs
          test -f Assets/Scripts/Projectile.cs
          test -f Assets/Scripts/DamageSmokeEmitter.cs
          test -f Assets/Scripts/BattleAudio.cs
          test -f .github/workflows/cinematic-combat-v127-windows.yml
          test -f CHANGELOG_v12.7.md
          test "$(cat VERSION)" = 'v12.7.0-dev'
          grep -q 'PoolCapacity = 16' Assets/Scripts/CinematicCombatFeedbackDirector.cs
          grep -q 'ImpactMaterial3D' Assets/Scripts/Projectile.cs
          grep -q 'CinematicCombatFeedbackDirector.RequestDamagePulse' Assets/Scripts/DamageSmokeEmitter.cs
          grep -q 'SoundCue.ImpactHard' Assets/Scripts/BattleAudio.cs
          grep -q 'V12_7_CINEMATIC_COMBAT_SMOKE_OK.txt' Assets/Scripts/CinematicCombatFeedbackCISmokeProbe.cs
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-359%2F367' ROADMAP.md
          grep -q 'STATUS-V12.7%20IN%20DEVELOPMENT-yellow' ROADMAP.md
      - name: Finalize v12.7 checklist and dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          assert len(re.findall(r'^'+re.escape(marker)+r'$',s,re.M))==1
          heading='## v12.7 — Cinematic Combat Feedback & Damage Language — IN DEVELOPMENT'
          start=s.index(heading)
          section=s[start:]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED',1).replace('- [ ]','- [x]')
          s=s[:start]+section
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(367,0,367),(done,open_,total)
          pct=round(done*100/total,1); bar='█'*20
          s=re.sub(r'ROADMAP-[0-9.]+%25-[A-Za-z0-9]+',f'ROADMAP-{pct:.1f}%25-brightgreen',s,count=1)
          s=re.sub(r'DONE-[0-9]+%2F[0-9]+',f'DONE-{done}%2F{total}',s,count=1)
          s=re.sub(r'STATUS-V12\.7%20IN%20DEVELOPMENT-yellow',r'STATUS-V12.7%20QUALIFIED-brightgreen',s,count=1)
          s=re.sub(r'(?m)^([█░]{20}) [0-9.]+%$',f'{bar} {pct:.1f}%',s,count=1)
          s=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|',f'| **{done}** | **{open_}** | **{total}** | **{pct:.1f}%** |',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify SWIR roadmap v1 consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for token in ['<!-- ROADMAP-PROGRESS:START -->','<!-- ROADMAP-PROGRESS:END -->','## 📊 Overall progress','| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |']:
              assert token in s, token
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(367,0,367),(done,open_,total)
          assert 'ROADMAP-100.0%25-brightgreen' in s
          assert 'DONE-367%2F367' in s
          assert 'STATUS-V12.7%20QUALIFIED-brightgreen' in s
          assert '████████████████████ 100.0%' in s
          assert '| **367** | **0** | **367** | **100.0%** |' in s
          start=s.index('## v12.7 — Cinematic Combat Feedback & Damage Language — QUALIFIED')
          section=s[start:]
          assert section.count('- [x]')==8 and section.count('- [ ]')==0
          print('SWIR roadmap v1 verified: 367/367, 100.0%, 20/20 bar, v12.7 QUALIFIED')
      - name: Commit qualified roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs(v12.7): qualify Cinematic Combat Feedback milestone"
          git push origin HEAD:dev-v12-7
