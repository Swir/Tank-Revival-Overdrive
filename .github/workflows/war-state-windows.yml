name: War State Windows Gate

on:
  push:
    branches:
      - 'dev-v8-4'
    paths:
      - '.war-state-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-war-state:
    name: Build v8.4 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Validate v8.4 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v8.4.0-dev"
          test -f Assets/Scripts/WarStateCampaignMemoryDirector.cs
          test -f Assets/Scripts/WarStateCampaignMemoryCISmokeProbe.cs
          grep -q "SectorCount = 10" Assets/Scripts/WarStateCampaignMemoryDirector.cs
          grep -q "ResolveMemoryForRound" Assets/Scripts/WarStateCampaignMemoryDirector.cs
          grep -q "RefineEncounter" Assets/Scripts/WarStateCampaignMemoryDirector.cs
          grep -q "VictoryEagleRepair = 2" Assets/Scripts/WarStateCampaignMemoryDirector.cs
          grep -q -- "-war-state-smoke" Assets/Scripts/WarStateCampaignMemoryCISmokeProbe.cs
          echo "v8.4 source gate passed."
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: WarState-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            WarState-Library-${{ runner.os }}-6000.3.17f1-
            OperationChain-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v8.4-war-state-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v8.4-war-state-Windows-x64.zip
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v8.4-war-state-Windows-x64
          path: TankRevival-v8.4-war-state-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v8.4 EXE on Windows
    needs: build-war-state
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v8.4-war-state-Windows-x64
          path: candidate
      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v8.4-war-state-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }
      - name: Run war-state smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item WAR_STATE_PASS.txt, WAR_STATE_FAIL.txt, WarStatePlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-war-state-smoke','-logFile','WarStatePlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'War-state smoke timed out after 60 seconds'
          }
          if (Test-Path 'WAR_STATE_FAIL.txt') {
            Get-Content WAR_STATE_FAIL.txt
            if (Test-Path WarStatePlayer.log) { Get-Content WarStatePlayer.log -Tail 260 }
            throw 'War-state runtime probe reported FAIL'
          }
          if (!(Test-Path 'WAR_STATE_PASS.txt')) {
            if (Test-Path WarStatePlayer.log) { Get-Content WarStatePlayer.log -Tail 260 }
            throw "Runtime exited without war-state PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content WAR_STATE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
