name: ROADMAP v12.6 Qualification Finalizer

on:
  push:
    branches: ['dev-v12-6']
    paths: ['.v126-roadmap-qualification-trigger']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact qualified Windows candidate
        shell: python
        run: |
          from pathlib import Path
          import json, os, subprocess, urllib.request
          sha=Path('.v126-roadmap-qualification-trigger').read_text(encoding='utf-8').strip()
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha.lower()), sha
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha+'..HEAD'],text=True).splitlines()
          allowed={'.v126-roadmap-qualification-trigger'}
          assert set(changed).issubset(allowed), 'Unqualified changes after candidate: '+repr(changed)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+sha+'&per_page=100'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'TankRevival-v126-qualifier'})
          with urllib.request.urlopen(req) as response:
              data=json.load(response)
          matches=[run for run in data.get('workflow_runs',[]) if run.get('name')=='Battlefield Presentation Overdrive v12.6 Windows Gate' and run.get('head_sha')==sha and run.get('conclusion')=='success']
          assert matches, 'No successful exact v12.6 Windows gate for '+sha
          print('Qualified SHA:',sha,'run:',matches[0]['html_url'])
      - name: Verify qualified v12.6 implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          test -f Assets/Scripts/BattlefieldPresentationOverdriveCISmokeProbe.cs
          test -f .github/workflows/battlefield-presentation-v126-windows.yml
          test -f CHANGELOG_v12.6.md
          test "$(cat VERSION)" = 'v12.6.0-dev'
          grep -q 'MaxTelegraphs = 12' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'MaxAlerts = 4' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'TacticalPresentationSnapshot' Assets/Scripts/BattlefieldPresentationOverdriveDirector.cs
          grep -q 'V12_6_BATTLEFIELD_PRESENTATION_SMOKE_OK.txt' Assets/Scripts/BattlefieldPresentationOverdriveCISmokeProbe.cs
          test "$(grep -c '^<!-- SWIR-ROADMAP-STANDARD:v1 -->$' ROADMAP.md)" -eq 1
          grep -q 'DONE-351%2F359' ROADMAP.md
          grep -q 'STATUS-V12.6%20IN%20DEVELOPMENT-yellow' ROADMAP.md
      - name: Finalize v12.6 checklist and dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          assert len(re.findall(r'^'+re.escape(marker)+r'$',s,re.M))==1
          heading='## v12.6 — Battlefield Presentation Overdrive & Unified Tactical HUD — IN DEVELOPMENT'
          start=s.index(heading)
          section=s[start:]
          assert section.count('- [ ]')==8 and section.count('- [x]')==0
          section=section.replace('— IN DEVELOPMENT','— QUALIFIED',1).replace('- [ ]','- [x]')
          s=s[:start]+section
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(359,0,359),(done,open_,total)
          pct=round(done*100/total,1); bar='█'*20
          s=re.sub(r'ROADMAP-[0-9.]+%25-[A-Za-z0-9]+',f'ROADMAP-{pct:.1f}%25-brightgreen',s,count=1)
          s=re.sub(r'DONE-[0-9]+%2F[0-9]+',f'DONE-{done}%2F{total}',s,count=1)
          s=re.sub(r'STATUS-V12\.6%20IN%20DEVELOPMENT-yellow',r'STATUS-V12.6%20QUALIFIED-brightgreen',s,count=1)
          s=re.sub(r'(?m)^([█░]{20}) [0-9.]+%$',f'{bar} {pct:.1f}%',s,count=1)
          s=re.sub(r'\| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9]+\*\* \| \*\*[0-9.]+%\*\* \|',f'| **{done}** | **{open_}** | **{total}** | **{pct:.1f}%** |',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Re-read and verify SWIR roadmap v1 consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('ROADMAP.md').read_text(encoding='utf-8')
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',s,re.M))==1
          for token in ['<!-- ROADMAP-PROGRESS:START -->','<!-- ROADMAP-PROGRESS:END -->','## 📊 Overall progress','| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |']:
              assert token in s, token
          done=len(re.findall(r'^- \[x\] ',s,re.M)); open_=len(re.findall(r'^- \[ \] ',s,re.M)); total=done+open_
          assert (done,open_,total)==(359,0,359),(done,open_,total)
          assert 'ROADMAP-100.0%25-brightgreen' in s
          assert 'DONE-359%2F359' in s
          assert 'STATUS-V12.6%20QUALIFIED-brightgreen' in s
          assert '████████████████████ 100.0%' in s
          assert '| **359** | **0** | **359** | **100.0%** |' in s
          start=s.index('## v12.6 — Battlefield Presentation Overdrive & Unified Tactical HUD — QUALIFIED')
          section=s[start:]
          assert section.count('- [x]')==8 and section.count('- [ ]')==0
          print('SWIR roadmap v1 verified: 359/359, 100.0%, 20/20 bar, v12.6 QUALIFIED')
      - name: Commit qualified roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs(v12.6): qualify Battlefield Presentation milestone"
          git push origin HEAD:dev-v12-6
