name: ROADMAP v10.2 Scope Registrar

on:
  push:
    branches:
      - 'dev-v10-2'
    paths:
      - '.roadmap-v102-scope-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v10-2
      - name: Register unchecked v10.2 scope and preserve SWIR standard
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<!-- ROADMAP-PROGRESS:START -->' in s and '<!-- ROADMAP-PROGRESS:END -->' in s
          assert '## 📊 Overall progress' in s
          assert '## v10.1 — Theater Orders, Operation Branching & Campaign Consequences — COMPLETE' in s
          assert '## v10.2 — Theater Consequence Engine, Sector Doctrines & Branching War State' not in s
          assert len(re.findall(r'^- \[x\] ', s, re.M)) == 214
          assert len(re.findall(r'^- \[ \] ', s, re.M)) == 0
          s = s.replace('badge.svg?branch=dev-v10-1', 'badge.svg?branch=dev-v10-2')
          s = s.replace('ROADMAP-100.0%25-2ea043', 'ROADMAP-98.2%25-d29922')
          s = s.replace('DONE-214%2F214-1f6feb', 'DONE-214%2F218-1f6feb')
          s = s.replace('STATUS-V10.1%20QUALIFIED-2ea043', 'STATUS-V10.2%20IN%20PROGRESS-d29922')
          s = s.replace('████████████████████ 100.0%', '████████████████████ 98.2%', 1)
          s = s.replace('| **214** | **0** | **214** | **100.0%** |', '| **214** | **4** | **218** | **98.2%** |', 1)
          block = '''\n## v10.2 — Theater Consequence Engine, Sector Doctrines & Branching War State — IN PROGRESS\n- [ ] Theater Consequence Engine records a bounded doctrine outcome for each 10-round sector from real v10.1 orders plus existing campaign-memory/command state, then carries that consequence into the following sector instead of discarding it after the short order window.\n- [ ] ASSAULT, INTERDICTION and FORTIFY branch into distinct next-sector gameplay: bounded breakthrough fire support, supply-starvation infrastructure pressure, or prepared-defense sustain through existing TankGame, Projectile, Health and War Bond authority.\n- [ ] Sector doctrine history and theater initiative remain hard-capped, boss-safe and player-readable, with outcomes integrated with v8.4 campaign memory and v10.0 command momentum so success/failure changes later pressure without runaway snowballing.\n- [ ] Packaged Windows v10.2 consequence-engine gate validates all ten sectors, branch transitions/caps, v8.4/v10.0/v10.1 integration, runtime installation and exact EXE boot before qualification.\n'''
          marker = '\n## Development rules\n'
          assert marker in s
          s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate dashboard/checklist consistency
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('ROADMAP.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', s, re.M))
          open_ = len(re.findall(r'^- \[ \] ', s, re.M))
          assert (done, open_) == (214, 4), (done, open_)
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in s
          assert '<img alt="CI"' in s and '<img alt="Roadmap progress"' in s
          assert '<img alt="Completed"' in s and '<img alt="Status"' in s
          assert 'badge.svg?branch=dev-v10-2' in s
          assert 'ROADMAP-98.2%25-d29922' in s
          assert 'DONE-214%2F218' in s
          assert 'STATUS-V10.2%20IN%20PROGRESS-d29922' in s
          assert '| **214** | **4** | **218** | **98.2%** |' in s
          assert '████████████████████ 98.2%' in s
          bar = re.search(r'```text\n([^\n]+)\n```', s).group(1).split()[0]
          assert len(bar) == 20, (bar, len(bar))
      - name: Commit roadmap scope
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'roadmap(v10.2): register consequence-engine milestone'
          git push origin HEAD:dev-v10-2
