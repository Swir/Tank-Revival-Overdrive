name: ROADMAP v11.8 Scope Registrar
on:
  push:
    branches: [dev-v11-8]
    paths: ['.v118-roadmap-scope-trigger']
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v11-8
      - name: Register v11.8 scope and verify SWIR v1 dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('ROADMAP.md'); s=p.read_text(encoding='utf-8')
          marker='<!-- SWIR-ROADMAP-STANDARD:v1 -->'
          assert sum(1 for line in s.splitlines() if line.strip()==marker)==1
          heading='## v11.8 — Reactive Cover Breakthrough & Destructible Tactical Terrain — IN DEVELOPMENT'
          if heading not in s:
              anchor='\n## Development rules\n'
              block='''\n## v11.8 — Reactive Cover Breakthrough & Destructible Tactical Terrain — IN DEVELOPMENT\n- [ ] Obstacle authority gains ammo-aware cover damage profiles so Brick and fortified Steel react differently to Basic/AP/HE/Plasma/EMP without introducing a second damage path.\n- [ ] Fortified Steel can be breached by bounded heavy ordnance while ordinary fire produces readable dents/ricochets instead of silently deleting hard cover.\n- [ ] Bounded recent-breach memory publishes opened lanes, attacker team and ordnance for tactical consumers without taking movement, projectile or round authority.\n- [ ] Breacher/Commander maneuver intent can exploit a nearby valid breach toward Player/Orzełek while EnemyTank/Rigidbody2D remain the sole movement authority.\n- [ ] Existing battlefield artillery can damage nearby cover through the same Obstacle authority, making telegraphed strikes reshape routes for both sides.\n- [ ] Cover integrity, breakthrough and collapse presentation reuses existing Warzone/VisualFactory/DestructionReforge systems and obeys mass-battle FX budgets.\n- [ ] v11.8 runtime/source-contract qualification verifies ammo response, bounded breach memory, AI authority boundaries and unchanged Health/Projectile ownership.\n- [ ] Packaged Windows x64 v11.8 qualification builds and boots the exact candidate, executes reactive-cover smoke checks and rejects blocking exception signatures before qualification.\n'''
              assert anchor in s
              s=s.replace(anchor,block+anchor,1)
          completed=len(re.findall(r'^- \[x\] ',s,re.M)); remaining=len(re.findall(r'^- \[ \] ',s,re.M)); total=completed+remaining
          assert (completed,remaining,total)==(287,8,295),(completed,remaining,total)
          pct=round(completed*100/total,1); filled=round(20*completed/total); bar='█'*filled+'░'*(20-filled)
          start=s.index('<!-- ROADMAP-PROGRESS:START -->'); end=s.index('<!-- ROADMAP-PROGRESS:END -->')+len('<!-- ROADMAP-PROGRESS:END -->')
          dashboard=f'''<!-- ROADMAP-PROGRESS:START -->\n<p align="center">\n  <a href="https://github.com/Swir/Tank-Revival-Overdrive/actions/workflows/dev-windows-build.yml"><img alt="CI" src="https://github.com/Swir/Tank-Revival-Overdrive/actions/workflows/dev-windows-build.yml/badge.svg?branch=dev-v11-8"></a>\n  <img alt="Roadmap progress" src="https://img.shields.io/badge/ROADMAP-{pct:.1f}%25-brightgreen?style=for-the-badge">\n  <img alt="Completed" src="https://img.shields.io/badge/DONE-{completed}%2F{total}-1f6feb?style=for-the-badge">\n  <img alt="Status" src="https://img.shields.io/badge/STATUS-V11.8%20IN%20DEVELOPMENT-yellow?style=for-the-badge">\n</p>\n\n## 📊 Overall progress\n\n```text\n{bar} {pct:.1f}%\n```\n\n| ✅ Completed | ⏳ Remaining | 📦 Total | 🎯 Progress |\n|---:|---:|---:|---:|\n| **{completed}** | **{remaining}** | **{total}** | **{pct:.1f}%** |\n\n> **Progress rule:** calculate progress from explicit roadmap deliverables only: `[x] / ([x] + [ ])`. Update the checklist first, then badges, numbers, percentage and the 20-segment bar. Never estimate progress from version numbers, commit count, elapsed time or activity.\n<!-- ROADMAP-PROGRESS:END -->'''
          s=s[:start]+dashboard+s[end:]
          p.write_text(s,encoding='utf-8')
          r=p.read_text(encoding='utf-8')
          assert heading in r
          assert 'DONE-287%2F295' in r
          assert 'STATUS-V11.8%20IN%20DEVELOPMENT-yellow' in r
          assert '███████████████████░ 97.3%' in r
          assert '| **287** | **8** | **295** | **97.3%** |' in r
          assert len(re.findall(r'^<!-- SWIR-ROADMAP-STANDARD:v1 -->$',r,re.M))==1
      - name: Commit roadmap scope
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs(v11.8): register reactive cover breakthrough milestone'
          git push
