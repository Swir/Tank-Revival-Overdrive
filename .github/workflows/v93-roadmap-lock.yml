name: ROADMAP v9.3 Qualification Lock

on:
  push:
    branches:
      - 'dev-v9-3'
    paths:
      - '.roadmap-v93-lock-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v9-3
          fetch-depth: 0
      - name: Verify qualified Windows runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          siege=$(gh api repos/${{ github.repository }}/actions/runs/34834509971 --jq '.conclusion')
          dev=$(gh api repos/${{ github.repository }}/actions/runs/34834498866 --jq '.conclusion')
          test "$siege" = success
          test "$dev" = success
      - name: Lock verified v9.3 deliverables
        shell: python
        run: |
          from pathlib import Path
          p=Path('ROADMAP.md')
          s=p.read_text(encoding='utf-8')
          old='## v9.3 — Siege Lines, Counter-Battery Warfare & Breach Operations — IN PROGRESS'
          new='## v9.3 — Siege Lines, Counter-Battery Warfare & Breach Operations — COMPLETE'
          if old not in s and new not in s:
              raise SystemExit('v9.3 section missing')
          s=s.replace(old,new)
          start=s.index(new)
          end=s.index('\n## Development rules',start)
          block=s[start:end].replace('- [ ]','- [x]')
          s=s[:start]+block+s[end:]
          s=s.replace('ROADMAP-98.0%25-d29922','ROADMAP-100.0%25-2ea043')
          s=s.replace('DONE-194%2F198-1f6feb','DONE-198%2F198-1f6feb')
          s=s.replace('STATUS-V9.3%20IN%20PROGRESS-d29922','STATUS-V9.3%20QUALIFIED-2ea043')
          s=s.replace('████████████████████ 98.0%','████████████████████ 100.0%')
          s=s.replace('| **194** | **4** | **198** | **98.0%** |','| **198** | **0** | **198** | **100.0%** |')
          p.write_text(s,encoding='utf-8')
      - name: Re-read and validate SWIR Roadmap Standard v1
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!-- SWIR-ROADMAP-STANDARD:v1 -->' ROADMAP.md
          grep -q '<!-- ROADMAP-PROGRESS:START -->' ROADMAP.md
          grep -q '<!-- ROADMAP-PROGRESS:END -->' ROADMAP.md
          grep -q 'badge.svg?branch=dev-v9-3' ROADMAP.md
          grep -q 'ROADMAP-100.0%25-2ea043' ROADMAP.md
          grep -q 'DONE-198%2F198-1f6feb' ROADMAP.md
          grep -q 'STATUS-V9.3%20QUALIFIED-2ea043' ROADMAP.md
          grep -q '## 📊 Overall progress' ROADMAP.md
          grep -q '████████████████████ 100.0%' ROADMAP.md
          test "$(grep -c '^- \[x\]' ROADMAP.md)" -eq 198
          test "$(grep -c '^- \[ \]' ROADMAP.md)" -eq 0
          grep -q '| \*\*198\*\* | \*\*0\*\* | \*\*198\*\* | \*\*100.0%\*\* |' ROADMAP.md
      - name: Commit qualified roadmap
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'roadmap(v9.3): qualify siege-line milestone'
          git push origin HEAD:dev-v9-3
