name: High Command Finale v10.8 Windows Gate

on:
  push:
    branches:
      - 'dev-v10-8'
    paths:
      - '.high-command-finale-v108-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build exact v10.8 Windows x64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify v10.8 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "v10.8.0-dev"
          test -f Assets/Scripts/HighCommandFinaleDirector.cs
          test -f Assets/Scripts/HighCommandFinaleCISmokeProbe.cs
          grep -q 'HighCommandFinaleDirector_v10_8' Assets/Scripts/HighCommandFinaleDirector.cs
          grep -q 'ENEMY_HIGH_COMMAND_HQ_V108' Assets/Scripts/HighCommandFinaleDirector.cs
          grep -q 'WarStateEndgameDirector.Instance' Assets/Scripts/HighCommandFinaleDirector.cs
          grep -q 'ObjectiveStartRound = 97' Assets/Scripts/HighCommandFinaleDirector.cs
          grep -q 'FinalRound = 100' Assets/Scripts/HighCommandFinaleDirector.cs
          grep -q 'BoxCollider2D' Assets/Scripts/HighCommandFinaleDirector.cs
          grep -q 'AddComponent<Health>' Assets/Scripts/HighCommandFinaleDirector.cs
          grep -q '## v10.8 — High Command HQ, Final Objectives & Campaign Epilogues — IN PROGRESS' ROADMAP.md
          grep -q 'DONE-239%2F244' ROADMAP.md
          grep -q 'SWIR-ROADMAP-STANDARD:v1' ROADMAP.md
      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: v108-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            v108-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-
      - name: Build Windows x64 candidate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true
      - name: Verify and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f build/StandaloneWindows64/TankRevivalOverdrive.exe
          test -d build/StandaloneWindows64/TankRevivalOverdrive_Data
          cd build/StandaloneWindows64
          zip -r ../../TankRevivalOverdrive-v10.8-candidate-Windows-x64.zip .
          cd ../..
          test -s TankRevivalOverdrive-v10.8-candidate-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.8-candidate-Windows-x64
          path: TankRevivalOverdrive-v10.8-candidate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  packaged-exe-smoke:
    name: Boot exact v10.8 candidate and validate High Command finale
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TankRevivalOverdrive-v10.8-candidate-Windows-x64
          path: candidate
      - name: Extract exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevivalOverdrive-v10.8-candidate-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data directory missing after extraction' }
      - name: Run v10.8 High Command finale packaged smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item HIGH_COMMAND_FINALE_PASS.txt, HIGH_COMMAND_FINALE_FAIL.txt, HighCommandPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-high-command-finale-smoke','-logFile','HighCommandPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'v10.8 High Command finale smoke timed out after 60 seconds'
          }
          if (Test-Path 'HIGH_COMMAND_FINALE_FAIL.txt') {
            Get-Content HIGH_COMMAND_FINALE_FAIL.txt
            if (Test-Path HighCommandPlayer.log) { Get-Content HighCommandPlayer.log -Tail 240 }
            throw 'v10.8 High Command finale runtime probe reported FAIL'
          }
          if (!(Test-Path 'HIGH_COMMAND_FINALE_PASS.txt')) {
            if (Test-Path HighCommandPlayer.log) { Get-Content HighCommandPlayer.log -Tail 240 }
            throw "Runtime exited without v10.8 PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content HIGH_COMMAND_FINALE_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Test-Path HighCommandPlayer.log) {
            if (Select-String -Path HighCommandPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException|Compilation failed' -Quiet) {
              Get-Content HighCommandPlayer.log -Tail 260
              throw 'Blocking exception signature found during v10.8 runtime smoke'
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v10.8-high-command-diagnostics
          path: |
            candidate/runtime/HIGH_COMMAND_FINALE_PASS.txt
            candidate/runtime/HIGH_COMMAND_FINALE_FAIL.txt
            candidate/runtime/HighCommandPlayer.log
          if-no-files-found: ignore
          retention-days: 14
