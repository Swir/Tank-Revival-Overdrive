name: Adaptive Fire Control Windows Gate

on:
  push:
    branches:
      - 'dev-v7-5'
    paths:
      - '.adaptive-fire-control-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-adaptive-fire-control:
    name: Build v7.5 Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Validate v7.5 source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v7.5.0-dev"
          test -f Assets/Scripts/AdaptiveFireControlDirector.cs
          test -f Assets/Scripts/AdaptiveFireControlCISmokeProbe.cs
          grep -q "MaximumPredictionSeconds = 0.72f" Assets/Scripts/AdaptiveFireControlDirector.cs
          grep -q "SuppressionLaneHalfWidth = 1.35f" Assets/Scripts/AdaptiveFireControlDirector.cs
          grep -q "MaxShotsPerSequenceBeat = 5" Assets/Scripts/AdaptiveFireControlDirector.cs
          grep -q "CombinedManeuverPhase" Assets/Scripts/AdaptiveFireControlDirector.cs
          grep -q "TankGame" Assets/Scripts/AdaptiveFireControlDirector.cs
          grep -q "SpawnProjectile" Assets/Scripts/AdaptiveFireControlDirector.cs
          grep -q "RuntimeBattleRegistry.EnemySnapshot" Assets/Scripts/AdaptiveFireControlDirector.cs
          grep -q -- "-adaptive-fire-control-smoke" Assets/Scripts/AdaptiveFireControlCISmokeProbe.cs
          echo "v7.5 source gate passed."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: AdaptiveFireControl-Library-${{ runner.os }}-6000.3.17f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            AdaptiveFireControl-Library-${{ runner.os }}-6000.3.17f1-
            TerrainIntelligence-Library-${{ runner.os }}-6000.3.17f1-
            TacticalNavigation-Library-${{ runner.os }}-6000.3.17f1-
            Dev-Library-${{ runner.os }}-6000.3.17f1-

      - name: Build development Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.17f1
          targetPlatform: StandaloneWindows64
          buildMethod: TankRevival.Editor.CIBuild.BuildWindows
          allowDirtyBuild: true

      - name: Verify and pack candidate
        shell: bash
        run: |
          set -euo pipefail
          root=build/StandaloneWindows64
          test -f "$root/TankRevivalOverdrive.exe"
          test -d "$root/TankRevivalOverdrive_Data"
          cd "$root"
          zip -r ../../TankRevival-v7.5-adaptive-fire-control-Windows-x64.zip .
          cd ../..
          test -s TankRevival-v7.5-adaptive-fire-control-Windows-x64.zip

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.5-adaptive-fire-control-Windows-x64
          path: TankRevival-v7.5-adaptive-fire-control-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: Boot exact v7.5 EXE on Windows
    needs: build-adaptive-fire-control
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: TankRevival-v7.5-adaptive-fire-control-Windows-x64
          path: candidate

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          Expand-Archive 'TankRevival-v7.5-adaptive-fire-control-Windows-x64.zip' -DestinationPath runtime -Force
          if (!(Test-Path 'runtime/TankRevivalOverdrive.exe')) { throw 'EXE missing after extraction' }
          if (!(Test-Path 'runtime/TankRevivalOverdrive_Data')) { throw 'Unity data missing after extraction' }

      - name: Run adaptive fire control smoke probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate/runtime
          Remove-Item ADAPTIVE_FIRE_CONTROL_PASS.txt, ADAPTIVE_FIRE_CONTROL_FAIL.txt, AdaptiveFireControlPlayer.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\TankRevivalOverdrive.exe' -ArgumentList '-batchmode','-nographics','-adaptive-fire-control-smoke','-logFile','AdaptiveFireControlPlayer.log' -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Adaptive fire control smoke timed out after 60 seconds'
          }
          if (Test-Path 'ADAPTIVE_FIRE_CONTROL_FAIL.txt') {
            Get-Content ADAPTIVE_FIRE_CONTROL_FAIL.txt
            if (Test-Path AdaptiveFireControlPlayer.log) { Get-Content AdaptiveFireControlPlayer.log -Tail 220 }
            throw 'Adaptive fire control runtime probe reported FAIL'
          }
          if (!(Test-Path 'ADAPTIVE_FIRE_CONTROL_PASS.txt')) {
            if (Test-Path AdaptiveFireControlPlayer.log) { Get-Content AdaptiveFireControlPlayer.log -Tail 220 }
            throw "Runtime exited without adaptive fire control PASS marker (exit=$($p.ExitCode))"
          }
          Get-Content ADAPTIVE_FIRE_CONTROL_PASS.txt
          if ($p.ExitCode -ne 0) { throw "Runtime returned non-zero exit code $($p.ExitCode)" }
          if (Select-String -Path AdaptiveFireControlPlayer.log -Pattern 'Crash!!!|NullReferenceException|MissingMethodException|TypeLoadException|IndexOutOfRangeException' -Quiet) {
            Get-Content AdaptiveFireControlPlayer.log -Tail 260
            throw 'Blocking exception signature found during adaptive fire control smoke'
          }
          Write-Host 'v7.5 adaptive fire control runtime smoke passed.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TankRevival-v7.5-adaptive-fire-control-diagnostics
          path: |
            candidate/runtime/ADAPTIVE_FIRE_CONTROL_PASS.txt
            candidate/runtime/ADAPTIVE_FIRE_CONTROL_FAIL.txt
            candidate/runtime/AdaptiveFireControlPlayer.log
          if-no-files-found: ignore
          retention-days: 14
