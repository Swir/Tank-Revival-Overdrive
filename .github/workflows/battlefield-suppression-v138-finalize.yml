name: ROADMAP v13.8 Qualification Finalizer

on:
  push:
    branches: ['dev-v13-8']
    paths:
      - 'Tools/finalize_v138_roadmap.py'
      - '.github/workflows/battlefield-suppression-v138-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  QUALIFIED_SHA: '0805a27a7a69a0d620e96f64e6cac66185be6547'
  QUALIFIED_RUN: '35413636894'
  QUALIFIED_WORKFLOW: 'Battlefield Suppression v13.8 Windows Qualification Gate'
  CANDIDATE_ARTIFACT_ID: '10575925003'
  CANDIDATE_ARTIFACT_NAME: 'TankRevivalOverdrive-v13.8-suppression-morale-Windows-x64'
  CANDIDATE_ARTIFACT_BYTES: '60261926'
  CANDIDATE_ARTIFACT_DIGEST: 'sha256:4f6e98ee70dfb6d888bff7aba70075fd26977006b5833967da82dbc99b9ce6fa'

jobs:
  finalize:
    name: Verify exact v13.8 evidence and finalize roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev-v13-8
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact successful Windows qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$QUALIFIED_SHA" HEAD
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          run_id = os.environ['QUALIFIED_RUN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          expected = {
              'head_sha': os.environ['QUALIFIED_SHA'],
              'head_branch': 'dev-v13-8',
              'name': os.environ['QUALIFIED_WORKFLOW'],
              'status': 'completed',
              'conclusion': 'success',
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f'qualification run mismatch for {key}: {run.get(key)!r} != {value!r}')

          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              artifacts = json.load(response).get('artifacts', [])
          artifact = next((a for a in artifacts if str(a.get('id')) == os.environ['CANDIDATE_ARTIFACT_ID']), None)
          if not artifact:
              raise SystemExit('qualified candidate artifact missing')
          checks = {
              'name': os.environ['CANDIDATE_ARTIFACT_NAME'],
              'size_in_bytes': int(os.environ['CANDIDATE_ARTIFACT_BYTES']),
              'digest': os.environ['CANDIDATE_ARTIFACT_DIGEST'],
              'expired': False,
          }
          for key, value in checks.items():
              if artifact.get(key) != value:
                  raise SystemExit(f'candidate artifact mismatch for {key}: {artifact.get(key)!r} != {value!r}')
          if artifact.get('workflow_run', {}).get('head_sha') != os.environ['QUALIFIED_SHA']:
              raise SystemExit('candidate artifact does not belong to exact qualified SHA')
          print('Exact v13.8 Windows qualification evidence: PASS')
          PY

      - name: Finalize authoritative roadmap and README
        run: |
          python -m py_compile Tools/finalize_v138_roadmap.py
          python Tools/finalize_v138_roadmap.py \
            --qualified-sha "$QUALIFIED_SHA" \
            --qualified-run "$QUALIFIED_RUN" \
            --finalizer-run "$GITHUB_RUN_ID"

      - name: Regenerate and verify SWIR Progress SVG Pro
        run: |
          python Tools/generate_progress_svgs.py --write
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check

      - name: Re-verify v13.8 implementation contracts
        run: |
          python Tools/verify_v138_suppression_morale.py
          python Tools/verify_csharp_type_uniqueness.py

      - name: Verify closed-state roadmap math
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          done = len(re.findall(r'^- \[x\] ', roadmap, re.M))
          open_ = len(re.findall(r'^- \[ \] ', roadmap, re.M))
          assert (done, open_, done + open_) == (455, 0, 455), (done, open_)
          assert '| **455** | **0** | **455** | **100.0%** |' in roadmap
          assert 'STATUS-V13.8%20QUALIFIED-brightgreen' in roadmap
          assert '## v13.8 — Battlefield Suppression & Morale Warfare — QUALIFIED' in roadmap
          assert '**455 / 455 completed (100.0%)**' in readme
          assert 'V13.8 QUALIFIED' in readme
          assert '0805a27a7a69a0d620e96f64e6cac66185be6547' in readme
          assert '35413636894' in readme
          print('v13.8 closed-state math/readback: PASS')
          PY

      - name: Commit verified finalization
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No finalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md README.md assets/readme/progress-card.svg assets/readme/progress-mini.svg docs/qualification/V13_8_WINDOWS_QUALIFICATION.md
          git diff --cached --check
          git commit -m 'docs(v13.8): finalize qualified suppression milestone'
          git push origin HEAD:dev-v13-8
