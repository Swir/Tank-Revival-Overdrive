name: Apply v13.5 Weather Integration

on:
  push:
    branches:
      - dev-v13-5
    paths:
      - 'Tools/apply_v135_weather_integration.py'
      - '.github/workflows/apply-v135-weather-integration.yml'

permissions:
  contents: write

concurrency:
  group: apply-v135-weather-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-canonical-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify weather integration
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Tools/apply_v135_weather_integration.py Tools/verify_v135_battlefield_weather.py Tools/verify_csharp_type_uniqueness.py
          python Tools/apply_v135_weather_integration.py
          python Tools/verify_v135_battlefield_weather.py
          python Tools/verify_csharp_type_uniqueness.py
          python Tools/generate_progress_svgs.py --check
          python Tools/swir_visual_report_guard.py --check

      - name: Commit canonical gameplay integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Assets/Scripts/PlayerTank.cs Assets/Scripts/EnemyTank.cs VERSION; then
            echo 'Weather integration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/PlayerTank.cs Assets/Scripts/EnemyTank.cs VERSION
          git commit -m 'feat(v13.5): integrate weather into canonical movement and gunnery'
          git push origin HEAD:dev-v13-5
